<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PatchTown Works</title>
<meta name="description" content="A live 3D town that shows how the PatchTown AI studio builds software: builders, tests, commits and what is live.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* PatchTown Works v1.1 ("truth and glance"). The 3D town fills the screen and the camera stands still.
   Top left: the mood line (one rules-written sentence, the biggest text on screen), "since you looked" (3 lines) and a
   few buttons. Just above the timeline: the freshness strip (how old each data source is). The diary and the cards
   open only on demand. Type on the wall is sized from screen height: 1rem = 1/45 of the height (the smallest text
   allowed), labels 1.5rem (1/30), the mood line 3.2rem (1/14). One font, sentence case, no capitals rows.
   States use Okabe-Ito colours, and every state also has a shape and a word (colour is never the only signal). */
:root {
  --night: #18233a; --night2: #1d2b44;
  --ink: #f4ead8; --muted: #c6c0d4; --dim: #a3a7bd;
  --lantern: #ffb44a;
  /* state colours (Okabe-Ito) */
  --ok: #009E73; --busy: #E69F00; --bad: #D55E00; --need: #56B4E9; --idle: #8E93AB; --half: #F0E442; --old: #b59a72;
  --ok-t: #7fe0bf; --bad-t: #ffb08a; --need-t: #a9dcf7; --busy-t: #ffd27a;
  --panel: rgba(16, 22, 38, 0.9);
  --line: rgba(244, 234, 216, 0.18);
  --tl-h: 4.6rem; --fr-h: 1.9rem;
  --f-body: "Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  color-scheme: dark;
}
/* the wall scale: 1rem is 1/45 of the screen height (nothing smaller is ever drawn), capped by width on odd shapes */
html { font-size: clamp(14px, min(calc(100vh / 45), calc(100vw / 52)), 64px); height: 100%; }
body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font: 1rem/1.4 var(--f-body); letter-spacing: 0.01em; overflow: hidden; }
body.day { --panel: rgba(14, 20, 36, 0.92); background: #9cc8e8; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* state symbols: shape + colour, always next to a word */
.sym { display: inline-block; flex: none; width: 0.78em; height: 0.78em; margin-right: 0.4em; vertical-align: -0.06em; position: relative; box-sizing: border-box; }
.s-done { background: var(--ok); border-radius: 2px; }
.s-done::after { content: ""; position: absolute; left: 30%; top: 8%; width: 28%; height: 55%; border: solid #fff; border-width: 0 0.14em 0.14em 0; transform: rotate(45deg); }
.s-fail::before, .s-fail::after { content: ""; position: absolute; left: 40%; top: -8%; width: 22%; height: 116%; background: var(--bad); border-radius: 2px; transform: rotate(45deg); }
.s-fail::after { transform: rotate(-45deg); }
.s-busy { background: var(--busy); border-radius: 50%; }
.s-need { background: var(--need); transform: rotate(45deg) scale(0.86); border-radius: 2px; }
.s-idle { border: 0.13em solid var(--idle); border-radius: 50%; }
.s-half { border: 0.12em solid var(--half); border-radius: 50%; background: linear-gradient(90deg, var(--half) 50%, transparent 50%); }
.s-late { width: 0.86em; background: var(--busy); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.s-old { border: 0.13em dashed var(--old); border-radius: 2px; }

/* labels over the buildings (1/30 of the height) */
.lab { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 1.5rem/1.15 var(--f-body); color: var(--ink);
  background: rgba(14, 20, 34, 0.86); border: 1px solid var(--line); padding: 0.2rem 0.6rem 0.25rem; border-radius: 0.6rem; pointer-events: auto; cursor: pointer; }
.lab small { display: block; font-weight: 400; font-size: 1rem; color: var(--muted); }
.lab.st-done { border-color: rgba(0, 158, 115, 0.9); }
.lab.st-fail { border-color: rgba(213, 94, 0, 0.95); }
.lab.st-idle { color: var(--muted); font-weight: 400; }
.lab.tiny, .lab.chip { font-size: 1rem; font-weight: 400; padding: 0.15rem 0.45rem; }
.lab.chip { cursor: default; background: rgba(29, 43, 68, 0.9); pointer-events: none; }
.lab.chip b { font-weight: 700; margin-right: 0.35rem; }
.lab.sample, .chips.sample span, .sample-block { filter: sepia(0.6) grayscale(0.4); opacity: 0.85; }
.lab:focus-visible { outline: 2px solid var(--lantern); }
.age { display: inline-block; margin-left: 0.4rem; font-size: 1rem; font-weight: 400; color: var(--old); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0.8rem; }
/* the glance panel: mood line, since you looked, buttons */
.glance { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: fit-content; max-width: min(56rem, 62vw); box-sizing: border-box; padding: 0.5rem 1rem 0.6rem; }
.eyebrow { font-size: 1rem; color: var(--muted); margin: 0; }
.eyebrow b { color: var(--ink); }
#mood { font: 700 3.2rem/1.08 var(--f-body); margin: 0.15rem 0 0.3rem; letter-spacing: -0.005em; }
#mood .m-bad { color: var(--bad-t); } #mood .m-need { color: var(--need-t); } #mood .m-ok { color: var(--ok-t); } #mood .m-old { color: var(--old); }
.since { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--tl-h) + var(--fr-h) + 12px); max-width: min(40rem, 44vw); box-sizing: border-box; padding: 0.4rem 0.9rem 0.5rem; }
.since h2 { font-size: 1rem; font-weight: 400; color: var(--muted); margin: 0 0 0.1rem; }
.since ol { list-style: none; margin: 0; padding: 0; }
.since li { display: flex; align-items: baseline; gap: 0.2rem; font-size: 1.6rem; line-height: 1.3; min-width: 0; }
.since li span.w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.since li time { flex: none; color: var(--dim); font-size: 1.2rem; margin-left: 0.6rem; font-variant-numeric: tabular-nums; }
.since li.t .w { opacity: 0.75; }
.btns { display: flex; gap: 0.45rem; margin-top: 0.55rem; flex-wrap: wrap; }
button { font: 700 1rem/1 var(--f-body); color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 0.45rem 0.8rem; cursor: pointer; min-height: 2.2rem; }
button:hover { background: rgba(255,255,255,.15); }
button[aria-pressed="true"] { background: rgba(255,180,74,.22); border-color: rgba(255,180,74,.6); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
#bAsk { background: rgba(86,180,233,.18); border-color: rgba(86,180,233,.7); }
#bAsk.none { background: rgba(255,255,255,.08); border-color: var(--line); }

/* the freshness strip: how old each source is; old sources are grey and say so */
.fresh { position: fixed; left: 0; right: 0; bottom: var(--tl-h); min-height: var(--fr-h); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 0.1rem 1.1rem;
  padding: 0.2rem max(16px, env(safe-area-inset-right, 0px)) 0.2rem max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 14, 26, 0.88); border-top: 1px solid var(--line); font-size: 1rem; color: var(--muted); }
.fresh .fr { white-space: nowrap; }
.fresh .fr b { color: var(--ink); font-weight: 700; }
.fresh .fr.old { color: var(--dim); filter: grayscale(1); }
.fresh .fr.old b { color: var(--dim); }
.fresh .fr.bad b { color: var(--bad-t); }
.fresh .lbl { color: var(--dim); }

.diary { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tl-h) + var(--fr-h) + 12px);
  width: min(30rem, 34vw); box-sizing: border-box; padding: 0.7rem 0.9rem; overflow: auto; }
.diary h2, .card h2 { font: 700 1.5rem/1.15 var(--f-body); margin: 0.15rem 0 0.5rem; }
.ev { display: grid; grid-template-columns: 3.2rem 1fr; gap: 0.5rem; padding: 0.4rem 0; border-top: 1px solid var(--line); }
.ev time { font-size: 1rem; line-height: 1.4; color: var(--dim); font-variant-numeric: tabular-nums; }
.ev p { margin: 0; font-size: 1rem; min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.ev .who { color: var(--dim); }
.ev.v p { color: #eafbf3; font-weight: 700; } .ev.w p { color: #fff0c4; font-weight: 700; } .ev.f p { color: #ffd9c4; } .ev.h p { color: var(--ink); }

.card { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--tl-h) + var(--fr-h) + 12px); width: min(44rem, calc(100% - 32px)); box-sizing: border-box;
  padding: 0.7rem 1rem; max-height: 60%; overflow: auto; }
.card .close { float: right; margin-left: 0.5rem; }
.card h3 { font-size: 1.15rem; font-weight: 700; color: var(--muted); margin: 0.8rem 0 0.3rem; }
.card ul { list-style: none; margin: 0; padding: 0; }
.card li { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0.5rem; padding: 0.3rem 0; border-top: 1px solid var(--line); font-size: 1.1rem; }
.card li time { font-size: 1rem; line-height: 1.5; color: var(--dim); }
.card li span { min-width: 0; overflow-wrap: anywhere; }
.card li.v span { color: #eafbf3; font-weight: 700; } .card li.f span { color: #ffd9c4; } .card li.q span { color: var(--muted); }
.card a { color: #ffd39a; }
.card .note { font-size: 1rem; color: var(--muted); margin-top: 0.6rem; }
.card .sub, .diary .sub { color: var(--muted); margin: 0.2rem 0; }
.ev.t, .card li.t { opacity: 0.72; }
.ev.t p, .card li.t span { border-left: 2px dotted var(--dim); padding-left: 0.4rem; }
.trust { font-size: 1rem; color: var(--dim); margin-left: 0.3rem; }
.mx { overflow-x: auto; } .mx table { border-collapse: collapse; font-size: 1.05rem; } .mx th, .mx td { padding: 0.2rem 0.45rem; text-align: left; white-space: nowrap; }
.mx th { color: var(--muted); font-weight: 700; } .mx td small { display: block; color: var(--dim); font-size: 1rem; }
.mx td.nr { color: var(--dim); }
.heads { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: 0.3rem 0.8rem; }
.heads div { display: flex; gap: 0.3rem; align-items: baseline; font-size: 1rem; min-width: 0; }
.heads small { color: var(--dim); font-size: 1rem; }
.sqrow { margin: 0.35rem 0 0.6rem; } .sqrow .lbl { font-size: 1rem; font-weight: 700; }
.sqrow .sqs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.2rem 0; }
.sqrow .tell { font-size: 1rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chips span { background: var(--night2); border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 1rem; }
.chips b { margin-right: 0.3rem; }
.mach { display: grid; grid-template-columns: 0.4rem 1fr; gap: 0.6rem; padding: 0.35rem 0; border-top: 1px solid var(--line); font-size: 1rem; }
.mach > i { border-radius: 3px; } .mach b { font-size: 1.1rem; } .mach small { color: var(--muted); display: block; font-size: 1rem; }
.fox { color: var(--busy-t); font-weight: 700; }
/* Harry's question board */
.ask { border-top: 1px solid var(--line); padding: 0.45rem 0 0.5rem; }
.ask .q { font-size: 1.2rem; font-weight: 700; }
.ask .d { font-size: 1rem; color: var(--muted); }
.ask .d b { color: var(--ink); }
.ask.a1 .q { color: #fff3d6; } .ask.a3 .q { color: #ffe08a; } .ask.a7 .q { color: #e3b98a; }
.ask .id { display: inline-block; min-width: 2.2rem; color: var(--need-t); }
/* order wagons */
.ord { display: grid; grid-template-columns: 1.2rem 1fr; gap: 0.3rem; padding: 0.35rem 0; border-top: 1px solid var(--line); font-size: 1.1rem; }
.ord small { display: block; color: var(--muted); font-size: 1rem; }

.timeline { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tl-h); box-sizing: border-box; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 0.4rem 0.9rem;
  background: rgba(10, 14, 26, 0.94); border-top: 1px solid var(--line);
  padding: 0.3rem max(16px, env(safe-area-inset-right, 0px)) calc(0.3rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.daysel { display: flex; align-items: center; gap: 0.3rem; }
.daysel b { font-size: 1.1rem; min-width: 6rem; text-align: center; }
.daysel button { padding: 0.4rem 0.6rem; }
.track { position: relative; min-width: 0; }
.ticks { position: absolute; left: 0.5rem; right: 0.5rem; top: 0; height: 0.6rem; pointer-events: none; }
.tk { position: absolute; top: 0; width: 3px; height: 0.55rem; margin-left: -1px; border-radius: 2px; background: var(--idle); }
.tk.v { background: var(--ok); height: 0.7rem; } .tk.w { background: var(--half); height: 0.8rem; } .tk.f { background: var(--bad); width: 5px; height: 0.8rem; }
.tk.o { background: var(--busy); } .tk.c { background: #6c7ea8; }
input[type=range] { width: 100%; margin: 0.6rem 0 0.1rem; accent-color: var(--lantern); height: 1.4rem; }
.tlrow { display: flex; gap: 0.7rem; align-items: baseline; min-width: 0; }
.tlrow .clock { flex: none; font-size: 1.15rem; font-weight: 700; color: var(--lantern); font-variant-numeric: tabular-nums; }
.tlrow p { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#bLive[aria-pressed="true"] { background: rgba(0,158,115,.25); border-color: rgba(0,158,115,.85); }
.skip { position: absolute; left: -9999px; }

/* phone (Pocket): px sizes with a 15px floor; the answer on top, the town in the middle, the timeline at the bottom */
@media (max-width: 760px) {
  html { font-size: 15px; }
  :root { --tl-h: 7.2rem; --fr-h: 2.6rem; }
  .glance { width: auto; max-width: none; right: max(16px, env(safe-area-inset-right, 0px)); padding: 0.5rem 0.75rem 0.6rem; }
  .since { right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; padding: 0.35rem 0.7rem 0.4rem; }
  #mood { font-size: 28px; line-height: 1.15; }
  .since li { font-size: 16px; } .since li time { font-size: 15px; }
  .btns { gap: 0.35rem; margin-top: 0.45rem; } .btns button { padding: 0.45rem 0.7rem; }
  .lab { font-size: 16px; } .lab small { font-size: 15px; }
  .diary { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; top: auto; max-height: 45%; }
  .card { right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 55%; }
  .fresh { gap: 0 0.7rem; padding-top: 0.15rem; padding-bottom: 0.15rem; }
  .fresh .lbl { display: none; }
  .timeline { grid-template-columns: auto auto 1fr; grid-template-rows: auto auto; }
  .track { grid-column: 1 / -1; grid-row: 2; }
  .lab.chip, .lab.tiny { display: none !important; }
  body.carding .glance .btns { display: none; }
}
body.carding .since, body.diarying .since { display: none; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="A 3D town: each building is part of the studio's work"></canvas>
<div id="labels"></div>

<section class="glance panel" aria-label="How the town is doing">
  <p class="eyebrow" id="eyebrow"><b>PatchTown Works</b> · live</p>
  <p id="mood" aria-live="polite">Looking…</p>
  <div class="btns">
    <button id="bAsk" type="button">Questions</button>
    <button id="bDiary" type="button" aria-pressed="false">Diary</button>
    <button id="bTour" type="button" aria-pressed="false">Tour</button>
    <button id="bStill" type="button" aria-pressed="false">Still</button>
    <button id="bDay" type="button">Daylight</button>
  </div>
</section>

<section class="since panel" id="since" aria-label="Since you looked"></section>

<aside class="diary panel" id="diary" aria-label="The day in the town" hidden>
  <p class="eyebrow" id="dEye">Today</p>
  <h2>What happened</h2>
  <div id="events"></div>
</aside>

<div class="card panel" id="card" hidden role="dialog" aria-labelledby="cTitle">
  <button class="close" id="bClose" type="button" aria-label="Close">Close</button>
  <p class="eyebrow" id="cEye"></p>
  <h2 id="cTitle"></h2>
  <div id="cBody"></div>
</div>

<div class="fresh" id="fresh" role="status" aria-label="How old the data is"></div>

<div class="timeline" role="group" aria-label="Timeline">
  <div class="daysel"><button id="bPrev" type="button" aria-label="Day before">‹</button><b id="dayName">–</b><button id="bNext" type="button" aria-label="Day after">›</button></div>
  <button id="bPlay" type="button" aria-pressed="false">▶ Replay</button>
  <div class="track">
    <div class="ticks" id="ticks"></div>
    <label class="skip" for="scrub">Time of day</label>
    <input id="scrub" type="range" min="0" max="1440" step="1" value="1440">
    <div class="tlrow"><span class="clock" id="clock">--:--</span><p id="cap"></p></div>
  </div>
  <button id="bLive" type="button" aria-pressed="true">Live</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================================================
   1. Settings
   ===================================================================================================== */
const CFG = {
  repo: 'hrranford-afk/gods-eye-view-patch-town',
  api: 'https://api.github.com',
  raw: 'https://raw.githubusercontent.com',
  ledgerBranch: 'game/micro-precinct',
  ledgerPath: 'games/works/ledger.jsonl',
  asksPath: 'games/works/asks.json',
  pages: 'https://hrranford-afk.github.io/gods-eye-view-patch-town/',
  pollMs: 120000,          /* at most one look at GitHub every 2 minutes */
  slowMs: 600000,          /* branches, runs, deployments: every 10 minutes */
  activeDays: 7,           /* a workshop stands for a branch active in the last 7 days */
  maxWorkshops: 8,
  walkMin: 40              /* a walker is out for 40 minutes after its event */
};
const Q = new URLSearchParams(location.search);
const OFFLINE = Q.has('offline');
const FIXED_NOW = Q.get('now') ? Date.parse(Q.get('now')) : 0;
const NOW = () => FIXED_NOW || Date.now();
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* privacy: never show an email address or anything that looks like a token */
const clean = (s) => String(s || '').replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '(email hidden)').replace(/\b(gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9-]{20,})\b/g, '(hidden)');
const hhmm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayStart = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const dayName = (k) => new Date(dayStart(k)).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const ago = (ms) => { const m = Math.max(0, Math.round(ms / MIN)); return m < 1 ? 'just now' : m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : Math.floor(m / 1440) + ' d' + (Math.floor((m % 1440) / 60) ? ' ' + Math.floor((m % 1440) / 60) + ' h' : ''); };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
/* plain workshop names: "game/bc-depth" -> "Depth" (codes must not need decoding at a glance) */
const plainBranch = (b) => { const s = String(b || '').split('/').pop().replace(/^(bc|bb)-/, '').replace(/-/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); };

/* =====================================================================================================
   1b. The ledger checker. tools/ledger-check.mjs runs exactly this block (it reads it out of this page between the
       two markers), so the page and the checker can never disagree. A line that fails is not drawn: the town shows
       "1 line refused" in the freshness strip and the library card says which line and which rule (never the text).
   ===================================================================================================== */
/* LEDGER-RULES-START */
var WORKS_RULES = (function () {
  var KINDS = ['hire', 'start', 'end', 'step', 'fix', 'test', 'commit', 'deploy', 'download', 'order', 'result', 'win', 'fail', 'heartbeat'];
  var TRUST = ['measured', 'reported', 'typed', 'sample'];
  var STATUS = ['pass', 'rerun', 'flaky', 'fail', 'error', 'skipped'];
  var PLACES = ['hut', 'library', 'yard', 'post', 'shop', 'lost', 'bridge', 'harry'];
  var FIELDS = ['t', 'who', 'where', 'what', 'kind', 'trust', 'ref', 'branch', 'suite', 'status', 'n', 'order', 'job', 'id', 'src', 't_rec', 'v'];
  var PRIVACY = [

/* optional Kenney models: assets/models.json maps "hut", "workshop", "shop", "post", "library", "home" to .glb files */
async function tryModels() {
  if (OFFLINE || Q.has('nomodels')) return;
  let map; try { const r = await fetch('assets/models.json'); if (!r.ok) return; map = await r.json(); } catch (e) { return; }
  await new Promise((ok) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js'; s.onload = ok; s.onerror = ok; document.head.appendChild(s); });
  if (!THREE.GLTFLoader) return;
  const L = new THREE.GLTFLoader();
  const swap = (b, url) => L.load(url, (gl) => {
    const m = gl.scene; const box = new THREE.Box3().setFromObject(m), sz = box.getSize(new THREE.Vector3());
    const s = Math.min(b.w / sz.x, b.d / sz.z) * 1.05; m.scale.setScalar(s); m.position.y = -box.min.y * s;
    m.traverse((o) => { o.castShadow = o.receiveShadow = true; o.userData.key = b.g.children[0].userData.key; });
    b.body.visible = false; b.roofM.visible = false; b.g.add(m);
  }, undefined, () => { /* keep the drawn shape */ });
  for (const k in B) { const b = B[k]; if (!b.g || b.flat || b.yard) continue; const url = map[k.startsWith('workshop:') ? 'workshop' : k]; if (url) swap(b, url); }
  for (const n in homeB) if (map.home) swap(homeB[n], map.home);
}

$('bPlay').onclick = () => { if (view.playing) { view.playing = false; $('bPlay').setAttribute('aria-pressed', 'false'); $('bPlay').textContent = '▶ Replay'; } else startReplay(); };

/* =====================================================================================================

/* the tour (optional, off by default): only places whose state is not quiet, most urgent first, 6 stops at most,
   12 seconds each (long enough to read a card) */
let tour = false, tourI = 0, tourT = 0;
const TOUR_SECS = 12;

addEventListener('keydown', (e) => { if (e.key === 'Escape' && view.card) { stopTour(); closeCard(); } });

/* Still: stops all motion in one press (as reduced motion does); remembered in this browser only */

/* since you looked: remember when this viewer last had the page open */

/* day and evening */
function setMode(m) {
  mode = m; S.background = new THREE.Color(m.sky); S.fog.color.set(m.fog); hemi.color.set(m.hemi[0]); hemi.groundColor.set(m.hemi[1]); hemi.intensity = m.hemi[2];
  sun.color.set(m.sun[0]); sun.intensity = m.sun[1]; sun.position.set(m === DUSK ? -12 : 8, m === DUSK ? 10 : 20, 8);
  lanternLights.forEach((L) => { L.intensity = 0.7 * m.lamp; }); lanternBulbs.forEach((b) => { b.emissiveIntensity = m.lamp ? 1.2 : 0.1; });

}

{ const h = new Date().getHours(); setMode(Q.get('mode') === 'day' ? DAYL : Q.get('mode') === 'evening' ? DUSK : (h >= 17 || h < 7) ? DUSK : DAYL); }

/* =====================================================================================================
   10. The frame loop
   ===================================================================================================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
/* motion rules: the camera stands still; things move only for real events (a walker per ledger line, rain while tests
   fail, smoke while the foreman works); reduced motion or the Still button stops all of it */
const motionOff = () => RM.matches || still;
const tmp = new THREE.Vector3(); let last = performance.now(), liveTick = 0;
function door(k) {
  if (k === 'bridgeHead') return new THREE.Vector3(0.3, 0, -8.8);
  if (k === 'home') return new THREE.Vector3(HOME.x + 0.4, 0, HOME.z + 2.8);
  const b = B[k]; if (!b) return new THREE.Vector3();
  if (k.startsWith('workshop:')) { const L = Math.hypot(b.x, b.z) || 1; return new THREE.Vector3(b.x - b.x / L * (b.d / 2 + 0.4), 0, b.z - b.z / L * (b.d / 2 + 0.4)); }

function routePoint(route, u) {

/* how far along its single trip a walker is: replay and scrubbing use the town's clock (a trip takes 15 town minutes);

function tripU(w, now) {

  else if (view.live && now - liveTick > 15000) { liveTick = now; if (view.day !== dayKey(NOW())) { view.day = dayKey(NOW()); renderTicks(); } applyTime(NOW()); }
  /* camera: still. It only glides when you ask (a card, the tour); with motion off it jumps */

  const sg2 = shopGlass.userData.target || 0.35; shopGlass.emissiveIntensity += (sg2 * (mode === DUSK ? 1 : 0.7) - shopGlass.emissiveIntensity) * Math.min(1, dt * 3);
  shopLight.intensity = sg2 > 1 ? (mode === DUSK ? 2.2 : 0.6) : 0;

}
/* labels: project, then hide any that would overlap a more important one or sit under a panel (no stacked text) */
function placeLabels() {
  const W = innerWidth, H = innerHeight, cand = [];
  for (const l of labs) {
    tmp.copy(l.obj).project(CAM); const vis = tmp.z < 1 && tmp.x > -1.02 && tmp.x < 1.02 && tmp.y > -1.02 && tmp.y < 1.02;
    const close = dist < 19 && Math.hypot(target.x - l.obj.x, target.z - l.obj.z) < 8;
    const near = (!l.zoomOnly && !l.glanceHide) || close || (l.zoomOnly && view.card === l.zoomOnly);
    if (!vis || !near || l.hide) { if (l.shown !== false) { l.d.style.display = 'none'; l.shown = false; } continue; }
    l.x = (tmp.x + 1) / 2 * W; l.y = (1 - tmp.y) / 2 * H; cand.push(l);
  }
  for (const l of cand) if (l.shown !== true) { l.d.style.display = ''; l.shown = true; }
  for (const l of cand) if (l.dirty || !l.w) { l.w = l.d.offsetWidth; l.h = l.d.offsetHeight; l.dirty = false; }
  /* the place whose card is open wins, then alarms, then the rest */
  const pr = (l) => (l.prio || (l.zoomOnly ? 3 : 0)) + (view.card && l.key === view.card ? 20 : 0);
  cand.sort((a, b) => pr(b) - pr(a));
  const placed = [], hit = (r, q) => r.x < q.right && r.x + r.w > q.left && r.y < q.bottom && r.y + r.h > q.top;
  /* a label may slide up to half its width sideways, or one line up or down, to find a free spot near its place */
  const bad = (r) => r.x < 0 || r.x + r.w > W || r.y < 0 || panelRects.some((q) => hit(r, q)) || placed.some((q) => hit(r, { left: q.x - 4, right: q.x + q.w + 4, top: q.y - 3, bottom: q.y + q.h + 3 }));
  for (const l of cand) {
    let r = null;
    for (const [dx, dy] of [[0, 0], [0.55, 0], [-0.55, 0], [0, -1.1], [0, 1.1], [0.55, -1.1], [-0.55, -1.1]]) {
      const q = { x: l.x - l.w / 2 + dx * l.w, y: l.y - l.h + dy * l.h, w: l.w, h: l.h };
      if (!bad(q)) { r = q; break; }
    }
    if (!r) { l.d.style.display = 'none'; l.shown = false; l.clash = true; continue; }
    l.clash = false; placed.push(r);
    l.d.style.transform = 'translate(' + r.x.toFixed(1) + 'px,' + r.y.toFixed(1) + 'px)';
  }
}

/* =====================================================================================================
   11. Start, and keep looking (at most every 2 minutes)
   ===================================================================================================== */
async function loadWall() {
  if (OFFLINE) return;
  try { const r = await fetch('town-report.json', { cache: 'no-cache' }); if (!r.ok) return; const w = await r.json(); if (w && w.machines && w.chips) { WALL = Object.assign({}, WALL, w, { sample: false }); } } catch (e) { /* keep the sample */ }
}
async function refresh() {
  const [ledger] = await Promise.all([loadLedger(), OFFLINE ? null : loadGitHub(), loadAsks()]);
  if (ledger && ledger.length) LEDGER = ledger;
  if (OFFLINE || !GH.order) { const u = cache.u; /* last copy from GitHub, if any */
    if (!GH.order) { const ev = (u[CFG.api + '/repos/' + CFG.repo + '/events?per_page=100'] || {}).d; if (ev) { /* rebuild from cache */ } } }
  buildEvents(); buildWorkshops();

  if (!view.started) {

}
let readyResolve; const ready = new Promise((r) => { readyResolve = r; });
(async () => {
  rebuildLabels();

  await refresh();
  requestAnimationFrame(frame);
  tryModels();
  readyResolve(true);
  setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, CFG.pollMs);
})();

window.__works = {
  ready,

    dayEvents: ST.day ? ST.day.length : 0, walkers: walkers.filter((w) => w.g.visible).length, lamps: lamps.filter((l) => l.bulb.visible).map((l) => l.st),
    mood: ST.mood ? ST.mood.text : '', since: ST.since ? ST.since.items.map((e) => shortWhat(e)) : [], asks: ST.asks ? ST.asks.map((a) => a.id) : [],
    orderList: ST.orderList ? ST.orderList.map((o) => ({ id: o.id, state: o.state, ageMin: o.age ? Math.round(o.age / MIN) : null, tookMin: o.took ? Math.round(o.took / MIN) : null })) : [],
    refused: (net.refused || []).map((r) => ({ line: r.line, why: r.why })), fresh: freshList().map((f) => ({ name: f.name, old: f.old, txt: f.txt })),
    stalls: (ST.lost || []).concat(ST.quiet || []).map((o) => ({ who: o.who, level: o.level, beats: o.beats, lateMin: o.lateAfter / MIN, lostMin: o.lostAfter / MIN })),
    still: motionOff(), cam: [CAM.position.x.toFixed(3), CAM.position.y.toFixed(3), CAM.position.z.toFixed(3)].join(','),
    shownLabels: labs.filter((l) => l.shown).map((l) => l.d.textContent),
    live_items: ST.live ? ST.live.length : 0, lost: ST.lost ? ST.lost.length : 0, quiet: ST.quiet ? ST.quiet.length : 0, suites: ST.suites ? Object.keys(ST.suites) : [], weather: ST.weather, rainbow: ST.rainbow, parcels: ST.parcels ? ST.parcels.length : 0, orders: ST.orders ? ST.orders.length : 0, net: Object.assign({}, net), labels: labs.map((l) => l.d.textContent) }),
  scrub: (hh, mm) => { $('scrub').value = hh * 60 + mm; $('scrub').dispatchEvent(new Event('input')); $('scrub').dispatchEvent(new Event('change')); },
  openCard, closeCard, setDay, goLive, startReplay,
  pick: (k) => { const b = B[k]; if (!b) return null; tmp.set(b.x, (b.h || 0.2) * 0.4, b.z + (b.d || 0) / 2).project(CAM); return { x: (tmp.x + 1) / 2 * innerWidth, y: (1 - tmp.y) / 2 * innerHeight }; },
  walkerSpots: () => walkers.filter((w) => w.g.visible).map((w) => [w.g.position.x.toFixed(3), w.g.position.z.toFixed(3)]),
