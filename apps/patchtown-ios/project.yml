# PatchTown iOS app: XcodeGen spec. Generate the Xcode project with scripts/generate.sh (not by hand):
# it reads signing.env (your bundle id + Apple team id) and checks the games are synced first.
# PatchTown.xcodeproj and PatchTown/Info.plist are generated files (git-ignored).
name: PatchTown
options:
  bundleIdPrefix: com.REPLACE_ME
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "${PATCHTOWN_BUILD_NUMBER}"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PatchTown:
    type: application
    platform: iOS
    sources:
      - path: PatchTown/App
      - path: PatchTown/Web
      - path: WebXRKit/Sources/WebXRKit
        excludes:
          - "Resources/**"
      - path: WebXRKit/Sources/WebXRKit/Resources/webxr-polyfill.js
        buildPhase: resources
      - path: PatchTown/Bridge/PatchTownBridge.js
        buildPhase: resources
      - path: PatchTown/Resources/Assets.xcassets
      - path: PatchTown/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The synced games, as a folder reference (keeps Games/<id>/... paths inside the app bundle).
      - path: PatchTown/Games
        type: folder
        buildPhase: resources
      - path: THIRD_PARTY.md
        buildPhase: resources
      - path: WebXRKit/LICENSE
        buildPhase: resources
      - path: WebXRKit/NOTICE
        buildPhase: resources
    preBuildScripts:
      - name: Check the games are synced
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/PatchTown/Games/base-camp/index.html" ] || [ ! -f "${SRCROOT}/PatchTown/Games/night-meet/index.html" ] || [ ! -f "${SRCROOT}/PatchTown/Games/baguettes-and-ballistics/index.html" ]; then
            echo "error: The games are not in PatchTown/Games. In Terminal run: apps/patchtown-ios/scripts/sync-games.sh"
            exit 1
          fi
    settings:
      base:
        PRODUCT_NAME: PatchTown
        PRODUCT_BUNDLE_IDENTIFIER: "${PATCHTOWN_BUNDLE_ID}"
        DEVELOPMENT_TEAM: "${PATCHTOWN_TEAM_ID}"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: PatchTown
    info:
      path: PatchTown/Info.plist
      properties:
        CFBundleDisplayName: PatchTown
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, arkit]
        NSCameraUsageDescription: "PatchTown uses the camera to place the games in your room. Pictures stay on this device."
        NSLocationWhenInUseUsageDescription: "Base Camp can use your rough location for the local weather. Only the weather comes back."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Plain logic tests (no app host, no camera): the patchtown:// path mapping, MIME types, CDN rewriting, user agent.
  PatchTownTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PatchTownTests
      - path: PatchTown/Web/GameResourceResolver.swift
      - path: PatchTown/App/Games.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${PATCHTOWN_BUNDLE_ID}.tests"
        DEVELOPMENT_TEAM: "${PATCHTOWN_TEAM_ID}"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  PatchTown:
    build:
      targets:
        PatchTown: all
        PatchTownTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PatchTownTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
