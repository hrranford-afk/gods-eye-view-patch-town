<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Base Camp: Places</title>
<style>
/* Base Camp Places prototype. Warm cream and brown, big round buttons, plain short words. */
:root{--paper:#fff6e6;--card:#fffaf0;--ink:#3b2a1e;--brown:#5a3d2b;--acc:#e8883a;--acc2:#f6b25c;--leaf:#7bb661;--sky:#cfe3f2;--mint:#16a37f;--body:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;letter-spacing:.015em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(circle at 20% 0,#fffdf6 0,var(--paper) 60%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:8px 22px;border:4px solid var(--ink);border-radius:999px;background:var(--card);font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--acc)}
.btn svg{width:30px;height:30px;flex:none}
.lock{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--brown);background:#f3e3c4;border:3px solid #d9c196;border-radius:999px;padding:6px 14px;white-space:nowrap}
.lock svg{width:20px;height:20px}

/* Places list */
#sPlaces header{padding:34px 34px 6px}
#sPlaces h1{margin:0;font-size:54px;line-height:1.05}
#sPlaces .sub{font-size:25px;margin-top:6px;color:var(--brown);font-weight:700}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px;padding:22px 34px 14px;overflow:auto;flex:1;align-content:start}
.pcard{position:relative;text-align:left;border:4px solid var(--ink);border-radius:30px;background:var(--card);box-shadow:0 7px 0 var(--ink);padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .08s,box-shadow .08s}
.pcard:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.pcard .thumb{height:230px;background:linear-gradient(#e6f1da,#d7e8c6);border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:14px}
.pcard .thumb svg{width:100%;height:100%}
.pcard .txt{padding:14px 20px 18px;display:flex;align-items:center;gap:14px}
.pcard .dot{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);flex:none}
.pcard .nm{font-size:36px;font-weight:900;line-height:1.1}
.pcard .meta{font-size:21px;color:var(--brown);font-weight:700;margin-top:2px}
.pcard .go{margin-left:auto;width:54px;height:54px;border-radius:50%;background:var(--acc);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.pcard .go svg{width:28px;height:28px}
.pcard.new{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;min-height:330px;gap:14px;font-size:34px;font-weight:900;color:var(--brown)}
.pcard.new .plus{width:92px;height:92px;border-radius:50%;background:var(--acc);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
.pcard.new .plus svg{width:50px;height:50px}
#sPlaces footer{padding:10px 34px 24px;display:flex;justify-content:center}

/* Place screen */
.bar{display:flex;align-items:center;gap:14px;padding:16px 16px 10px;flex-wrap:wrap}
#back{padding-left:14px}
#crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.crumb{min-height:56px;padding:6px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--card);font-size:23px;font-weight:800;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb.cur{background:var(--acc2)}
.sep{font-size:30px;font-weight:900;color:var(--brown);margin:0 -1px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 16px}
@media (min-aspect-ratio:5/4){#stage{flex-direction:row}}
#view3d{position:relative;flex:1.2 1 0;min-height:0;min-width:0;border:4px solid var(--ink);border-radius:28px;overflow:hidden;background:#eaf2de;box-shadow:0 5px 0 var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#mapWrap{flex:1 1 0;min-height:0;min-width:0;border:4px solid var(--ink);border-radius:28px;background:var(--card);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;padding:8px 10px 8px}
#stage.bigmap #mapWrap{flex:2.1}
#stage.big3d #view3d{flex:2.1}
.mh{display:flex;align-items:center;gap:10px;padding:0 4px}
.mh h2{margin:0;font-size:24px;font-weight:900;flex:1;white-space:nowrap}
.mh .lock{font-size:16px;padding:4px 12px}
.mh .btn{min-height:48px;font-size:18px;padding:4px 16px;box-shadow:0 4px 0 var(--ink);border-width:3px}
#map{flex:1;min-height:0;width:100%}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;padding:0 6px;font-size:17px;font-weight:700;color:var(--brown)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
#banner{position:absolute;top:12px;left:12px;right:12px;z-index:5;background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;pointer-events:none;transition:opacity .35s,transform .35s}
#banner.hide{opacity:0;transform:translateY(-14px)}
#banner .bt{display:flex;align-items:center;gap:14px}
#banner .sw{width:50px;height:50px;border-radius:50%;border:4px solid var(--ink);flex:none;box-shadow:0 0 0 6px rgba(255,214,102,.55)}
#bl1{font-size:27px;font-weight:900;line-height:1.1}
#bl2{font-size:23px;font-weight:700;color:var(--brown);margin-top:2px}
#banner .bl{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:20px;font-weight:800}
#banner .pb{flex:1;height:18px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#f3e3c4}
#bfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cf0c0,#16a37f)}
#youChip{position:absolute;left:12px;bottom:12px;z-index:4;display:flex;gap:8px;align-items:center;background:rgba(255,250,240,.94);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:20px;font-weight:800;pointer-events:none}
#youChip b{color:var(--mint)}
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);background:var(--ink);color:#fff6e6;padding:14px 26px;border-radius:999px;font-size:22px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#actions{display:flex;gap:12px;padding:14px 16px 16px}
#actions .btn{flex:1;min-height:84px;border-radius:30px;flex-direction:column;gap:2px;font-size:20px;line-height:1.15;text-align:center;padding:8px 10px}
#actions .btn svg{width:32px;height:32px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(59,42,30,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{width:100%;max-width:760px;background:var(--paper);border:4px solid var(--ink);border-bottom:0;border-radius:34px 34px 0 0;padding:26px 26px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
#sheet h3{margin:0 0 4px;font-size:34px}
#sheet p{margin:0 0 14px;font-size:22px;color:var(--brown);font-weight:700}
#sheet .row{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 18px}
.chip{min-height:64px;padding:8px 20px;border:4px solid var(--ink);border-radius:999px;background:var(--card);font-size:23px;font-weight:800;display:inline-flex;align-items:center;gap:10px}
.chip.on{background:var(--acc2);box-shadow:0 0 0 4px var(--acc)}
.chip .sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink)}
#sheet input{width:100%;min-height:68px;font:inherit;font-size:28px;font-weight:800;padding:8px 20px;border:4px solid var(--ink);border-radius:22px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
#sheet .btns{display:flex;gap:14px;margin-top:8px}
#sheet .btns .btn{flex:1}
.hint{font-size:20px;color:var(--brown);font-weight:700;background:#f3e3c4;border-radius:18px;padding:10px 16px;margin-bottom:6px}

/* Map svg */
.room .fill{fill:#fffaf0;stroke:#3b2a1e;stroke-width:.09}
.room.out .fill{fill:#eaf4d8}
.room .glow{fill:#ffb24a;opacity:0;filter:url(#blur)}
.room.visited .fill{fill:#fff3d6}
.room.out.visited .fill{fill:#dcefc0}
.room.loaded .fill{fill:#d9fff0;stroke:#12a07c;stroke-width:.17}
.room:not(.visited):not(.loaded) .fill{stroke-dasharray:.28 .16}
.room.sel .fill{stroke:#e8883a;stroke-width:.17}
svg text{letter-spacing:0;font-family:var(--body)}
.rname{font-weight:900;fill:#3b2a1e;pointer-events:none;paint-order:stroke;stroke:#fffaf0;stroke-width:.14;stroke-linejoin:round}
.alabel rect{fill:#5a3d2b;stroke:#3b2a1e;stroke-width:.06}
.alabel text{fill:#fff6e6;font-weight:900;pointer-events:none}
.ablock{fill:rgba(123,182,97,.16);stroke:#5a3d2b;stroke-width:.07;stroke-dasharray:.35 .2}
.ablock.house{fill:rgba(232,136,58,.14)}
.hit{fill:none;stroke:transparent;stroke-width:1.1;stroke-linecap:round}
</style>
</head>
<body>
<div id="app">
  <section id="sPlaces" class="screen">
    <header>
      <h1>Places</h1>
      <div class="sub">Where are you today?</div>
    </header>
    <div id="cards"></div>
    <footer><span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="savedtxt">Saved on this iPad only</span></span></footer>
  </section>

  <section id="sPlace" class="screen" hidden>
    <div class="bar">
      <button id="back" class="btn" aria-label="Back up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backLbl">Places</span></button>
      <nav id="crumbs" aria-label="Where you are"></nav>
      
    </div>
    <div id="stage">
      <div id="view3d">
        <canvas id="gl"></canvas>
        <div id="banner" class="hide">
          <div class="bt"><span class="sw" id="bsw"></span><div><div id="bl1"></div><div id="bl2"></div></div></div>
          <div class="bl"><span class="pb"><i id="bfill"></i></span><span id="bstate"></span></div>
        </div>
        <div id="youChip"></div>
      </div>
      <div id="mapWrap">
        <div class="mh"><h2 id="mapTitle">House map</h2><span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="savedtxt">Saved on this iPad only</span></span><button id="sizeBtn" class="btn">Bigger map</button></div>
        <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="legend"><span><i style="background:#e8883a"></i>You</span><span><i style="background:#ffb24a;border-radius:4px"></i>Busy room</span><span><i style="background:#e85d4a"></i>Totem</span><span><i style="background:#3f7fd8;border-radius:4px"></i>Door</span><span><i style="background:#d9fff0;border-color:#12a07c"></i>Map loaded</span></div>
      </div>
    </div>
    <div id="actions">
      <button class="btn pri" id="aRoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 9v6M9 12h6"/></svg>Add a room</button>
      <button class="btn pri" id="aTotem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Add a totem here</button>
      <button class="btn pri" id="aLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>Link through this door</button>
    </div>
  </section>

  <div id="sheet" hidden><div class="panel" id="sheetBody"></div></div>
  <div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ===== Data: Place > Area > Room > Surface. Rooms hold totems and camps; links join rooms (doorways, gates, paths). ===== */
const TOT = { mug: ['striped mug', 0xe85d4a], top: ['spinning top', 0x3f8fd8], cone: ['pine cone', 0x8a5a34], lantern: ['lantern', 0xf2b632], pot: ['plant pot', 0xd9733f], wheel: ['pinwheel', 0x7bb661], duck: ['wooden duck', 0xe9c46a], acorn: ['acorn', 0xb07a3c], teapot: ['blue teapot', 0x4f8fd0], bell: ['brass bell', 0xd9a43a] };
const TAGS = [['red', 0xe0503e], ['blue', 0x3f7fd8], ['green', 0x5aa84a], ['yellow', 0xf0c030], ['purple', 0x8e5bc9], ['pink', 0xee7aa8], ['teal', 0x2fb3a8], ['orange', 0xe8883a]];
const FLOOR = { kitchen: 0xf0dfb8, hall: 0xd9b98c, living: 0xd2a977, bedroom: 0xe7c7d0, path: 0x9ccf7a, lawn: 0x8fc46c, shed: 0xb98d5b, bath: 0xbfe0e6, desk: 0xd9c4a0, other: 0xe6d6b4 };
const css = (c) => '#' + c.toString(16).padStart(6, '0');
const places = [];
const S = { screen: 'places', placeId: null, level: 1, areaId: null, roomId: null, here: null, loaded: null, visited: new Set(), lastSeen: null, lastRoute: [], phase: 'idle', big: '', store: 'memory', walking: false, uid: 1 };

function tot(pid, rid, kind, dx, dz, y, n) { return { id: pid + ':' + rid + ':' + kind + (n || ''), kind, dx, dz, y: y || 0 }; }
function room(id, name, style, x, z, w, d, totems, camps, outdoor) { return { id, name, style, x, z, w, d, outdoor: !!outdoor, totems, camps: camps || [] }; }
function link(pid, a, b, x, z, kind, tagIdx) { const id = a + '-' + b; return { id, a, b, kind, pa: [x, z], pb: [x, z], tag: { id: pid + ':door:' + id, c: tagIdx } }; }

function seedPlaces() {
  const kx = (w) => w / 2 - 0.45;
  const home = {
    id: 'home', name: 'Home', hue: '#e8883a', entry: 'hall', areas: [
      { id: 'house', name: 'House', rooms: [
        room('kitchen', 'Kitchen', 'kitchen', -6, -4, 3, 3, [tot('home', 'kitchen', 'mug', kx(3) - 0.05, -1.1, 0.68)], [{ dx: -0.7, dz: 0.6 }]),
        room('living', 'Living room', 'living', -3, -4, 3, 3, [tot('home', 'living', 'cone', -0.1, 0.4, 0.34)], [{ dx: 0.2, dz: 0.95 }, { dx: -0.9, dz: 0.2 }]),
        room('hall', 'Hall', 'hall', -6, -1, 3, 3, [tot('home', 'hall', 'top', -0.95, -0.95, 0.5)]),
        room('bedroom', 'Bedroom', 'bedroom', -3, -1, 3, 3, [tot('home', 'bedroom', 'lantern', 1.2, -1.2, 0.45)])] },
      { id: 'garden', name: 'Garden', rooms: [
        room('path', 'Path', 'path', -6, 2, 5, 5, [tot('home', 'path', 'pot', -1.9, -1.9, 0)], [], true),
        room('lawn', 'Lawn', 'lawn', -1, 2, 4, 5, [tot('home', 'lawn', 'wheel', 0.4, 1.2, 0)], [{ dx: -0.9, dz: -1.5 }], true)] },
      { id: 'shed', name: 'Shed', rooms: [
        room('workshop', 'Workshop', 'shed', 3, 2, 4, 4, [tot('home', 'workshop', 'duck', -0.3, -1.4, 0.86)], [{ dx: 1.0, dz: 1.1 }])] }],
    links: [link('home', 'kitchen', 'hall', -4.5, -1, 'door', 0), link('home', 'kitchen', 'living', -3, -2.5, 'door', 1), link('home', 'hall', 'bedroom', -3, 0.5, 'door', 2),
      link('home', 'living', 'bedroom', -1.5, -1, 'door', 3), link('home', 'hall', 'path', -4.5, 2, 'front', 4), link('home', 'path', 'lawn', -1, 4.5, 'gate', 5), link('home', 'lawn', 'workshop', 3, 3.5, 'shed', 6)]
  };
  const mum = {
    id: 'mumdad', name: "Mum & Dad's", hue: '#4f8fd0', entry: 'porch', areas: [
      { id: 'house', name: 'House', rooms: [
        room('kitchen', 'Kitchen', 'kitchen', -5, -3, 4, 3, [tot('mumdad', 'kitchen', 'teapot', kx(4) - 0.05, -1.1, 0.68)], [{ dx: -1.0, dz: 0.7 }]),
        room('lounge', 'Lounge', 'living', -1, -3, 4, 3, [tot('mumdad', 'lounge', 'acorn', -0.1, 0.4, 0.34)], [{ dx: -1.2, dz: 0.8 }]),
        room('porch', 'Porch', 'hall', -5, 0, 4, 3, [tot('mumdad', 'porch', 'bell', -1.45, -0.95, 0.5)])] },
      { id: 'garden', name: 'Garden', rooms: [room('yard', 'Back yard', 'lawn', -1, 0, 6, 3, [tot('mumdad', 'yard', 'wheel', 0.6, 0.6, 0)], [{ dx: 1.6, dz: -0.6 }], true)] },
      { id: 'shed', name: 'Shed', rooms: [room('shed', 'Shed', 'shed', 5, 0, 3, 3, [tot('mumdad', 'shed', 'lantern', -0.2, -1.1, 0.86)], [{ dx: 0.7, dz: 0.6 }])] }],
    links: [link('mumdad', 'kitchen', 'lounge', -1, -1.5, 'door', 2), link('mumdad', 'kitchen', 'porch', -3.5, 0, 'door', 0), link('mumdad', 'porch', 'yard', -1, 1.5, 'back', 1), link('mumdad', 'yard', 'shed', 5, 1.5, 'shed', 3)]
  };
  return [home, mum];
}

/* helpers over the data */
const allRooms = (p) => p.areas.reduce((a, ar) => a.concat(ar.rooms), []);
function meta(p, rid) { for (const a of p.areas) for (const r of a.rooms) if (r.id === rid) return { room: r, area: a }; return null; }
const rcx = (r) => r.x + r.w / 2, rcz = (r) => r.z + r.d / 2;
function bounds(rs) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; rs.forEach((r) => { a = Math.min(a, r.x); b = Math.min(b, r.z); c = Math.max(c, r.x + r.w); d = Math.max(d, r.z + r.d); }); return { minx: a, minz: b, maxx: c, maxz: d }; }
const P = () => places.find((p) => p.id === S.placeId);
const tagName = (l) => TAGS[l.tag.c % TAGS.length][0] + ' door tag';
const kindWord = { door: 'door', front: 'front door', gate: 'gate', shed: 'shed door', back: 'back door', link: 'link' };
const pathOf = (p, rid) => { const m = meta(p, rid); return m ? [p.id, m.area.id, rid].join('/') : null; };
function roomAt(p, x, z) { const rs = allRooms(p); for (const r of rs) if (x >= r.x - 0.03 && x <= r.x + r.w + 0.03 && z >= r.z - 0.03 && z <= r.z + r.d + 0.03) return r.id; return null; }
function totemWorld(r, t) { return [rcx(r) + t.dx, rcz(r) + t.dz]; }
/* where the door tag stands: inside room A, beside the door */
function tagSpot(p, l) {
  const r = meta(p, l.a).room, x = l.pa[0], z = l.pa[1], vert = Number.isInteger(x);
  const sx = Math.sign(rcx(r) - x) || 1, sz = Math.sign(rcz(r) - z) || 1;
  let tx, tz;
  if (vert) { tx = x + sx * 0.45; tz = z + 0.8; if (tz > r.z + r.d - 0.4) tz = z - 0.8; } else { tz = z + sz * 0.45; tx = x + 0.8; if (tx > r.x + r.w - 0.4) tx = x - 0.8; }
  return [tx, tz];
}

/* ===== Storage: IndexedDB first, localStorage as the fallback ===== */
function idbOpen() { return new Promise((res, rej) => { try { const q = indexedDB.open('bc-places', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blocked')); } catch (e) { rej(e); } }); }
async function idbGet() { const db = await idbOpen(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get('places'); r.onsuccess = () => { db.close(); res(r.result); }; r.onerror = () => rej(r.error); }); }
async function idbPut(v) { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'places'); t.oncomplete = () => { db.close(); res(); }; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
async function loadStore() {
  let d = null;
