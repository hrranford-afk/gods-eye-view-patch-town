<!doctype html>
<html lang="en">
<head>

<title>Base Camp</title>
<style>

.by{font-size:11px;opacity:.55;font-weight:600;white-space:nowrap}

#tagpick .th{font-weight:800;font-size:16px;color:#ffd9a8}#tagpick .tags{display:flex;flex-wrap:wrap;gap:6px}#tagpick .tags button{min-height:38px;font-size:14px;padding:2px 10px}
.row2,.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row2 input{flex:1 1 150px;font:700 14px var(--body);padding:8px;border-radius:10px;border:2px solid #fff6e655;background:#fff6e6;color:#3b2a1e;min-height:38px}
#modal textarea{width:100%;font:12px ui-monospace,monospace;border-radius:10px;padding:6px;background:#fff6e6;color:#3b2a1e}

#guess{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(92vw,520px);display:grid;gap:8px;z-index:4;text-align:center}#guess .th{font-weight:800;font-size:18px;color:#ffd9a8}#guess .row2{justify-content:center}
#rstat{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:12px;font-weight:700;padding:4px 10px;max-width:46vw}
.lib{display:flex;gap:10px;align-items:center}.lib>div{flex:1}.lib button{min-height:34px;font-size:13px}.badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);color:#2b1d12;flex:none}
#welcome{text-align:left;font-size:14px;line-height:1.4;background:rgba(255,246,230,.12);border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#f6e6cc}
#welcome ul{margin:4px 0 0;padding-left:18px;font-weight:600}
body.auto #bar{padding:4px 6px;gap:4px;background:rgba(59,42,30,.55)}
body.auto #bar button{min-height:36px;font-size:13px;padding:2px 8px}

#bar.min{background:none;backdrop-filter:none;padding:0;left:auto;right:12px;transform:none}#bar.min button.round{width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;font-size:20px}
#tmenu{justify-content:center;margin-top:10px}

#home{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:800 44px var(--body);color:#ffd9a8;text-shadow:0 3px 0 #7a4a22;pointer-events:none;opacity:0;transition:opacity .6s}
#home.on{opacity:1}
#mapInfo{font:700 13px var(--body);opacity:.85}
#colMark{position:absolute;width:28px;height:28px;border-radius:50%;background:rgba(255,217,168,.35);box-shadow:0 0 12px 4px rgba(255,217,168,.55);display:grid;place-items:center;font-size:16px;color:#fff6e6;pointer-events:none;z-index:3}

#banner{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;z-index:7;font:800 18px var(--body);color:#3b2a1e;background:linear-gradient(#fffaf0,#ffe1b0);border:3px solid #e8883a;border-radius:22px;padding:5px 18px 6px;box-shadow:0 3px 0 #a85a1e;white-space:nowrap;text-align:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}

#banner.on{opacity:1;transform:translateX(-50%) scale(1)}#banner small{display:block;font-size:11px;font-weight:700;opacity:.72}

.alb{display:flex;gap:10px;align-items:center;background:rgba(255,246,230,.1);border-radius:12px;padding:6px 10px}.alb .ai{font-size:26px}.alb>div{flex:1}.alb .ad{font-size:11px;opacity:.7;white-space:nowrap}
#bmenu{flex-wrap:wrap;justify-content:center;max-width:96vw}body.auto #bmenu{gap:4px;padding:5px}body.auto #bmenu button{min-height:34px;font-size:13px;padding:2px 9px}
#arLog{position:fixed;left:8px;top:70px;z-index:99;max-width:60vw;font:600 13px/1.35 var(--body);color:#fff;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="ui">
  <div id="touch"></div>
  <div id="title" class="glass">
    <h1>Base Camp</h1>
    <p>A tiny colony that settles the real surfaces of your room. Just press Play and look around: they find their own home, know the room when you come back, and love a tidy house.</p>
    <div id="welcome" hidden></div>
    <div class="row">
      <button class="big" id="bPlay" disabled>Play</button>
      <button id="bMore">More...</button>
    </div>
    <div id="rooms" hidden></div>
    <div id="tmenu" class="mrow" hidden>
      <button id="bFresh">Start a new room</button>
      <button id="bPrac" class="alt">Practice room</button>
      <button id="bMap">Manual: map my room</button>
      <button id="bMapIO">Room map: export / import</button>
      <button id="bHomes" hidden>Rooms and totems</button>
      <button id="bNew" hidden>Forget my colony</button>
      <div id="storeInfo" class="sub" style="flex-basis:100%"></div>
    </div>
    <div id="mapInfo"></div>
    <div id="arStatus">AR: checking...</div>
  </div>
  <div id="top"><div id="hint" class="glass"></div><div id="chips"></div><div id="count"></div></div>
  <div id="home"></div>
  <div id="idDot" hidden></div>
  <div id="colMark" hidden><span>\u27a4</span></div>
  <div id="nroom" class="glass" hidden></div>
  <div id="card" class="glass" hidden></div>
  <div id="sel" class="glass" hidden></div>
  <div id="reqs"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="bmenu" class="glass" hidden></div>
  <div id="bar" class="glass" hidden></div>
  <div id="repl" class="glass" hidden></div>
  <div id="env" class="glass" hidden></div>
  <div id="wx" class="glass" hidden></div>
  <div id="ask" hidden></div>
  <div id="diary" hidden></div>
  <div id="tagpick" class="glass" hidden></div>
  <div id="guess" class="glass" hidden></div>
  <div id="rstat" class="glass" hidden></div>
  <div id="modal" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// Base Camp: a living colony on the real surfaces of your room. One file. Sections: basics, almanac (data), environment
// (light, clock, weather), scan (zones), models, colony simulation, input and UI, AR mode, practice room, main loop.
const BUILD = 'build 8';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), mixLerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.floor(Math.random() * a.length)];
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const STORE = { status: 'ok', fails: 0, err: '', told: false };
(function storeProbe() { try { localStorage.setItem('bc-probe', '1'); if (localStorage.getItem('bc-probe') !== '1') throw new Error('read back failed'); localStorage.removeItem('bc-probe'); } catch (e) { STORE.status = 'unavailable'; STORE.err = String(e && e.message || e); } })();
function seededRandom(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function withSeed(seed, fn) { const r = Math.random; Math.random = seededRandom(seed); try { return fn(); } finally { Math.random = r; } } // the away simulation gives the same story on the title card and in the game
function safeWrite(key, str) { // the previous good value is kept in a backup slot, so a bad write cannot wipe the colony
  try {
    const old = localStorage.getItem(key); if (old) { try { JSON.parse(old); try { localStorage.setItem(key + '-bak', old); } catch (e) { /* no room for a backup */ } } catch (e) { /* the old value was damaged: keep the older backup */ } }
    localStorage.setItem(key, str); if (localStorage.getItem(key) !== str) throw new Error('could not read the save back'); return true;
  } catch (e) { STORE.fails++; STORE.err = String(e && e.message || e); STORE.status = STORE.status === 'unavailable' ? 'unavailable' : 'failing'; return false; }
}
function safeRead(key, ok) { // main slot, then the backup; sets STORE.status = 'corrupt' if something was there but unreadable
  let bad = false;
  for (const k of [key, key + '-bak']) { let raw = null; try { raw = localStorage.getItem(k); } catch (e) { return null; } if (!raw) continue; try { const d = JSON.parse(raw); if (ok(d)) { if (k !== key) STORE.usedBackup = true; return d; } bad = true; } catch (e) { bad = true; } }
  if (bad) STORE.status = 'corrupt'; return null;
}
const MULTI_ROOM = true; // ON (build 7): several rooms, each with its own map and colony (storage keys per room), a rooms list on the title, silent room recognition by surface matching
const HOME_TOTEM = false; // OFF: the totem photo / guardian / feature matcher (build 6, never validated) is not reachable while this is false
const HOMES = { v: 1, cur: 'r1', rooms: [{ id: 'r1', name: 'My room', created: Date.now(), visits: 0, known: 0, post: [] }] }; // rooms: each has its own map, colony, totem and guardian (keys below)
(function homesInit() { try { const d = JSON.parse(localStorage.getItem('bc-rooms-v1') || 'null'); if (d && d.v === 1 && Array.isArray(d.rooms) && d.rooms.length && d.rooms.every((r) => r && /^r\d+$/.test(r.id))) { HOMES.rooms = d.rooms.slice(0, 8); HOMES.cur = HOMES.rooms.some((r) => r.id === d.cur) ? d.cur : HOMES.rooms[0].id; } } catch (e) { /* one room */ } })();
function homesSave() { try { localStorage.setItem('bc-rooms-v1', JSON.stringify(HOMES)); } catch (e) { /* no storage */ } }
const homeInfo = (id) => HOMES.rooms.find((r) => r.id === id) || null, homeName = (id) => { const r = homeInfo(id); return r ? r.name : 'a room'; };
const homeKeys = (id) => (id === 'r1' ? { map: 'base-camp-map-v1', save: 'base-camp-save-v2' } : { map: 'base-camp-map-v1.' + id, save: 'base-camp-save-v2.' + id }); // the first room keeps the old keys
function homeSelect(id) { HOMES.cur = id; MAP_KEY = homeKeys(id).map; SAVE_KEY = homeKeys(id).save; homesSave(); }
function homeCreate(name) { if (HOMES.rooms.length >= 8) return null; const n = Math.max(0, ...HOMES.rooms.map((r) => +r.id.slice(1))) + 1; let k = HOMES.rooms.length + 1; while (HOMES.rooms.some((q) => q.name === 'Room ' + k)) k++; const r = { id: 'r' + n, name: name || 'Room ' + k, created: Date.now(), visits: 0, known: 0, post: [] }; HOMES.rooms.push(r); homeSelect(r.id); return r; }
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* no storage */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* none */ } } };
// ---- MIGRATION (build 7): single-room saves become rooms. The first room keeps the old storage keys, so nothing moves for it; a '-prev' backup (made by "Start a new room" or "A new room" in builds 5 / 6) becomes "Room N (earlier)" with its own keys.
function homesMigrate() {
  if (!MULTI_ROOM) return; let changed = false;
  try {
    const ls = localStorage, rd = (k) => { try { return ls.getItem(k); } catch (e) { return null; } };
    const r1 = HOMES.rooms.find((r) => r.id === 'r1');
    if (r1 && r1.name === 'My room') { let nm = 'Room 1'; try { const d = JSON.parse(rd(homeKeys('r1').map) || 'null'); if (d && typeof d.name === 'string' && d.name.trim() && d.name !== 'My room') nm = d.name.trim().slice(0, 24); } catch (e) { /* unreadable: keep the plain name */ } r1.name = nm; changed = true; }
    for (const r of HOMES.rooms.slice()) {
      const k = homeKeys(r.id), pm = rd(k.map + '-prev'), pc = rd(k.save + '-prev'); if (!pm && !pc) continue;
      if (HOMES.rooms.length >= 8) break;
      const n = Math.max(0, ...HOMES.rooms.map((q) => +q.id.slice(1))) + 1, id = 'r' + n, nk = homeKeys(id); let nm = 'Room ' + (HOMES.rooms.length + 1) + ' (earlier)';
      try { const d = JSON.parse(pm || 'null'); if (d && typeof d.name === 'string' && d.name.trim() && d.name !== 'My room' && d.name !== r.name) nm = (d.name.trim().slice(0, 14) + ' (earlier)'); } catch (e) { /* plain name */ }
      try {
        if (pm) { ls.setItem(nk.map, pm); if (ls.getItem(nk.map) !== pm) throw new Error('copy failed'); } if (pc) { ls.setItem(nk.save, pc); if (ls.getItem(nk.save) !== pc) throw new Error('copy failed'); }
        ls.removeItem(k.map + '-prev'); ls.removeItem(k.save + '-prev'); HOMES.rooms.push({ id, name: nm, created: Date.now(), visits: 0, known: 0, post: [] }); changed = true;
      } catch (e) { try { ls.removeItem(nk.map); ls.removeItem(nk.save); } catch (e2) { /* none */ } break; } // no room to copy: the backup stays where it is for next time
    }
  } catch (e) { /* storage blocked: one room, as before */ }
  if (changed) homesSave();
}
homesMigrate();

// ============ ALMANAC: everything a story-teller can change lives in this one object ============
// Defaults are built in. If almanac.json sits next to this page it is fetched and merged over them (see HANDOVER.md).
