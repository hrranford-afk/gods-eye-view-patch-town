<!doctype html><meta charset="utf-8"><title>Style B: live painterly</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/GLTFLoader.js"></script>
<script src="kit.js"></script><script src="people_kit.js"></script><script src="world.js"></script>
<script>
(async()=>{
const [W_,H_]=World.size();const qs=new URLSearchParams(location.search);const RAW=qs.get('raw')==='1';
await World.load();
const renderer=World.renderer(W_,H_);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(new THREE.Color(.62,.50,.46).getHex(),.0018);
scene.add(World.sky({zen:[.20,.34,.62],hor:[.96,.80,.66]}));
const terrain=World.terrain();scene.add(terrain);
const P=World.props();scene.add(P.root);
World.lights(scene,{hemi:1.45,sun:1.9,fill:.8});World.fireLight(scene);
const WATER=`varying vec3 wp;uniform sampler2D uW;uniform vec3 uSun;uniform vec4 uBox;uniform float uTime;
float hs(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
void main(){vec2 uv=(wp.xz-uBox.xy)/uBox.zw;bool inside=uv.x>=0.&&uv.x<=1.&&uv.y>=0.&&uv.y<=1.;vec4 w=texture2D(uW,uv);float depth=inside?w.r*16.:16.;float sd=inside?w.g*12.:12.;
 vec3 turq=vec3(.10,.60,.60),deep=vec3(.03,.16,.34);float k=1.-exp(-depth*.24);vec3 col=mix(turq,deep,k);
 float nz=vn(wp.xz*1.1+uTime*.1),nz2=vn(wp.xz*.3+5.);col*=.92+.16*nz;
 float edge=clamp(1.-(sd-.1+(nz-.5)*.9)/1.0,0.,1.);float foam=clamp(pow(edge,1.3),0.,1.)*(inside?1.:0.);col=mix(col,vec3(.95,.92,.86),foam*.85);
 float a=inside?clamp(.35+.65*(1.-exp(-depth*.7)),0.,1.):1.;a=max(a,foam);
 vec3 V=normalize(cameraPosition-wp);float fr=pow(1.-clamp(V.y,0.,1.),4.);col=mix(col,vec3(.85,.78,.72),fr*.45);
 gl_FragColor=vec4(col,a);}`;
const water=World.water(WATER);scene.add(water);
const cam=World.camera(W_/H_);
const SS=+(qs.get('ss')||1.5);
const rt=new THREE.WebGLRenderTarget(Math.round(W_*SS),Math.round(H_*SS),{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,encoding:THREE.sRGBEncoding});
const fs=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{tC:{value:rt.texture},uRes:{value:new THREE.Vector2(rt.width,rt.height)},uOut:{value:new THREE.Vector2(W_,H_)},uRad:{value:+(qs.get('rad')||5)}},
vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
fragmentShader:`varying vec2 vUv;uniform sampler2D tC;uniform vec2 uRes,uOut;uniform float uRad;
float hs(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){return .5*vn(p)+.25*vn(p*2.1)+.125*vn(p*4.3)+.0625*vn(p*8.7);}
vec3 S(vec2 uv){return texture2D(tC,uv).rgb;}
void main(){vec2 px=1./uRes;
 // 4-sector Kuwahara: mean + variance per quadrant, take the calmest
 vec3 m0=vec3(0),m1=vec3(0),m2=vec3(0),m3=vec3(0);vec3 s0=vec3(0),s1=vec3(0),s2=vec3(0),s3=vec3(0);float n=0.;
 const int R=5;
 for(int j=-R;j<=0;j++)for(int i=-R;i<=0;i++){vec3 c=S(vUv+vec2(i,j)*px);m0+=c;s0+=c*c;}
 for(int j=-R;j<=0;j++)for(int i=0;i<=R;i++){vec3 c=S(vUv+vec2(i,j)*px);m1+=c;s1+=c*c;}
 for(int j=0;j<=R;j++)for(int i=0;i<=R;i++){vec3 c=S(vUv+vec2(i,j)*px);m2+=c;s2+=c*c;}
 for(int j=0;j<=R;j++)for(int i=-R;i<=0;i++){vec3 c=S(vUv+vec2(i,j)*px);m3+=c;s3+=c*c;}
 n=float((R+1)*(R+1));m0/=n;m1/=n;m2/=n;m3/=n;s0=abs(s0/n-m0*m0);s1=abs(s1/n-m1*m1);s2=abs(s2/n-m2*m2);s3=abs(s3/n-m3*m3);
 float v0=s0.r+s0.g+s0.b,v1=s1.r+s1.g+s1.b,v2=s2.r+s2.g+s2.b,v3=s3.r+s3.g+s3.b;
 vec3 col=m0;float mv=v0;if(v1<mv){mv=v1;col=m1;}if(v2<mv){mv=v2;col=m2;}if(v3<mv){mv=v3;col=m3;}
 vec3 orig=S(vUv);
 // rescue small props: where the filter erased a lot of local contrast (people, ropes, tent windows) let some of the original back
 float lost=length(orig-col);col=mix(col,orig,clamp(smoothstep(.07,.22,lost)*.62,0.,.62));
 // pigment pooling: darken along luminance edges of the raw render, tinted by the colour itself (not black)
 float l0=dot(orig,vec3(.3,.59,.11));vec2 o2=vec2(2.2)*px;float gx=dot(S(vUv+vec2(o2.x,0.)),vec3(.3,.59,.11))-dot(S(vUv-vec2(o2.x,0.)),vec3(.3,.59,.11));float gy=dot(S(vUv+vec2(0.,o2.y)),vec3(.3,.59,.11))-dot(S(vUv-vec2(0.,o2.y)),vec3(.3,.59,.11));
 float ed=clamp(length(vec2(gx,gy))*3.2,0.,1.);col*=1.-ed*.34*(.6+.4*vn(vUv*uOut*.08));col=mix(col,col*col*1.3,ed*.35);
 // brush strokes: noise stretched along a diagonal, three scales, modulating value and a little hue
 vec2 p=vUv*uOut;float cs=.866,sn=.5;vec2 q=vec2(dot(p,vec2(cs,sn)),dot(p,vec2(-sn,cs)));
 float st=vn(vec2(q.x*.018,q.y*.22))*.5+vn(vec2(q.x*.05+9.,q.y*.5))*.3+vn(vec2(q.x*.11+4.,q.y*1.1))*.2;col*=1.+(st-.5)*.13;col+=vec3(.025,.012,-.02)*(st-.5);
 // grade: lift, saturation, warm wash
 float lu=dot(col,vec3(.3,.59,.11));col=mix(vec3(lu),col,1.18);col=pow(max(col,0.),vec3(.94))*1.05+vec3(.012,.008,.0);
 // paper: cold-press grain + fibres, and a hand-torn soft margin
 float grain=hs(floor(p))*.5+vn(p*.9)*.5;float fib=vn(vec2(p.x*.02,p.y*.9)+3.)*.5+vn(vec2(p.x*.9,p.y*.02)+8.)*.5;
 vec3 paper=vec3(.965,.93,.86)*(.95+.07*grain)*(.985+.03*fib);
 col=mix(col,col*(.9+.12*grain),.55)*(.97+.05*fib);
 float dm=min(min(p.x,uOut.x-p.x),min(p.y,uOut.y-p.y));float jag=fbm(p*.035)*42.+vn(p*.3)*6.;float mask=smoothstep(8.,22.,dm-jag+22.);
 col=mix(paper,col,mask);col=mix(col,paper*.93,(1.-smoothstep(0.,26.,dm-jag+18.))*.0);
 gl_FragColor=vec4(col,1.);}`}));
fs.frustumCulled=false;const post=new THREE.Scene();post.add(fs);const pc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);
if(RAW){fs.material=new THREE.MeshBasicMaterial({map:rt.texture,depthTest:false});}
renderer.render(post,pc);
window.__info={tris:renderer.info.render.triangles};window.__ready=true;
})();
</script>
