<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Base Camp</title>
<style>
:root{--paper:#fff6e6;--ink:#3b2a1e;--glass:rgba(59,42,30,.74);--acc:#e8883a;--leaf:#7bb661;--sky:#cfe3f2;--body:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#e9dcc4,#cdb89a);font-family:var(--body);color:var(--paper);user-select:none;-webkit-user-select:none}
body>canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui>*{pointer-events:auto}
#touch{position:absolute;inset:0;touch-action:none;z-index:0}
.glass{background:var(--glass);border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px)}
button{font:800 15px var(--body);color:var(--paper);background:rgba(255,246,230,.16);border:2px solid rgba(255,246,230,.42);border-radius:12px;min-height:42px;min-width:44px;padding:4px 12px;touch-action:manipulation}
button.on{background:var(--acc);border-color:#ffd9a8;color:#fff}
button.big{background:var(--acc);border-color:#ffd9a8;font-size:20px;min-height:54px;padding:6px 22px;color:#fff;box-shadow:0 3px 0 #a85a1e}
button.alt{background:#5e8f4a;border-color:#b6dc9d;box-shadow:0 3px 0 #38592b}
button:disabled{opacity:.4}
#title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:26px 30px;width:min(92vw,460px);background:rgba(59,42,30,.82)}
#title h1{margin:0 0 4px;font-size:44px;letter-spacing:1px;color:#ffd9a8;text-shadow:0 3px 0 #7a4a22}
#title p{margin:6px 0 14px;font-size:16px;line-height:1.35;color:#f6e6cc}
#title .row{display:grid;gap:10px;justify-items:center}
#arStatus{margin-top:12px;font:700 13px var(--body);opacity:.8}
#top{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);max-width:min(94vw,640px);text-align:center;font-weight:800;font-size:16px;pointer-events:none}
#hint{display:inline-block;pointer-events:none}
#hint:empty{display:none}
/* In AR inside HelloXR, its own Exit AR button sits top-left: keep our panels clear of it and a bit smaller */
body.inar #top{top:calc(env(safe-area-inset-top,0px) + 120px);font-size:14px;max-width:min(70vw,520px)}
body.inar #card{top:calc(env(safe-area-inset-top,0px) + 120px)}
body.inar #arLog{top:auto;bottom:150px;left:8px;max-width:50vw}
#chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.chip{font:800 13px var(--body);padding:4px 10px;border-radius:99px;color:#2b1d12;pointer-events:auto}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw;padding:8px}
#bmenu{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;gap:8px;padding:8px}
#card{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 8px);font-size:14px;font-weight:700;line-height:1.5;min-width:170px;pointer-events:none}
#card b{color:#ffd9a8}
#sel{position:absolute;left:10px;top:150px;font-size:13px;font-weight:700;min-width:190px;pointer-events:none}
.bar{display:flex;align-items:center;gap:6px;margin-top:3px}
.bar i{display:block;height:8px;border-radius:4px;background:#ffffff33;width:90px;overflow:hidden}
.bar i u{display:block;height:100%;border-radius:4px;text-decoration:none}
#reqs{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:6px;max-width:min(46vw,300px)}
.req{display:flex;gap:8px;align-items:center;text-align:left;font-size:14px;padding:6px 10px;border-radius:14px;background:#fff6e6;color:#3b2a1e;border:2px solid #e8883a}
.req b{font-size:12px;color:#a85a1e;display:block}
.req button{min-height:34px;font-size:13px;padding:2px 10px;color:#fff;background:var(--leaf);border-color:#b6dc9d}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 130px);pointer-events:none;font-weight:800;text-align:center;max-width:90vw}
#toast:empty{display:none}
#env{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);font-size:12px;font-weight:700;display:grid;gap:4px;min-width:170px}
#env select,#env input{width:100%;font:700 12px var(--body)}
#wx{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 120px);width:min(70vw,320px);font-size:14px;text-align:center;font-weight:700;display:grid;gap:10px}
#wx select{font:700 15px var(--body);padding:6px}
#repl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px}
[hidden]{display:none!important}
#ask,#diary,#modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:80vh;overflow:auto;text-align:left;display:grid;gap:10px;padding:16px 18px;background:rgba(59,42,30,.92);border-radius:16px;z-index:5}
#ask{text-align:center}
#diary.side{left:12px;top:calc(env(safe-area-inset-top,0px) + 150px);transform:none;width:min(44vw,430px);max-height:62vh}
.dh{font-size:20px;font-weight:800;color:#ffd9a8}.sub{font-size:13px;opacity:.85;font-weight:600;line-height:1.35}
#diary ul{margin:0;padding-left:20px;display:grid;gap:7px;font-size:15px;line-height:1.35;font-weight:600}
.by{font-size:11px;opacity:.55;font-weight:600;white-space:nowrap}
#tagpick{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(94vw,640px);display:grid;gap:8px;z-index:4}
#tagpick .th{font-weight:800;font-size:16px;color:#ffd9a8}#tagpick .tags{display:flex;flex-wrap:wrap;gap:6px}#tagpick .tags button{min-height:38px;font-size:14px;padding:2px 10px}
.row2,.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row2 input{flex:1 1 150px;font:700 14px var(--body);padding:8px;border-radius:10px;border:2px solid #fff6e655;background:#fff6e6;color:#3b2a1e;min-height:38px}
#modal textarea{width:100%;font:12px ui-monospace,monospace;border-radius:10px;padding:6px;background:#fff6e6;color:#3b2a1e}
label.file{display:inline-block;position:relative;overflow:hidden;font:800 15px var(--body);border:2px solid rgba(255,246,230,.42);border-radius:12px;padding:9px 12px;background:rgba(255,246,230,.16)}label.file input{position:absolute;inset:0;opacity:0}
#guess{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(92vw,520px);display:grid;gap:8px;z-index:4;text-align:center}#guess .th{font-weight:800;font-size:18px;color:#ffd9a8}#guess .row2{justify-content:center}
#rstat{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:12px;font-weight:700;padding:4px 10px;max-width:46vw}
.lib{display:flex;gap:10px;align-items:center}.lib>div{flex:1}.lib button{min-height:34px;font-size:13px}.badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);color:#2b1d12;flex:none}
#welcome{text-align:left;font-size:14px;line-height:1.4;background:rgba(255,246,230,.12);border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#f6e6cc}
#welcome ul{margin:4px 0 0;padding-left:18px;font-weight:600}
body.auto #bar{padding:4px 6px;gap:4px;background:rgba(59,42,30,.55)}
body.auto #bar button{min-height:36px;font-size:13px;padding:2px 8px}
#tmenu{justify-content:center;margin-top:10px}
#count{display:inline-block;margin-top:4px;font:700 12px var(--body);opacity:.8;padding:2px 10px;border-radius:99px;background:var(--glass);pointer-events:none}
#count:empty{display:none}
#hint.fade{opacity:0;transition:opacity 1.2s}
#home{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:800 44px var(--body);color:#ffd9a8;text-shadow:0 3px 0 #7a4a22;pointer-events:none;opacity:0;transition:opacity .6s}
#home.on{opacity:1}
#mapInfo{font:700 13px var(--body);opacity:.85}
#arLog{position:fixed;left:8px;top:70px;z-index:99;max-width:60vw;font:600 13px/1.35 var(--body);color:#fff;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;pointer-events:none;white-space:pre-wrap}
</style>
</head>

    <h1>Base Camp</h1>

  <div id="top"><div id="hint" class="glass"></div><div id="chips"></div><div id="count"></div></div>
  <div id="home"></div>

  <div id="bmenu" class="glass" hidden></div>
  <div id="bar" class="glass" hidden></div>

  <div id="wx" class="glass" hidden></div>
  <div id="ask" hidden></div>
  <div id="diary" hidden></div>
  <div id="tagpick" class="glass" hidden></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), mixLerp = (a, b, t) => a + (b - a) * t;

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const STORE = { status: 'ok', fails: 0, err: '', told: false };
(function storeProbe() { try { localStorage.setItem('bc-probe', '1'); if (localStorage.getItem('bc-probe') !== '1') throw new Error('read back failed'); localStorage.removeItem('bc-probe'); } catch (e) { STORE.status = 'unavailable'; STORE.err = String(e && e.message || e); } })();
function seededRandom(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function withSeed(seed, fn) { const r = Math.random; Math.random = seededRandom(seed); try { return fn(); } finally { Math.random = r; } } // the away simulation gives the same story on the title card and in the game
function safeWrite(key, str) { // the previous good value is kept in a backup slot, so a bad write cannot wipe the colony
  try {
    const old = localStorage.getItem(key); if (old) { try { JSON.parse(old); try { localStorage.setItem(key + '-bak', old); } catch (e) { /* no room for a backup */ } } catch (e) { /* the old value was damaged: keep the older backup */ } }
    localStorage.setItem(key, str); if (localStorage.getItem(key) !== str) throw new Error('could not read the save back'); return true;
  } catch (e) { STORE.fails++; STORE.err = String(e && e.message || e); STORE.status = STORE.status === 'unavailable' ? 'unavailable' : 'failing'; return false; }
}
function safeRead(key, ok) { // main slot, then the backup; sets STORE.status = 'corrupt' if something was there but unreadable
  let bad = false;
  for (const k of [key, key + '-bak']) { let raw = null; try { raw = localStorage.getItem(k); } catch (e) { return null; } if (!raw) continue; try { const d = JSON.parse(raw); if (ok(d)) { if (k !== key) STORE.usedBackup = true; return d; } bad = true; } catch (e) { bad = true; } }
  if (bad) STORE.status = 'corrupt'; return null;
}
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* no storage */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* none */ } } };
