<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Base Camp</title>
<style>
:root{--paper:#fff6e6;--ink:#3b2a1e;--glass:rgba(59,42,30,.74);--acc:#e8883a;--leaf:#7bb661;--sky:#cfe3f2;--body:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body>canvas{display:block;position:fixed;inset:0}

#touch{position:absolute;inset:0;touch-action:none;z-index:0}
.glass{background:var(--glass);border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px)}

button.on{background:var(--acc);border-color:#ffd9a8;color:#fff}
button.big{background:var(--acc);border-color:#ffd9a8;font-size:20px;min-height:54px;padding:6px 22px;color:#fff;box-shadow:0 3px 0 #a85a1e}
button.alt{background:#5e8f4a;border-color:#b6dc9d;box-shadow:0 3px 0 #38592b}

#title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:26px 30px;width:min(92vw,460px);background:rgba(59,42,30,.82)}
#title h1{margin:0 0 4px;font-size:44px;letter-spacing:1px;color:#ffd9a8;text-shadow:0 3px 0 #7a4a22}

#arStatus{margin-top:12px;font:700 13px var(--body);opacity:.8}
#top{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);max-width:min(94vw,640px);text-align:center;font-weight:800;font-size:16px;pointer-events:none}
#hint{display:inline-block;pointer-events:none}

body.inar #card{left:auto;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);font-size:11px;font-weight:700;line-height:1.2;min-width:0;padding:2px 8px;border-radius:9px;opacity:.85;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
body.inar #arLog{top:auto;bottom:150px;left:8px;max-width:50vw}
#chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.chip{font:800 13px var(--body);padding:4px 10px;border-radius:99px;color:#2b1d12;pointer-events:auto}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 16px);padding:8px}

.bar{display:flex;align-items:center;gap:6px;margin-top:3px}
.bar i{display:block;height:8px;border-radius:4px;background:#ffffff33;width:90px;overflow:hidden}
.bar i u{display:block;height:100%;border-radius:4px;text-decoration:none}
#reqs{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:6px;max-width:min(46vw,300px)}
.req{display:flex;gap:8px;align-items:center;text-align:left;font-size:14px;padding:6px 10px;border-radius:14px;background:#fff6e6;color:#3b2a1e;border:2px solid #e8883a}

#ask,#diary,#modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:80vh;overflow:auto;text-align:left;display:grid;gap:10px;padding:16px 18px;background:rgba(59,42,30,.92);border-radius:16px;z-index:5}
#ask{text-align:center}

.by{font-size:11px;opacity:.55;font-weight:600;white-space:nowrap}

#tagpick .th{font-weight:800;font-size:16px;color:#ffd9a8}#tagpick .tags{display:flex;flex-wrap:wrap;gap:6px}#tagpick .tags button{min-height:38px;font-size:14px;padding:2px 10px}
.row2,.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row2 input{flex:1 1 150px;font:700 14px var(--body);padding:8px;border-radius:10px;border:2px solid #fff6e655;background:#fff6e6;color:#3b2a1e;min-height:38px}
#modal textarea{width:100%;font:12px ui-monospace,monospace;border-radius:10px;padding:6px;background:#fff6e6;color:#3b2a1e}
label.file{display:inline-block;position:relative;overflow:hidden;font:800 15px var(--body);border:2px solid rgba(255,246,230,.42);border-radius:12px;padding:9px 12px;background:rgba(255,246,230,.16)}label.file input{position:absolute;inset:0;opacity:0}
#guess{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(92vw,520px);display:grid;gap:8px;z-index:4;text-align:center}#guess .th{font-weight:800;font-size:18px;color:#ffd9a8}#guess .row2{justify-content:center}

#msgs{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:min(92vw,520px);z-index:6;pointer-events:none}

#rstat{font-size:12px;font-weight:700;padding:3px 10px;max-width:100%;text-align:center}

body.inar #diary.side{left:8px;top:calc(env(safe-area-inset-top,0px) + 170px);width:min(88vw,380px);max-height:46vh;padding:10px 12px;font-size:13px}body.inar #diary.side ul{font-size:13px;gap:5px}body.inar #diary.side .dh{font-size:16px}body.inar #diary.side button.big{min-height:38px;font-size:14px;padding:4px 14px}
.lib{display:flex;gap:10px;align-items:center}.lib>div{flex:1}.lib button{min-height:34px;font-size:13px}.badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);color:#2b1d12;flex:none}
#welcome{text-align:left;font-size:14px;line-height:1.4;background:rgba(255,246,230,.12);border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#f6e6cc}
#welcome ul{margin:4px 0 0;padding-left:18px;font-weight:600}
body.auto #bar{padding:4px 6px;gap:4px;background:rgba(59,42,30,.55)}
body.auto #bar button{min-height:36px;font-size:13px;padding:2px 8px}
body.auto #bar{flex-wrap:wrap;gap:2px;padding:3px 4px;max-width:calc(100vw - 8px)}body.auto #bar button.ic{min-height:40px;min-width:40px;padding:2px 3px;flex:0 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border-radius:11px}body.auto #bar button.ic i{font-style:normal;font-size:18px}body.auto #bar button.ic small{font-size:8.5px;font-weight:700;opacity:.8;margin-top:1px}
#bar.min{background:none;backdrop-filter:none;padding:0;left:auto;right:12px;transform:none}#bar.min button.round{width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;font-size:20px}
#tmenu{justify-content:center;margin-top:10px}
#count{display:inline-block;margin-top:4px;font:700 12px var(--body);opacity:.8;padding:2px 10px;border-radius:99px;background:var(--glass);pointer-events:none}
#count:empty{display:none}
#hint.fade{opacity:0;transition:opacity 1.2s}
#home{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:800 44px var(--body);color:#ffd9a8;text-shadow:0 3px 0 #7a4a22;pointer-events:none;opacity:0;transition:opacity .6s}
#home.on{opacity:1}
#mapInfo{font:700 13px var(--body);opacity:.85}
#colMark{position:absolute;width:28px;height:28px;border-radius:50%;background:rgba(255,217,168,.35);box-shadow:0 0 12px 4px rgba(255,217,168,.55);display:grid;place-items:center;font-size:16px;color:#fff6e6;pointer-events:none;z-index:3}
#idDot{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);width:8px;height:8px;border-radius:50%;background:#ffd9a8;opacity:.55;animation:idp 1.6s ease-in-out infinite;pointer-events:none;z-index:3}@keyframes idp{50%{opacity:.12}}
#nroom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:4;max-width:min(94vw,560px)}#nroom b{font-size:16px;color:#ffd9a8}#nroom button{min-height:36px;font-size:14px;padding:2px 12px}#nroom span{display:flex;gap:6px;flex-wrap:wrap}
#rooms .rcard{display:flex;min-height:120px;background:rgba(255,246,230,.14);border-radius:16px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,246,230,.22)}#rooms .rcard:active{background:rgba(255,246,230,.26)}#rooms .rph{flex:0 0 38%;max-width:200px;min-width:120px;object-fit:cover;display:block;background:#2b1d12}#rooms .rbody{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}#rooms .rbody b{font-size:17px}#rooms .rgo{font:800 13px var(--body);opacity:.9}#rooms .rbtn{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}#rooms .rbtn button,#rooms .tslot button{min-height:34px;font-size:12px;padding:4px 10px}#rooms .tslot{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}#rooms .tnote{font-size:10px;opacity:.7;flex-basis:100%}#card img.cth{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #ffd9a8;pointer-events:auto;vertical-align:middle;margin-right:8px}#card:not(.inline) img.cth{float:left}
#rooms{display:grid;gap:6px;margin:8px 0;text-align:left}#rooms .lib{background:rgba(255,246,230,.12);border-radius:12px;padding:6px 10px;flex-wrap:wrap}#rooms .lib>div{min-width:150px}#rooms input.rn{font:800 15px var(--body);padding:6px 10px;border-radius:10px;border:2px solid rgba(255,246,230,.42);background:rgba(0,0,0,.2);color:inherit;width:100%;box-sizing:border-box}
#banner{display:none;font:800 18px var(--body);color:#3b2a1e;background:linear-gradient(#fffaf0,#ffe1b0);border:3px solid #e8883a;border-radius:22px;padding:5px 18px 6px;box-shadow:0 3px 0 #a85a1e;text-align:center;max-width:100%}@keyframes bpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
body.auto #sel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
#banner.on{display:block;animation:bpop .35s cubic-bezier(.3,1.6,.5,1)}#banner small{display:block;font-size:11px;font-weight:700;opacity:.72}
body.inar #banner{font-size:14px;padding:3px 14px 4px}body.inar #reqs{top:calc(env(safe-area-inset-top,0px) + 36px)}
.alb{display:flex;gap:10px;align-items:center;background:rgba(255,246,230,.1);border-radius:12px;padding:6px 10px}.alb .ai{font-size:26px}.alb>div{flex:1}.alb .ad{font-size:11px;opacity:.7;white-space:nowrap}
#bmenu{flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 16px)}
/* build 12: the toolbar must fit at any width down to 390 px: it wraps to rows, and in AR the buttons shrink a little (still 44 px high) */
body.inar #bar{gap:4px;padding:5px}body.inar #bar button{min-height:44px;min-width:44px;font-size:13px;padding:2px 8px}body.inar #bar button.ic{min-width:40px;padding:2px 3px}body.inar #bar button.big{font-size:15px;padding:4px 14px}
@media (max-width:520px){#bar button{font-size:12px;padding:2px 6px}#bar{gap:4px}}body.auto #bmenu{gap:4px;padding:5px}body.auto #bmenu button{min-height:34px;font-size:13px;padding:2px 9px}
#gstrip{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 34px);font-size:13px;font-weight:700;padding:2px 8px;border-radius:9px;max-width:80vw;white-space:nowrap;pointer-events:none}
#card .goal{margin-top:5px;padding-top:4px;border-top:1px solid rgba(255,246,230,.22)}#card .goal .strip{font-size:17px;line-height:1.35;letter-spacing:1px}#card .gg{white-space:nowrap}#card .dim,#gstrip .dim{opacity:.38}#card .gsub{font-size:11px;opacity:.78;font-weight:600;line-height:1.3}
#card .resrow{margin:3px 0}.res{display:inline-flex;align-items:center;gap:3px;margin-right:9px}.res i{font-style:normal;font-size:15px}.res u{display:inline-block;width:34px;height:7px;border-radius:4px;background:rgba(255,246,230,.25);text-decoration:none;overflow:hidden}.res u em{display:block;height:100%;border-radius:4px;background:#8fd16f}
#card .face{font-size:20px;vertical-align:-2px}#card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}#card .cbtn{pointer-events:auto;min-height:30px;min-width:0;font-size:12px;padding:1px 8px;border-radius:10px;margin-top:4px}#card .chips .cbtn{margin-top:0}
#ccam{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 118px);width:152px;border-radius:16px;border:3px solid #ffd9a8;box-shadow:0 3px 0 #a85a1e;overflow:hidden;pointer-events:auto;z-index:7;background:transparent;cursor:pointer}#ccam[hidden]{display:none}
#ccamView{width:100%;height:118px}#ccam .cinfo{background:rgba(59,42,30,.88);padding:3px 8px 4px;font-size:12px;font-weight:700;line-height:1.25}#ccam .cinfo span{font-size:16px}#ccam .cinfo b{color:#ffd9a8}#ccam .cx{position:absolute;right:4px;top:3px;width:22px;height:22px;border-radius:50%;background:rgba(59,42,30,.72);text-align:center;font-size:12px;line-height:22px}
body.inar #ccam{top:calc(env(safe-area-inset-top,0px) + 150px)}
.doors{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.doors .door{min-height:48px;padding:0;font-size:20px;border-radius:10px;background:rgba(255,246,230,.14)}.doors .door.ready{background:var(--acc);border-color:#ffd9a8;box-shadow:0 0 10px #ffc040}.doors .door.open{background:rgba(143,209,111,.35)}.doors .door.locked{opacity:.45}.doors .door span{font-size:15px}.doors .door b{font-size:17px;color:#fff}

<body>
<div id="ui">
  <div id="touch"></div>
  <div id="title" class="glass">
    <h1>Base Camp</h1>
    <p>A tiny colony that settles the real surfaces of your room. Just press Play and look around: they find their own home, know the room when you come back, and love a tidy house.</p>
    <div id="welcome" hidden></div>
    <div class="row">
      <button class="big" id="bPlay" disabled>Play</button>
      <button class="alt" id="bBattle">Battle!</button>
      <button id="bMore">More...</button>
    </div>
    <div id="rooms" hidden></div>
    <input type="file" id="totemIn" accept="image/*" capture="environment" hidden><input type="file" id="totemLib" accept="image/*" hidden>
    <div id="tmenu" class="mrow" hidden>
      <button id="bFresh">Start a new room</button>
      <button id="bPrac" class="alt">Practice room</button>
      <button id="bMap">Manual: map my room</button>
      <button id="bMapIO">Room map: export / import</button>
      <button id="bHomes" hidden>Rooms and totems</button>
      <button id="bNew" hidden>Forget my colony</button>
      <div id="storeInfo" class="sub" style="flex-basis:100%"></div>
    </div>
    <div id="mapInfo"></div>
    <div id="arStatus">AR: checking...</div>
  </div>
  <div id="top"><div id="hint" class="glass"></div><div id="chips"></div><div id="count"></div></div>
  <div id="home"></div>
  <div id="idDot" hidden></div>
  <div id="colMark" hidden><span>&#10148;</span></div>
  <div id="nroom" class="glass" hidden></div>
  <div id="gstrip" class="glass" hidden></div>
  <div id="card" class="glass" hidden></div>
  <div id="ccam" hidden><div id="ccamView"></div><div class="cinfo"><span id="ccamMood"></span> <b id="ccamName"></b><div id="ccamDoing"></div></div><div class="cx">✕</div></div>
  <div id="sel" class="glass" hidden></div>
  <div id="reqs"></div>
  <div id="msgs"><div id="toast"></div><div id="banner"></div><div id="repc" class="glass" hidden></div><div id="rstat" class="glass" hidden></div></div>
  <div id="bmenu" class="glass" hidden></div>
  <div id="bar" class="glass" hidden></div>
  <div id="repl" class="glass" hidden></div>
  <div id="env" class="glass" hidden></div>
  <div id="wx" class="glass" hidden></div>
  <div id="ask" hidden></div>
  <div id="diary" hidden></div>
  <div id="tagpick" class="glass" hidden></div>
  <div id="guess" class="glass" hidden></div>
  <div id="modal" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="models/props.js"></script>
<script src="models/decor.js"></script> <!-- build 18: the season decorations (BC_DECOR_MK). Optional: without it the plain DECOR_MK shapes are built -->
<!-- build 17: three.js glTF loader (same version as three.js), for the animated mouse. async, so a slow CDN never holds the game back; without it the procedural mouse is used -->
<script async src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="window.__gltfBad = 1"></script>
<script>
'use strict';
// Base Camp: a living colony on the real surfaces of your room. One file. Sections: basics, almanac (data), environment
// (light, clock, weather), scan (zones), models, colony simulation, input and UI, AR mode, practice room, main loop.
const BUILD = 'build 19 + sound';
