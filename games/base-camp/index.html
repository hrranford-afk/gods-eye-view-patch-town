<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Base Camp</title>
<style>
:root{--paper:#fff6e6;--ink:#3b2a1e;--glass:rgba(59,42,30,.74);--acc:#e8883a;--leaf:#7bb661;--sky:#cfe3f2;--body:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#e9dcc4,#cdb89a);font-family:var(--body);color:var(--paper);user-select:none;-webkit-user-select:none}
body>canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui>*{pointer-events:auto}
#touch{position:absolute;inset:0;touch-action:none;z-index:0}
.glass{background:var(--glass);border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px)}
button{font:800 15px var(--body);color:var(--paper);background:rgba(255,246,230,.16);border:2px solid rgba(255,246,230,.42);border-radius:12px;min-height:42px;min-width:44px;padding:4px 12px;touch-action:manipulation}
button.on{background:var(--acc);border-color:#ffd9a8;color:#fff}
button.big{background:var(--acc);border-color:#ffd9a8;font-size:20px;min-height:54px;padding:6px 22px;color:#fff;box-shadow:0 3px 0 #a85a1e}
button.alt{background:#5e8f4a;border-color:#b6dc9d;box-shadow:0 3px 0 #38592b}
button:disabled{opacity:.4}
#title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:26px 30px;width:min(92vw,460px);background:rgba(59,42,30,.82)}
#title h1{margin:0 0 4px;font-size:44px;letter-spacing:1px;color:#ffd9a8;text-shadow:0 3px 0 #7a4a22}
#title p{margin:6px 0 14px;font-size:16px;line-height:1.35;color:#f6e6cc}
#title .row{display:grid;gap:10px;justify-items:center}
#arStatus{margin-top:12px;font:700 13px var(--body);opacity:.8}
#top{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);max-width:min(94vw,640px);text-align:center;font-weight:800;font-size:16px;pointer-events:none}
#hint{display:inline-block;pointer-events:none}
#hint:empty{display:none}
#chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.chip{font:800 13px var(--body);padding:4px 10px;border-radius:99px;color:#2b1d12;pointer-events:auto}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw;padding:8px}
#bmenu{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;gap:8px;padding:8px}
#card{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 8px);font-size:14px;font-weight:700;line-height:1.5;min-width:170px;pointer-events:none}
#card b{color:#ffd9a8}
#sel{position:absolute;left:10px;top:150px;font-size:13px;font-weight:700;min-width:190px;pointer-events:none}
.bar{display:flex;align-items:center;gap:6px;margin-top:3px}
.bar i{display:block;height:8px;border-radius:4px;background:#ffffff33;width:90px;overflow:hidden}
.bar i u{display:block;height:100%;border-radius:4px;text-decoration:none}
#reqs{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:6px;max-width:min(46vw,300px)}
.req{display:flex;gap:8px;align-items:center;text-align:left;font-size:14px;padding:6px 10px;border-radius:14px;background:#fff6e6;color:#3b2a1e;border:2px solid #e8883a}
.req b{font-size:12px;color:#a85a1e;display:block}
.req button{min-height:34px;font-size:13px;padding:2px 10px;color:#fff;background:var(--leaf);border-color:#b6dc9d}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 130px);pointer-events:none;font-weight:800;text-align:center;max-width:90vw}
#toast:empty{display:none}
#env{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);font-size:12px;font-weight:700;display:grid;gap:4px;min-width:170px}
#env select,#env input{width:100%;font:700 12px var(--body)}
#wx{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 120px);width:min(70vw,320px);font-size:14px;text-align:center;font-weight:700;display:grid;gap:10px}
#wx select{font:700 15px var(--body);padding:6px}
#repl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px}
[hidden]{display:none!important}
#ask,#diary,#modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:80vh;overflow:auto;text-align:left;display:grid;gap:10px;padding:16px 18px;background:rgba(59,42,30,.92);border-radius:16px;z-index:5}
#ask{text-align:center}
.dh{font-size:20px;font-weight:800;color:#ffd9a8}.sub{font-size:13px;opacity:.85;font-weight:600;line-height:1.35}
#diary ul{margin:0;padding-left:20px;display:grid;gap:7px;font-size:15px;line-height:1.35;font-weight:600}
.by{font-size:11px;opacity:.55;font-weight:600;white-space:nowrap}
#tagpick{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(94vw,640px);display:grid;gap:8px;z-index:4}
#tagpick .th{font-weight:800;font-size:16px;color:#ffd9a8}#tagpick .tags{display:flex;flex-wrap:wrap;gap:6px}#tagpick .tags button{min-height:38px;font-size:14px;padding:2px 10px}
.row2,.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row2 input{flex:1 1 150px;font:700 14px var(--body);padding:8px;border-radius:10px;border:2px solid #fff6e655;background:#fff6e6;color:#3b2a1e;min-height:38px}
#modal textarea{width:100%;font:12px ui-monospace,monospace;border-radius:10px;padding:6px;background:#fff6e6;color:#3b2a1e}
label.file{display:inline-block;position:relative;overflow:hidden;font:800 15px var(--body);border:2px solid rgba(255,246,230,.42);border-radius:12px;padding:9px 12px;background:rgba(255,246,230,.16)}label.file input{position:absolute;inset:0;opacity:0}
#mapInfo{font:700 13px var(--body);opacity:.85}
#arLog{position:fixed;left:8px;top:70px;z-index:99;max-width:60vw;font:600 13px/1.35 var(--body);color:#fff;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="ui">
  <div id="touch"></div>
  <div id="title" class="glass">
    <h1>Base Camp</h1>
    <p>A tiny colony that settles the real surfaces of your room. Map your room once, name the speaker, the cup, the warm box, then help the little people grow. Come back later: they kept going, and they love a tidy house.</p>
    <div class="row">
      <button class="big" id="bAR" hidden>Start in AR</button>
      <button class="big alt" id="bPrac">Practice room</button>
      <button class="big" id="bMap">Map my room</button>
      <button id="bCont" hidden>Continue my colony</button>
      <button id="bMapIO">Room map: export / import</button>
      <button id="bNew" hidden>Forget my colony</button>
    </div>
    <div id="mapInfo"></div>
    <div id="arStatus">AR: checking...</div>
  </div>
  <div id="top"><div id="hint" class="glass"></div><div id="chips"></div></div>
  <div id="card" class="glass" hidden></div>
  <div id="sel" class="glass" hidden></div>
  <div id="reqs"></div>
  <div id="toast"></div>
  <div id="bmenu" class="glass" hidden></div>
  <div id="bar" class="glass" hidden></div>
  <div id="repl" class="glass" hidden></div>
  <div id="env" class="glass" hidden></div>
  <div id="wx" class="glass" hidden></div>
  <div id="ask" hidden></div>
  <div id="diary" hidden></div>
  <div id="tagpick" class="glass" hidden></div>
  <div id="modal" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// Base Camp: a living colony on the real surfaces of your room. One file. Sections: basics, almanac (data), environment
// (light, clock, weather), scan (zones), models, colony simulation, input and UI, AR mode, practice room, main loop.
const BUILD = 'build 1';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.floor(Math.random() * a.length)];
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* no storage */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* none */ } } };

// ============ ALMANAC: everything a story-teller can change lives in this one object ============
// Defaults are built in. If almanac.json sits next to this page it is fetched and merged over them (see HANDOVER.md).
const COLONY_ALMANAC = {
  colonists: [ // personality: work/social/lazy are weights (1 = normal); likes: kinds of things they love being near
    { name: 'Pip', personality: { work: 1.3, social: 0.8, lazy: 0.6 }, likes: ['tree'] },
    { name: 'Moss', personality: { work: 0.9, social: 1.4, lazy: 1 }, likes: ['well', 'hut'] },
    { name: 'Tansy', personality: { work: 1.1, social: 1, lazy: 0.8 }, likes: ['farm'] },
    { name: 'Bram', personality: { work: 1.2, social: 0.7, lazy: 1.2 }, likes: ['tent'] },
    { name: 'Nell', personality: { work: 0.8, social: 1.5, lazy: 0.9 }, likes: ['tree', 'well'] },
    { name: 'Fig', personality: { work: 1, social: 1, lazy: 1.5 }, likes: ['hut'] },
    { name: 'Wren', personality: { work: 1.4, social: 0.9, lazy: 0.5 }, likes: ['lookout', 'tree'] },
    { name: 'Dot', personality: { work: 0.9, social: 1.2, lazy: 1 }, likes: ['farm', 'well'] },
    { name: 'Rook', personality: { work: 1.1, social: 0.8, lazy: 1.1 }, likes: ['station'] },
  ],
  // A request: shown as a bubble and a card when `when` is true for a settlement. `give` is what the player gives.
  // when: needWater | noSeeds | hot | cold | noWood | cantReach | bored | night
  requests: [
    { id: 'water', icon: 'drop', text: 'We need water!', when: 'needWater', give: 'water', joy: 0.3, cooldown: 240 },
    { id: 'seed', icon: 'seed', text: 'A seed please!', when: 'noSeeds', give: 'seed', joy: 0.25, cooldown: 240 },
    { id: 'shade', icon: 'sun', text: 'Too hot. Shade, please?', when: 'hot', give: 'shade', joy: 0.3, cooldown: 300 },
    { id: 'wood', icon: 'log', text: 'We are out of wood.', when: 'noWood', give: 'wood', joy: 0.2, cooldown: 300 },
    { id: 'warm', icon: 'flame', text: 'Brr! Some firewood?', when: 'cold', give: 'wood', joy: 0.3, cooldown: 300 },
    { id: 'reach', icon: 'cable', text: "We can't reach the other places. Build us a cable car!", when: 'cantReach', give: 'cablecar', joy: 0.35, cooldown: 600 },
    { id: 'cheer', icon: 'heart', text: 'Feeling a bit glum. A cheer?', when: 'bored', give: 'cheer', joy: 0.35, cooldown: 300 },
    { id: 'room', icon: 'bang', text: 'No room to build! Could the Giant clear us a little space?', when: 'cramped', give: 'cheer', joy: 0.3, cooldown: 900 },
  ],
  // Daily events: a small happening at a given hour (or any), with an effect on the colony's mood or stock.
  events: [
    { id: 'picnic', text: 'The colonists are having a picnic.', hours: [12, 14], chance: 0.5, effect: { joy: 0.15 } },
    { id: 'rainbow', text: 'A tiny rainbow! Everyone cheers.', needs: 'rain', hours: [8, 19], chance: 0.15, effect: { joy: 0.25 } },
    { id: 'fireflies', text: 'Fireflies tonight. So pretty.', hours: [20, 23], chance: 0.4, effect: { joy: 0.12 } },
    { id: 'gift', text: 'A traveller left a bag of seeds.', hours: [8, 18], chance: 0.15, effect: { seeds: 2 } },
  ],
};
// ---- the council's data (PatchTown's resident LLMs wrote these; their words are kept as they are) ----
// rooms.json: what each kind of spot in a room is used for. creatures.json: who the little people are. almanac.json: names, requests, events.
// Each file is fetched from next to the page (http/https only). A missing or broken file means the built-in copy below is used.
const ROOMS = { spots: [{"spot": "top of speaker", "used_for": "broadcast tower", "gives": "vibration signals, music for morale, elevated view", "costs": "constant bass rattles their teeth, speakers blow dust everywhere", "how_they_get_there": "zip-line made of dental floss", "funny_thing": "they try to \"DJ\" by tapping the cone, causing accidental bass drops that knock over their own breakfast", "by": "The Town Brain"}, {"spot": "windowsill", "used_for": "solar farm", "gives": "warmth, sunlight for photosynthesis, rainwater collection", "costs": "extreme exposure to wind, curious cats, sudden temperature swings", "how_they_get_there": "pulley system using thread and a paperclip", "funny_thing": "they build tiny glasshouses that instantly fog up, and argue over who gets to \"eat\" the condensation", "by": "The Town Brain"}, {"spot": "under sofa", "used_for": "hideout and nursery", "gives": "darkness, safety, constant dust accumulation for food and building", "costs": "claustrophobia, vacuum cleaner apocalypses, lost items like coins and socks", "how_they_get_there": "rope ladder dropped from the rug edge", "funny_thing": "they mistake a lost sock for a mythical \"cloud-beast\" and try to tame it with tiny lassos", "by": "The Town Brain"}, {"spot": "radiator", "used_for": "forge and heat workshop", "gives": "reliable warmth, metal for crafting, steam for cooking", "costs": "scorching burns, loud ticking and popping, dry air", "how_they_get_there": "hot-air balloon made from a tea bag", "funny_thing": "they try to toast crumb-pies on the fins and accidentally weld a spoon to the floor", "by": "The Town Brain"}, {"spot": "worktop", "used_for": "trading post and market", "gives": "flat space, access to food scraps, high foot traffic", "costs": "grease, slippery surfaces, human interference", "how_they_get_there": "catapult launch using a bent fork tine", "funny_thing": "they try to conduct trade with sugar cubes, but one melts into a sticky black hole that swallows their ledger", "by": "The Town Brain"}, {"spot": "Shelves", "used_for": "Storage", "gives": "Extra space for storing food and resources", "costs": "Dusty", "how_they_get_there": "Cable car", "funny_thing": "A Fluffkin accidentally knocked over a shelf, sending a cloud of dust flying everywhere", "by": "The Radeon Coder"}, {"spot": "Top of a speaker", "used_for": "Lookout", "gives": "A bird's-eye view of the room", "costs": "Loud", "how_they_get_there": "Rope", "funny_thing": "A Fluffkin climbed up the speaker and accidentally turned it on, causing a loud and annoying sound", "by": "The Radeon Coder"}, {"spot": "Floor", "used_for": "Farm", "gives": "Space for growing food", "costs": "Dusty", "how_they_get_there": "Ladder", "funny_thing": "A Fluffkin accidentally stepped on a plant, causing it to wilt and droop", "by": "The Radeon Coder"}, {"spot": "Rug", "used_for": "Hideout", "gives": "A cozy place to rest and hide", "costs": "Warm but dangerous", "how_they_get_there": "Catapult", "funny_thing": "A Fluffkin accidentally launched itself into the rug, causing it to bounce around uncontrollably", "by": "The Radeon Coder"}, {"spot": "Sofa", "used_for": "Workshop", "gives": "Space for crafting and building", "costs": "Dusty", "how_they_get_there": "Tunnel", "funny_thing": "A Fluffkin accidentally fell asleep on a tool, causing it to break", "by": "The Radeon Coder"}] };
const CREATURES = [{"name": "Glip", "made_of": "static-charged lint and a single lost earring back", "scared_of": "sudden loud noises, especially the microwave beep", "says_when_it_panics": "Static's frizzing! The air's got teeth!", "says_when_happy": "Ooh, crisp! I love the hum of the fridge!", "secretly_brilliant_at": "navigating by magnetic fields and fixing broken cable cars with spit and hope", "gross_or_silly_habit": "collects and polishes other creatures' shed fluff into tiny, useless statues", "by": "The Town Brain"}, {"name": "Grizzle", "made_of": "Dried moss and discarded bottle caps", "scared_of": "Sudden, bright lights; they make his moss brittle.", "says_when_it_panics": "’Dim it! Dim it, I say!’", "says_when_happy": "’Hmph. Adequate.’", "secretly_brilliant_at": "Calculating structural integrity of Fluffkin constructions.", "gross_or_silly_habit": "Constantly sheds moss flakes, leaving a green trail everywhere.", "by": "The Dell Surveyor"}, {"name": "Fluffflur", "made_of": "dust bunnies and fluff", "scared_of": "", "says_when_it_panics": "I'm going to eat you!", "says_when_happy": "Yay, more fluff! ", "secretly_brilliant_at": "", "gross_or_silly_habit": "", "by": "The Mill Hand"}, {"name": "Glimmerfluff", "made_of": "Shimmering dust and tiny, iridescent feathers", "scared_of": "Darkness and loud noises", "says_when_it_panics": "Giggles nervously and starts spinning in circles", "says_when_happy": "Sings a cheerful tune and twirls around", "secretly_brilliant_at": "Creating dazzling light displays and solving puzzles", "gross_or_silly_habit": "Flutters its feathers in a silly dance when excited", "by": "The Radeon Coder"}];
const COUNCIL = { almanac: false, rooms: false, creatures: false, ready: null };
const hash01 = (s, salt) => { let h = 2166136261 ^ (salt || 0); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10007) / 10007; };
const LIKE_KINDS = [[/plant|tree|flower|mushroom|berr|forest|grow|garden|moss/i, 'tree'], [/gadget|build|invent|machine|work/i, 'station'], [/explor|cable|adventur|ceiling|treasure/i, 'lookout'], [/sun|light|morning|day/i, 'farm'], [/pebble|story|stories|song|bird|hum/i, 'well'], [/cozy|rest|hide|dust/i, 'hut']];
function likesToKinds(arr) { const out = []; for (const s of arr || []) for (const [re, k] of LIKE_KINDS) if (re.test(s) && !out.includes(k)) out.push(k); return out.length ? out : ['tent']; }
function persFromText(name, text) {
  const t = String(text || ''), h = (n) => hash01(name, n);
  return { work: +(0.85 + 0.35 * h(1) + (/build|invent|energetic|earnest/i.test(t) ? 0.2 : 0)).toFixed(2), social: +(0.8 + 0.6 * h(2) + (/cheerful|playful|gentle|friendly/i.test(t) ? 0.25 : 0)).toFixed(2), lazy: +(0.6 + 0.6 * h(3) + (/gentle|clumsy|dreamy/i.test(t) ? 0.25 : 0)).toFixed(2) };
}
const WHEN_HOURS = { morning: [6, 12], afternoon: [12, 18], evening: [18, 22], night: [22, 24] };
const ASKS = { seed: { when: 'noSeeds', give: 'seed', icon: 'seed' }, cable_car: { when: 'cantReach', give: 'cablecar', icon: 'cable' }, water: { when: 'needWater', give: 'water', icon: 'drop' }, shade: { when: 'hot', give: 'shade', icon: 'sun' }, wood: { when: 'noWood', give: 'wood', icon: 'log' }, cheer: { when: 'bored', give: 'cheer', icon: 'heart' } };
function adoptAlmanac(j) { // the council's almanac has its own shape; it is turned into ours here. Old-shape files (objects with work/social/lazy) work too.
  const A = COLONY_ALMANAC;
  if (Array.isArray(j.colonists) && j.colonists.length) A.colonists = j.colonists.map((c) => (c && typeof c.personality === 'object' ? c : { name: c.name, persona: c.personality, personality: persFromText(c.name, c.personality), likes: likesToKinds(c.likes), likesText: c.likes, dislikes: c.dislikes, dream: c.dream, by: c.by })).filter((c) => c.name);
  if (Array.isArray(j.requests) && j.requests.length) {
    const made = j.requests.map((q, i) => { if (q.when) return q; const a = ASKS[q.asks_for] || ASKS.cheer; return { id: 'c' + i, icon: a.icon, text: q.says, when: a.when, give: a.give, joy: 0.3, cooldown: 300, who: q.colonist, by: q.by }; }).filter((q) => q.text);
    for (const q of made) q.council = true;
    A.requests = made.concat(A.requests.filter((q) => !q.council)); // the council's words first; the built-in ones are the fallback when their asker is not around
  }
  if (Array.isArray(j.events) && j.events.length) A.events = j.events.map((e, i) => (e.hours ? e : { id: 'e' + i, title: e.title, text: e.what_happens, say: e.colonist_says, hours: WHEN_HOURS[e.when] || [0, 24], chance: 0.5, needs: e.weather === 'rain' ? 'rain' : undefined, effect: { joy: 0.12 }, by: e.by })).filter((e) => e.text);
  COUNCIL.almanac = true;
}
const loadJson = (name) => (location.protocol === 'file:' ? Promise.reject() : fetch(name)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
COUNCIL.ready = Promise.all([loadJson('almanac.json'), loadJson('rooms.json'), loadJson('creatures.json')]).then(([a, r, c]) => {
  try { if (a && typeof a === 'object') adoptAlmanac(a); } catch (e) { /* keep built-ins */ }
  if (r && Array.isArray(r.spots) && r.spots.length) { ROOMS.spots = r.spots; COUNCIL.rooms = true; }
  if (c && Array.isArray(c.creatures) && c.creatures.length) { CREATURES.length = 0; CREATURES.push(...c.creatures); COUNCIL.creatures = true; }
});


// ============ ENVIRONMENT: light, clock, weather ============
const ENV = {
  sun: 1, light: 1, // sun: how bright the room is (AR: ARKit's ambient light; practice: the slider). light: AR light for the renderer
  hourOverride: null, // practice: a fixed hour (null = the device clock)
  hour: 12, sunrise: 7, sunset: 18, daylight: 1, night: false,
  wx: { temp: 15, rain: 0, cloud: 0.1, wind: 3, code: 0, real: false }, wxPick: 'auto', loc: null,
  hot: false, cold: false, rain: 0, dim: false, windy: false, grow: 1,
};
function envUpdate() {
  const d = new Date(), h = ENV.hourOverride !== null ? ENV.hourOverride : d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  ENV.hour = h;
  ENV.daylight = smooth(ENV.sunrise - 0.5, ENV.sunrise + 0.5, h) * (1 - smooth(ENV.sunset - 0.5, ENV.sunset + 0.5, h));
