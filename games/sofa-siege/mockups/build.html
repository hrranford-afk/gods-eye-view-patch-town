  for(var i=0;i<6;i++)box(.085,.44,.04,i%2?blue:wood,(i-2.5)*.092,.22,0,gr);box(.56,.03,.05,dark,0,.08,.03,gr);box(.56,.03,.05,dark,0,.36,.03,gr);var d=box(.03,.5,.05,dark,-.14,.22,.03,gr);d.rotation.z=.65;var d2=box(.03,.5,.05,dark,.14,.22,.03,gr);d2.rotation.z=-.65;})();

  [-1,1].forEach(function(s){var w=cyl(.065,.065,.035,dark,s*.12,.065,.06,gr,12);w.rotation.z=Math.PI/2;});
  var b=cyl(.05,.06,.36,brass,0,.17,.04,gr,14);b.rotation.x=Math.PI/2-.2;var c=cyl(.03,.035,.05,M(0xc9a37a),0,.21,.24,gr,10);c.rotation.x=Math.PI/2-.2;})();
