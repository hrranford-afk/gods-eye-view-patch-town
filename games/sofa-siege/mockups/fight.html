<!doctype html><html><head><meta charset="utf-8"><title>Sofa siege look</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a1c12;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block}
.hud{position:fixed;left:0;right:0;top:14px;display:flex;justify-content:center;gap:14px;align-items:center;pointer-events:none}
.pill{background:rgba(58,40,26,.86);color:#fff3df;border-radius:18px;padding:8px 16px;font-weight:700;font-size:17px}
.meter{width:230px;height:16px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%}
.bar{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px}
.btn{background:rgba(58,40,26,.86);color:#fff3df;border:2px solid rgba(255,243,223,.5);border-radius:14px;padding:10px 18px;font-weight:700;font-size:16px}
.btn.on{background:#e8842c;border-color:#ffd9a8}
.tag{position:fixed;left:16px;top:14px}
.say{position:fixed;background:#fff8ea;color:#3a281a;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;border:2px solid #3a281a}
</style></head><body>
<div class="tag pill" style="font-size:14px">Mock-up · not the game yet</div>
<div class="hud">
  <div class="pill">🪶 Blue 62<div class="meter"><i style="width:62%;background:#2563d6"></i></div></div>
  <div class="pill">Round 2 of 3 · 1:12</div>
  <div class="pill">⚙️ Red 41<div class="meter"><i style="width:41%;background:#d9603a"></i></div></div>
</div>
<div class="say" id="say">Blue holds the hill!</div>
<div class="bar"><div class="btn on">👉 Send squad</div><div class="btn">🏹 Launcher</div><div class="btn">🔨 Mend</div><div class="btn">☰ Menu</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Sofa siege look mock-up: chunky wooden-toy shapes, warm low light. Static scene. */
(function(){
var W=innerWidth,H=innerHeight,R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);R.setPixelRatio(Math.min(2,devicePixelRatio||1));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(R.domElement);
var S=new THREE.Scene();S.background=new THREE.Color(0x3b2a1c);S.fog=new THREE.Fog(0x4a3320,7,16);
var C=new THREE.PerspectiveCamera(38,W/H,.1,60);C.position.set(-0.3,3.0,5.2);C.lookAt(0,0.2,0.05);
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function M(c,o){o=o||{};return new THREE.MeshStandardMaterial({color:c,roughness:o.r==null?.85:o.r,metalness:o.m||0,flatShading:!!o.f,emissive:o.e||0,emissiveIntensity:o.ei||0});}
function add(g,m,x,y,z,p){var o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;(p||S).add(o);return o;}
function box(w,h,d,m,x,y,z,p){return add(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);}
function cyl(a,b,h,m,x,y,z,p,n){return add(new THREE.CylinderGeometry(a,b,h,n||14),m,x,y,z,p);}

/* light: low warm sun through a window on the left, soft fill */
S.add(new THREE.HemisphereLight(0xfff0dc,0x6a4a30,.7));
var sun=new THREE.DirectionalLight(0xffd9a6,1.35);sun.position.set(-5,4.2,2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
var sc=sun.shadow.camera;sc.left=-5;sc.right=5;sc.top=5;sc.bottom=-5;sc.near=.5;sc.far=20;sun.shadow.bias=-.0006;sun.shadow.radius=4;S.add(sun);
var rim=new THREE.DirectionalLight(0x9db8ff,.25);rim.position.set(4,3,-3);S.add(rim);

/* the room: floor, a wall, a window glow, a chair back, a mug, books */
var floor=add(new THREE.PlaneGeometry(40,40),M(0x5b3d28),0,-1.9,0);floor.rotation.x=-Math.PI/2;floor.castShadow=false;
box(30,9,.3,M(0x6e5038),0,2,-7);
var win=add(new THREE.PlaneGeometry(4.6,3),new THREE.MeshBasicMaterial({color:0xffdf9e}),-3.6,2.2,-6.8);win.castShadow=false;
box(.14,3,.1,M(0xe9dcc2),-3.6,2.2,-6.7);box(4.6,.14,.1,M(0xe9dcc2),-3.6,2.2,-6.7);
var ch=M(0x7a4a2a);box(.18,2.6,.18,ch,3.9,-.2,-2.6);box(.18,2.6,.18,ch,5.2,-.2,-1.4);for(var i=0;i<3;i++){var s=box(1.9,.2,.1,ch,4.55,.2+i*.38,-2);s.rotation.y=-.75;}

/* table: round wooden top with plank lines */
var tc=document.createElement('canvas');tc.width=tc.height=1024;var g=tc.getContext('2d');g.fillStyle='#b9793f';g.fillRect(0,0,1024,1024);
for(var i=0;i<16;i++){g.fillStyle=['#b27238','#c08347','#a96a33','#bd7d41'][i%4];g.fillRect(0,i*64,1024,62);}
g.globalAlpha=.16;for(var i=0;i<900;i++){g.fillStyle=rnd()<.5?'#6b3d18':'#e0a968';g.fillRect(rnd()*1024,rnd()*1024,30+rnd()*130,1.5);}g.globalAlpha=1;
var tt=new THREE.CanvasTexture(tc);tt.encoding=THREE.sRGBEncoding;
var top=cyl(3.25,3.25,.16,[M(0x8a5428),new THREE.MeshStandardMaterial({map:tt,roughness:.8}),M(0x8a5428)],0,-.08,0,S,64);
cyl(3.32,3.2,.1,M(0x7c4a22),0,-.2,0,S,64);cyl(.3,.38,1.8,M(0x6b3f1e),0,-1.1,0);

/* mug and books on the table edge: real things as cover */
var mug=new THREE.Group();mug.position.set(-2.3,0,-1.2);S.add(mug);
cyl(.34,.3,.62,M(0xf1e7d2,{r:.35}),0,.31,0,mug,28);cyl(.29,.29,.02,M(0x4a2a16,{r:.2}),0,.6,0,mug,28);
var hd=add(new THREE.TorusGeometry(.17,.045,10,20,Math.PI),M(0xf1e7d2,{r:.35}),-.34,.32,0,mug);hd.rotation.z=Math.PI/2;
box(.9,.12,.62,M(0x7b2f2a),2.45,.06,1.55).rotation.y=.4;box(.82,.1,.56,M(0x2f5b4a),2.45,.17,1.55).rotation.y=.25;

/* the flag hill */
var hill=add(new THREE.SphereGeometry(.62,24,12,0,Math.PI*2,0,Math.PI/2),M(0x4f8f34,{f:true}),0,0,.1);hill.scale.y=.42;
for(var i=0;i<14;i++){var a=i/14*Math.PI*2,st=add(new THREE.DodecahedronGeometry(.085+rnd()*.03),M(0xb9b3a6,{f:true}),Math.cos(a)*.64,.05,.1+Math.sin(a)*.64);st.rotation.set(rnd()*3,rnd()*3,0);}
for(var i=0;i<9;i++){var a=rnd()*6.28,r=rnd()*.45;add(new THREE.SphereGeometry(.028,8,6),M(0xfff7e0),Math.cos(a)*r,.2+.06*(1-r),.1+Math.sin(a)*r);}
cyl(.022,.028,1.0,M(0x8a5a30),0,.72,.1);
var fl=new THREE.PlaneGeometry(.52,.3,10,4),pa=fl.attributes.position;for(var i=0;i<pa.count;i++){var x=pa.getX(i);pa.setZ(i,Math.sin(x*9)*.035*(x+.26)*3);}fl.computeVertexNormals();
var flag=add(fl,new THREE.MeshStandardMaterial({color:0x2563d6,side:THREE.DoubleSide,roughness:.9}),.27,1.05,.1);
var ring=add(new THREE.RingGeometry(1.02,1.045,64),new THREE.MeshBasicMaterial({color:0xfff3d0,transparent:true,opacity:.55}),0,.004,.1);ring.rotation.x=-Math.PI/2;ring.castShadow=false;

/* team materials */
var B={wood:M(0xc99a5e),paint:M(0x2563d6),dark:M(0x1c459c),cloth:M(0xf2e6cb,{r:.95}),hood:M(0x1f58cf)};
var Rm={wood:M(0x8f5a34),paint:M(0xc9542f,{r:.6,m:.35}),dark:M(0x8c3a22,{r:.6,m:.4}),cloth:M(0xd94a2c,{r:.9}),hood:M(0xd9472c),tin:M(0x9aa0a2,{r:.45,m:.7})};

function wall(T,x,z,ry,n){var gr=new THREE.Group();gr.position.set(x,0,z);gr.rotation.y=ry;S.add(gr);
  for(var i=0;i<n;i++){var h=.34+rnd()*.14,m=(T===B)?(i%3===1?T.paint:T.wood):(i%2?T.paint:T.dark);var p=box(.11,h,.05,m,(i-(n-1)/2)*.125,h/2,0,gr);p.rotation.z=(rnd()-.5)*.1;}
  box(n*.125+.04,.035,.07,T.wood,0,.2,.03,gr);return gr;}
function tower(T,x,z){var gr=new THREE.Group();gr.position.set(x,0,z);S.add(gr);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){var p=cyl(.03,.035,.78,T.wood,q[0]*.17,.39,q[1]*.17,gr,8);p.rotation.z=-q[0]*.07;p.rotation.x=q[1]*.07;});
  box(.46,.05,.46,T.wood,0,.78,0,gr);[[0,.23,0],[0,-.23,0],[.23,0,1],[-.23,0,1]].forEach(function(q){var r=box(.46,.12,.035,T===B?T.paint:T.dark,q[2]?q[0]:0,.87,q[2]?0:q[1],gr);if(q[2])r.rotation.y=Math.PI/2;});
  var bn=box(.26,.34,.015,T.cloth,0,.55,.2,gr);bn.rotation.x=.06;
  var lad=box(.12,.8,.02,T.wood,.26,.38,0,gr);lad.rotation.z=.2;return gr;}
function person(T,x,z,ry,o){o=o||{};var gr=new THREE.Group();gr.position.set(x,o.y||0,z);gr.rotation.y=ry||0;S.add(gr);
  cyl(.055,.07,.13,T.hood,0,.105,0,gr,10);add(new THREE.SphereGeometry(.058,12,10),M(0xf3c9a0),0,.215,0,gr);
  var hd=add(new THREE.ConeGeometry(.066,.11,10),T.hood,0,.285,-.008,gr);hd.rotation.x=-.25;
  box(.03,.045,.04,M(0x5a3a22),-.028,.022,0,gr);box(.03,.045,.04,M(0x5a3a22),.028,.022,0,gr);
  if(o.carry){var pl=box(.3,.035,.07,B.wood,0,.2,.09,gr);pl.rotation.y=.2;}
  if(o.lean)gr.rotation.x=o.lean;
  if(o.dizzy){gr.rotation.z=.5;gr.position.y=-.01;for(var i=0;i<4;i++){var a=i/4*6.28,st=add(new THREE.OctahedronGeometry(.03),M(0xffe066,{e:0xffc400,ei:.8}),x+Math.cos(a)*.13,.42,z+Math.sin(a)*.13);st.castShadow=false;}}
  return gr;}

/* BLUE camp: planks, canvas, feathers (front left) */
wall(B,-1.55,1.25,.25,7);wall(B,-.55,1.75,-.1,6);wall(B,-2.25,.55,1.05,5);
tower(B,-1.25,1.85);person(B,-1.25,1.85,2.6,{y:.805});
/* bow launcher */
(function(){var gr=new THREE.Group();gr.position.set(-.45,0,1.25);gr.rotation.y=2.75;S.add(gr);box(.3,.08,.5,B.wood,0,.12,0,gr);
  [-1,1].forEach(function(s){var w=cyl(.085,.085,.04,B.dark,s*.17,.085,.1,gr,12);w.rotation.z=Math.PI/2;});
  var bw=add(new THREE.TorusGeometry(.26,.02,8,20,Math.PI),B.wood,0,.2,-.2,gr);bw.rotation.x=Math.PI/2;
  var ar=cyl(.012,.012,.5,M(0xf2e6cb),0,.2,-.05,gr,6);ar.rotation.x=Math.PI/2;add(new THREE.ConeGeometry(.03,.07,6),B.dark,0,.2,-.32,gr).rotation.x=-Math.PI/2;})();
/* canvas tent + workshop bench */
(function(){box(.34,.03,.2,B.wood,-1.9,.14,.95);box(.03,.14,.03,B.wood,-2.04,.07,.95);box(.03,.14,.03,B.wood,-1.76,.07,.95);person(B,-1.9,.78,0);
  for(var i=0;i<3;i++)box(.3,.03,.07,B.wood,-2.45+i*.02,.02+i*.032,1.05).rotation.y=.5+i*.1;})();

/* RED camp: rusty scrap, cogs, tin (back right) */
wall(Rm,1.6,-1.15,.25,7);wall(Rm,.6,-1.65,-.12,6);wall(Rm,2.3,-.45,1.1,5);
tower(Rm,1.35,-1.9);person(Rm,1.35,-1.9,-.5,{y:.805});
(function(){/* boiler hut with a chimney and smoke */
  var h=cyl(.3,.3,.5,Rm.paint,2.05,.2,-1.55,S,14);h.rotation.z=Math.PI/2;cyl(.07,.09,.6,Rm.dark,2.05,.62,-1.6,S,10);cyl(.095,.095,.05,Rm.tin,2.05,.92,-1.6,S,10);
  for(var i=0;i<5;i++){var p=add(new THREE.SphereGeometry(.07+i*.03,10,8),new THREE.MeshStandardMaterial({color:0xf3ece0,transparent:true,opacity:.6-i*.09,roughness:1}),2.05+i*.06,1.05+i*.17,-1.6-i*.03);p.castShadow=false;}
  /* cog */
  var cg=new THREE.Group();cg.position.set(2.55,.2,-.95);cg.rotation.set(0,.5,0);S.add(cg);var c0=cyl(.16,.16,.04,Rm.tin,0,0,0,cg,16);c0.rotation.x=Math.PI/2;
  for(var i=0;i<8;i++){var a=i/8*6.28;var t=box(.05,.06,.04,Rm.tin,Math.cos(a)*.18,Math.sin(a)*.18,0,cg);t.rotation.z=a;}
  /* scrap flinger */
  var gr=new THREE.Group();gr.position.set(.55,0,-1.1);gr.rotation.y=-.4;S.add(gr);box(.34,.07,.46,Rm.wood,0,.1,0,gr);
  [-1,1].forEach(function(s){var w=cyl(.08,.08,.04,Rm.tin,s*.19,.08,.08,gr,12);w.rotation.z=Math.PI/2;box(.03,.3,.03,Rm.wood,s*.12,.28,-.05,gr);});
  var arm=box(.035,.035,.62,Rm.wood,0,.42,.12,gr);arm.rotation.x=-.75;add(new THREE.SphereGeometry(.07,10,8,0,6.28,Math.PI/2,Math.PI/2),Rm.tin,0,.64,.36,gr);})();
/* flag cloths */
[[B,-1.02,1.62,0x2563d6],[Rm,1.6,-2.1,0xd9603a]].forEach(function(q){cyl(.015,.015,.5,q[0].wood,q[1],1.15,q[2],S,6);var f=add(new THREE.PlaneGeometry(.3,.17),new THREE.MeshStandardMaterial({color:q[3],side:THREE.DoubleSide}),q[1]+.16,1.3,q[2]);f.rotation.y=.2;});

/* squads */
person(B,-.2,.35,2.9);person(B,.22,.3,-2.6);person(B,-.05,.62,3.1);person(B,-.75,.8,2.4,{lean:.25});person(B,-1.3,.85,1.2,{carry:true});
person(Rm,.5,-.42,-.3,{lean:.25});person(Rm,.95,-.75,-.5,{lean:.25});person(Rm,1.15,-.25,-.9,{dizzy:true});person(Rm,1.75,-.75,.4);person(Rm,.25,-1.1,.3);

/* a shot in the air with a dotted arc, and landing dust */
var arc=new THREE.QuadraticBezierCurve3(new THREE.Vector3(.55,.6,-1.0),new THREE.Vector3(.1,1.9,-.1),new THREE.Vector3(-.5,.25,1.2));
for(var i=1;i<16;i++){var p=arc.getPoint(i/22),d=add(new THREE.SphereGeometry(.014,6,6),new THREE.MeshBasicMaterial({color:0xfff3d0}),p.x,p.y,p.z);d.castShadow=false;}
var sp=arc.getPoint(16/22),shot=add(new THREE.DodecahedronGeometry(.06),Rm.tin,sp.x,sp.y,sp.z);
for(var i=0;i<6;i++){var a=rnd()*6.28,du=add(new THREE.SphereGeometry(.04+rnd()*.04,8,6),new THREE.MeshStandardMaterial({color:0xe8cfa6,transparent:true,opacity:.5}),-1.45+Math.cos(a)*.15,.05+rnd()*.1,1.0+Math.sin(a)*.12);du.castShadow=false;}
/* a knocked-over plank or two */
var k=box(.11,.4,.05,B.paint,-1.42,.03,.98);k.rotation.set(1.5,.4,.2);var k2=box(.11,.36,.05,B.wood,-1.22,.03,.92);k2.rotation.set(1.52,-.6,0);

R.render(S,C);
var v=new THREE.Vector3(0,1.35,.1).project(C),sy=document.getElementById('say');sy.style.left=((v.x*.5+.5)*W-70)+'px';sy.style.top=((-v.y*.5+.5)*H-44)+'px';
window.__done=true;
})();
</script></body></html>
