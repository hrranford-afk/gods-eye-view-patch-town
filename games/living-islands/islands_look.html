<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Living Islands: look test</title>
<style>
:root{--ink:#2b2118;--panel:rgba(251,246,236,.9);--line:#cdbb98;--acc:#2f6fe6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f16;color:var(--ink);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none;color-scheme:light}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.btn{min-height:44px;min-width:44px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
#top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#top .sp{flex:1;pointer-events:none}
#title{font-weight:800}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;width:min(640px,calc(100vw - 20px))}
#bar input[type=range]{flex:1;min-width:120px;height:32px}
#tideLbl{font-weight:800;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
#info{position:fixed;left:12px;bottom:70px;font-size:11px;color:#fff;opacity:.7;text-shadow:0 1px 2px #000;pointer-events:none;white-space:pre}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a1f16;color:#f1e3c8;font-weight:700;font-size:18px;transition:opacity .6s}
body.noui #top,body.noui #bar,body.noui #info{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="top">
  <div class="pill" id="title">Living Islands &middot; look test</div>
  <div class="sp"></div>
  <button class="btn" id="homeBtn">Home</button>
  <button class="btn" id="qBtn">Quality: High</button>
</div>
<div id="bar" class="pill">
  <span style="font-weight:700">Tide</span>
  <input id="tide" type="range" min="-1.1" max="1.1" step="0.01" value="0">
  <span id="tideLbl">0.00 m</span>
  <button class="btn" id="autoBtn">Animate</button>
</div>
<div id="info"></div>
<div id="boot">Raising the islands...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ============ parameters ============ */
const Q=new URLSearchParams(location.search);
const SEED=(parseInt(Q.get('seed')||'1122',10)>>>0);
const NOPOST=Q.get('post')==='0';
const LAND=Q.get('pass')==='landing';   /* the landing pass: plain daylight, no blur, one playable shoreline */
let quality=Q.get('q')==='low'?'low':'high';
const QUAL={
  high:{cell:0.55,shadow:2048,pr:1.5,taps:22,msaa:4,hiWaves:1},
  low :{cell:0.90,shadow:1024,pr:1.0,taps:9, msaa:0,hiWaves:0}
};
const TS=100;            /* the height texture covers -TS..TS metres */
const GN=512, GC=2*TS/GN;/* grid cells */
const SEABED=-4.8, TABLE_R=94, RIM_TOP=2.2;
const TIDE_RANGE=1.1;    /* metres either side of mean sea level 0 (assumption, not in the contract) */
if(Q.get('ui')==='0')document.body.classList.add('noui');

/* ============ small utilities ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(ix,iz,s){let h=Math.imul(ix|0,374761393)+Math.imul(iz|0,668265263)+Math.imul(s|0,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function fade(t){return t*t*t*(t*(t*6-15)+10);}
function vnoise(x,z,s){const ix=Math.floor(x),iz=Math.floor(z),fx=fade(x-ix),fz=fade(z-iz);
  const a=hash2(ix,iz,s),b=hash2(ix+1,iz,s),c=hash2(ix,iz+1,s),d=hash2(ix+1,iz+1,s);
  return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz;}
function fbm(x,z,s,o){let a=.5,f=1,sum=0,n=0;for(let i=0;i<o;i++){sum+=a*vnoise(x*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03;}return sum/n;}
function domes(x,z,cell,s){const cx=Math.floor(x/cell),cz=Math.floor(z/cell);let best=0;
  for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){const ix=cx+dx,iz=cz+dz;
    const px=(ix+hash2(ix,iz,s))*cell,pz=(iz+hash2(ix,iz,s+7))*cell,r=cell*(.34+.42*hash2(ix,iz,s+13));
    const d=Math.hypot(x-px,z-pz);if(d<r){const t=d/r;const v=Math.pow(1-t,.62)*(.35+.65*hash2(ix,iz,s+19));if(v>best)best=v;}}
  return best;}
const sm=t=>{t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function lin(c){return[Math.pow(c[0],2.2),Math.pow(c[1],2.2),Math.pow(c[2],2.2)];}
function mix3(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

/* ============ the world: islands, bars, pads ============ */
const ISL=[
 {id:'pine',   x:-42,z:-26,rx:15,rz:12.5,rot:.6, peak:7.4,sb:.55,bw:1.4,Rin:10,under:.34,rough:1.5,crag:1.3,lump:1.1,lcell:4.2,surf:.55,warp:4.6},
 {id:'sand',   x:39, z:-43,rx:9, rz:6.5, rot:-.3,peak:1.5,sb:.12,bw:5.0,Rin:5, under:.20,rough:.32,lump:0,  surf:.20,warp:1.6},
 {id:'grass',  x:6,  z:-50,rx:15,rz:12,  rot:.2, peak:4.3,sb:.20,bw:3.0,Rin:11,under:.26,rough:.7, lump:.25,surf:.20,warp:3.0},
 {id:'skerry', x:58, z:4,  rx:6.5,rz:5,   rot:.9, peak:3.3,sb:.80,bw:1.0,Rin:4, under:.50,rough:1.0,crag:1.8,lump:1.5,lcell:3.8,surf:1.0,warp:1.8},
 {id:'camp',   x:28, z:30, rx:13,rz:11,   rot:-.4,peak:3.4,sb:.16,bw:5.0,Rin:7, under:.24,rough:.5, lump:.20,surf:.25,warp:3.0},
 {id:'harbour',x:-30,z:40, cres:1,Ra:24,Rb:12.5,peak:8.6,sb:.22,bw:5.0,Rin:11,under:.28,rough:.6,lump:.35,surf:.25,warp:2.8}
];
ISL.forEach((I,i)=>{I.i=i;I.s=(SEED*7+i*101)|0;I.c=Math.cos(I.rot||0);I.sn=Math.sin(I.rot||0);
  if(I.cres){const dir=[.55,.835];I.dir=dir;I.bx=I.x+dir[0]*14.5;I.bz=I.z+dir[1]*14.5;I.rm=I.Ra;I.mR=I.Ra;}
  else{I.rm=Math.min(I.rx,I.rz);I.mR=Math.max(I.rx,I.rz);}
  I.br=I.mR*1.1+I.warp*1.6+Math.min(60,4.8/I.under)+3;});
const BARS=[
 {ax:19,az:-48.5,bx:33,bz:-44,w:3.4,peak:-.5,s:SEED+501},
 {ax:36,az:24,bx:53,bz:7,w:2.6,peak:-.62,s:SEED+517}
];
const PADS=[]; /* {x,z,r,y} */
let gI=-1,gSd=-99,gExpo=0;
function islSd(I,x,z){let sd;
  if(I.cres){const a=I.Ra-Math.hypot(x-I.x,z-I.z),b=Math.hypot(x-I.bx,z-I.bz)-I.Rb,k=2.6;sd=-k*Math.log(Math.exp(-a/k)+Math.exp(-b/k));}
  else{const dx=x-I.x,dz=z-I.z,lx=dx*I.c+dz*I.sn,lz=-dx*I.sn+dz*I.c;sd=(1-Math.hypot(lx/I.rx,lz/I.rz))*I.rm;}
  return sd+(fbm(x*.055,z*.055,I.s,3)-.5)*2*I.warp+(fbm(x*.21,z*.21,I.s+5,2)-.5)*I.warp*.45;}
function islH(I,x,z,sd){let h;
  if(sd<=0)h=-Math.min(4.8,-sd*I.under*1.7);
  else{const a=I.sb*Math.min(sd,I.bw);let t=(sd-I.bw)/I.Rin;t=t<0?0:t>1?1:t;const e=t*t*(3-2*t);
    h=a+(I.peak-I.sb*I.bw)*Math.pow(e,.9);h+=(fbm(x*.11,z*.11,I.s+2,3)-.5)*2*I.rough*sm(sd/3.5);}
  if(I.crag){const q=1-Math.abs(2*fbm(x*.27,z*.27,I.s+31,3)-1);h+=I.crag*q*q*sm((sd+3)/5)*(1.2-.4*sm((sd-4)/6));}
  if(I.lump>0)h+=I.lump*domes(x,z,I.lcell||3.3,I.s+9)*sm((sd+4)/4.5)*(1-.75*sm((sd-2.5)/7));
  return h;}
function baseH(x,z){let best=SEABED,bi=-1,bsd=-1e9,ex=0;
  for(let k=0;k<ISL.length;k++){const I=ISL[k];const dd=Math.hypot(x-I.x,z-I.z);if(dd>I.br+(I.cres?20:0))continue;
    const sd=islSd(I,x,z);if(sd>bsd){bsd=sd;bi=k;}
    const h=islH(I,x,z,sd);if(h>best)best=h;
    const e=I.surf*Math.exp(-Math.abs(Math.min(sd,0))/9);if(e>ex)ex=e;}
  for(let k=0;k<BARS.length;k++){const B=BARS[k];const vx=B.bx-B.ax,vz=B.bz-B.az,L2=vx*vx+vz*vz;
    let t=((x-B.ax)*vx+(z-B.az)*vz)/L2;t=clamp(t,0,1);const d=Math.hypot(x-(B.ax+vx*t),z-(B.az+vz*t));
    if(d<B.w*2.4){const g=Math.exp(-(d*d)/(B.w*B.w));const pk=B.peak+(fbm(x*.18,z*.18,B.s,2)-.5)*.9;const hb=SEABED+(pk-SEABED)*g;if(hb>best)best=hb;}}
  gI=bi;gSd=bsd;gExpo=ex;return best;}
function H(x,z){let h=baseH(x,z);
  for(let k=0;k<PADS.length;k++){const p=PADS[k];const d=Math.hypot(x-p.x,z-p.z);if(d<p.r+2){const t=sm((p.r+2-d)/2);h=h*(1-t)+p.y*t;}}
  return h;}
function padDist(x,z){let m=99;for(const p of PADS){const d=Math.hypot(x-p.x,z-p.z)-p.r;if(d<m)m=d;}return m;}
function slopeAt(x,z){const e=.5;const dx=(H(x+e,z)-H(x-e,z))/(2*e),dz=(H(x,z+e)-H(x,z-e))/(2*e);return Math.hypot(dx,dz);}

/* ============ world content (pads, rocks, trees, houses...) ============ */
const W={tufts:[],rocks:[],conifers:[],broad:[],shrubs:[],houses:[],tents:[],jetty:null,camp:null,boats:[],people:[],logs:[],crates:[]};
function placeWorld(){
  const R=mulberry32(SEED*131+7);
  /* --- camp --- */
  {const I=ISL[4];const dir=[.12,.993];let rs=0;for(let r=0;r<30;r+=.25){if(H(I.x+dir[0]*r,I.z+dir[1]*r)<0.05){rs=r;break;}}
    let rf=rs;for(let r=rs;r>0;r-=.25){if(H(I.x+dir[0]*r,I.z+dir[1]*r)>=1.15){rf=r;break;}}
    const fx=I.x+dir[0]*rf,fz=I.z+dir[1]*rf,fy=H(fx,fz);const rt=[dir[1],-dir[0]];
    const fire={x:fx,z:fz,y:fy};
    PADS.push({x:fx,z:fz,r:2.6,y:fy});
    const t1={x:fx-dir[0]*3.6-rt[0]*4.4,z:fz-dir[1]*3.6-rt[1]*4.4},t2={x:fx-dir[0]*4.6+rt[0]*3.9,z:fz-dir[1]*4.6+rt[1]*3.9};
    t1.y=H(t1.x,t1.z);t2.y=H(t2.x,t2.z);t1.yaw=Math.atan2(dir[0],dir[1])+.35;t2.yaw=Math.atan2(dir[0],dir[1])-.4;
    PADS.push({x:t1.x,z:t1.z,r:2.4,y:t1.y},{x:t2.x,z:t2.z,r:2.4,y:t2.y});
    W.tents=[{...t1,col:[.93,.52,.16],col2:[.98,.82,.55]},{...t2,col:[.22,.45,.60],col2:[.80,.84,.86]}];
    W.camp={fire,dir,rt,shoreR:rs,I};
  }
  /* --- harbour --- */
  {const I=ISL[5];const bay=[I.bx,I.bz];const cand=[];
    for(let a=0;a<360;a+=9){const ar=a*Math.PI/180;const ux=Math.cos(ar),uz=Math.sin(ar);
      const od=Math.atan2(I.dir[1],I.dir[0]);let da=Math.abs(((ar-od+Math.PI*3)%(Math.PI*2))-Math.PI);if(da<1.15)continue; /* skip the mouth of the bay */
      for(const row of [0,1,2]){let found=-1;for(let r=I.Rb-1;r<I.Rb+22;r+=.4){const hh=H(bay[0]+ux*r,bay[1]+uz*r);if(hh>=(row===2?4.3:row?3.0:1.5)){found=r;break;}}
        if(found<0)continue;const x=bay[0]+ux*found,z=bay[1]+uz*found;const h=H(x,z);if(h>6.2)continue;if(slopeAt(x,z)>.9)continue;
        if(Math.hypot(x-I.x,z-I.z)>I.Ra+1)continue;cand.push({x,z,h,a,row});}}
    const chosen=[];const jettyA=Math.atan2(-I.dir[1],-I.dir[0])*180/Math.PI;
    cand.sort((p,q)=>p.row-q.row||p.a-q.a);
    for(const c of cand){if(chosen.length>=14)break;let ok=true;for(const o of chosen){if(Math.hypot(o.x-c.x,o.z-c.z)<4.7){ok=false;break;}}
      const ja=((c.a-jettyA+540)%360)-180;if(c.row===0&&Math.abs(ja)<12)ok=false; /* leave the jetty root free */
      if(ok&&R()<.97)chosen.push(c);}
    for(const c of chosen){const yaw=Math.atan2(bay[0]-c.x,bay[1]-c.z)+(R()-.5)*.25;const y=H(c.x,c.z);PADS.push({x:c.x,z:c.z,r:2.7,y});
      W.houses.push({x:c.x,z:c.z,y,yaw,w:3.1+R()*1.1,d:2.6+R()*.7,wh:2.2+R()*.5,roof:R()<.5?0:R()<.6?1:2,chim:R()<.65,id:W.houses.length});}
    /* jetty */
    {const ar=jettyA*Math.PI/180,ux=Math.cos(ar),uz=Math.sin(ar);let r0=I.Rb;for(let r=I.Rb+4;r>I.Rb-6;r-=.25){if(H(bay[0]+ux*r,bay[1]+uz*r)<1.0){r0=r;break;}}
      const sx=bay[0]+ux*(r0+1.2),sz=bay[1]+uz*(r0+1.2);const len=12.5;
      PADS.push({x:sx,z:sz,r:1.8,y:1.45});
      W.jetty={x:sx,z:sz,dx:-ux,dz:-uz,len,deck:1.55,w:1.7};
      const px=-uz,pz=ux;const tipx=sx-ux*len,tipz=sz-uz*len;
      W.boats.push({kind:'moored',x:tipx+px*2.0-ux*2.2,z:tipz+pz*2.0-uz*2.2,yaw:Math.atan2(-ux,-uz)+Math.PI/2+.07,L:4.4,Wd:1.7,Hh:.62,hull:[.93,.94,.92],stripe:[.18,.32,.55],ph:0});
      W.boats.push({kind:'moored',x:tipx-px*2.2-ux*5.5,z:tipz-pz*2.2-uz*5.5,yaw:Math.atan2(-ux,-uz)+Math.PI/2-.12,L:3.7,Wd:1.5,Hh:.58,hull:[.72,.22,.18],stripe:[.95,.9,.8],ph:2.1,sail:{cx:I.bx+I.dir[0]*4.5,cz:I.bz+I.dir[1]*4.5,r:4.6}});
    }
  }
  /* --- rocks --- */
  const rockPal=[[.47,.43,.39],[.36,.34,.33],[.57,.50,.41],[.42,.40,.40],[.50,.46,.42]];
  function addRocks(I,n,sdLo,sdHi,rmin,rmax,spec){let tries=0,got=0;
    while(got<n&&tries<n*40){tries++;const x=I.x+(R()*2-1)*I.br*.8,z=I.z+(R()*2-1)*I.br*.8;
      const h=H(x,z);const sd=gSd;if(gI!==I.i||sd<sdLo||sd>sdHi)continue;if(padDist(x,z)<2.2)continue;
      let sx=lerp(rmin,rmax,Math.pow(R(),1.7));const sz=sx*(.7+R()*.5),sy=sx*(.5+R()*.4);
      let y=h+sy*.15;
      if(spec&&spec.tidal){ /* tidal rocks: top between -0.95 and +1.0 above sea level */
        const top=-.95+R()*1.95;y=top-sy*.9;}
      W.rocks.push({x,z,y,sx,sy,sz,ry:R()*6.28,seed:(R()*1e6)|0,pal:rockPal[(R()*rockPal.length)|0],lich:spec&&spec.lich!=null?spec.lich:.5});got++;
      /* little satellites */
      if(sx>1.2&&R()<.6){const k=2+((R()*3)|0);for(let q=0;q<k;q++){const a=R()*6.28,d=sx*(.8+R()*.9),s2=sx*(.3+R()*.35);const x2=x+Math.cos(a)*d,z2=z+Math.sin(a)*d;
        W.rocks.push({x:x2,z:z2,y:H(x2,z2)+s2*.1+(spec&&spec.tidal?(y-h):0),sx:s2,sy:s2*(.5+R()*.4),sz:s2*(.7+R()*.5),ry:R()*6.28,seed:(R()*1e6)|0,pal:rockPal[(R()*rockPal.length)|0],lich:.4});}}}
  }
  addRocks(ISL[0],18,-3.5,2.5,.8,2.6);addRocks(ISL[0],9,3,14,1,2.6,{lich:.8});
  addRocks(ISL[3],22,-7,1.5,.9,2.4,{tidal:true,lich:.2});addRocks(ISL[3],10,1,5,1,2.6);
  addRocks(ISL[1],6,-1,3,.5,1.3);addRocks(ISL[2],10,-2,2,.7,1.9);addRocks(ISL[4],12,-3,2,.6,1.8);addRocks(ISL[5],34,-4,1.5,.6,2.2);
  for(const I of ISL){if(I.id==='skerry')continue;let np=0,tr=0;while(np<5&&tr<400){tr++;const x=I.x+(R()*2-1)*I.br*.7,z=I.z+(R()*2-1)*I.br*.7;const h=H(x,z);if(gI!==I.i||gSd<.2||gSd>2||h<.05||h>.9||padDist(x,z)<2)continue;
      for(let q=0;q<4;q++){const a=R()*6.28,d=R()*1.1,sz=.1+R()*.16;const x2=x+Math.cos(a)*d,z2=z+Math.sin(a)*d;W.rocks.push({x:x2,z:z2,y:H(x2,z2)+sz*.1,sx:sz,sy:sz*.6,sz:sz*.8,ry:R()*6,seed:(R()*1e6)|0,pal:rockPal[(R()*5)|0],lich:0});}np++;}
    let nl=0;tr=0;while(nl<(I.id==='sand'?0:2)&&tr<400){tr++;const x=I.x+(R()*2-1)*I.br*.7,z=I.z+(R()*2-1)*I.br*.7;const h=H(x,z);if(gI!==I.i||gSd<.1||gSd>1.8||h<.05||h>.8||padDist(x,z)<2)continue;W.logs.push({x,z,y:h+.1,len:1.6+R()*2,yaw:R()*3.14,r:.12});nl++;}}
  /* a ring of fire stones */
  if(W.camp){const f=W.camp.fire;for(let k=0;k<8;k++){const a=k/8*6.283;W.rocks.push({x:f.x+Math.cos(a)*.75,z:f.z+Math.sin(a)*.75,y:f.y+.02,sx:.23,sy:.17,sz:.2,ry:a,seed:k*13,pal:rockPal[k%5],lich:0,keep:1});}}
  /* --- trees --- */
  function scatter(I,n,cond,minD,out,hmin){const placed=[];let tries=0;
    while(placed.length<n&&tries<n*60){tries++;const x=I.x+(R()*2-1)*I.br*.75,z=I.z+(R()*2-1)*I.br*.75;
      const h=H(x,z);if(gI!==I.i)continue;const sd=gSd;if(h<hmin)continue;if(padDist(x,z)<2.4)continue;if(!cond(x,z,h,sd))continue;
      let ok=true;for(const p of placed){if(Math.hypot(p.x-x,p.z-z)<minD){ok=false;break;}}if(!ok)continue;
      for(const r of W.rocks){if(Math.hypot(r.x-x,r.z-z)<r.sx*.9+.4){ok=false;break;}}if(!ok)continue;
      placed.push({x,z,y:h,s:R()});}
    placed.forEach(p=>out.push(p));return placed;}
  const forest=(I,thr)=>(x,z,h,sd)=>sd>2.5&&slopeAt(x,z)<1.05&&fbm(x*.07,z*.07,I.s+3,3)>thr;
  scatter(ISL[0],82,forest(ISL[0],.40),2.7,W.conifers,1.2);
  scatter(ISL[2],9,(x,z,h,sd)=>sd>4&&fbm(x*.09,z*.09,ISL[2].s+3,2)>.35,5.2,W.broad,.9);

/* pose: angles in radians; fwd positive = forward (character faces +z); out positive = away from body */

  R.spine.rotation.set(-(p.lean||0),p.twist||0,p.sway||0);
  R.head.rotation.set(-(p.headX||0),p.headY||0,0);
  const L=p.ll||[0,0],Rr=p.rl||[0,0];
  [[0,L],[1,Rr]].forEach(([i,v])=>{R.hipL[i].rotation.set(-v[0],0,(i===0?-1:1)*(v[2]||0));R.knee[i].rotation.set(v[1],0,0);});

/* ============ post ============ */
function buildPost(){

  postMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,defines:{TAPS:QUAL[quality].taps},uniforms:{tD:{value:null},uRes:{value:new THREE.Vector2(1,1)},uFocus:{value:.45},uBand:{value:.16},uBlur:{value:6},uExp:{value:LAND?.88:1.0},uTilt:{value:LAND?0:1},uVig:{value:LAND?.14:.42}},

  fragmentShader:`precision highp float;varying vec2 vUv;uniform sampler2D tD;uniform vec2 uRes;uniform float uFocus,uBand,uBlur,uExp,uTilt,uVig;
  vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}
  float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}

      vec3 s=texture2D(tD,uv+o).rgb;float w=1.0+dot(s,vec3(0.3))*0.6;c+=s*w;ws+=w;}c/=ws;
      /* wider smear near the very edge */}
    float lum=dot(c,vec3(0.3,0.59,0.11));

    c=aces(c*0.9);
    c=pow(c,vec3(1.0/2.2));
    float l2=dot(c,vec3(0.3,0.59,0.11));c=mix(vec3(l2),c,1.16);
    c*=mix(vec3(0.96,0.99,1.04),vec3(1.05,1.0,0.93),smoothstep(0.1,0.8,l2));
    vec2 q=(uv-0.5)*vec2(uRes.x/uRes.y,1.0);float v=1.0-uVig*smoothstep(0.42,1.05,length(q));c*=v;

function makeRT(w,h){if(rt){rt.dispose();rt=null;}

    rt=(gl2&&ms&&THREE.WebGLMultisampleRenderTarget)?new THREE.WebGLMultisampleRenderTarget(w,h,base):new THREE.WebGLRenderTarget(w,h,base);

/* ============ camera control ============ */
const HOME=LAND?{theta:.52,phi:.58,dist:124,tx:18,tz:12}:{theta:.42,phi:.93,dist:290,tx:0,tz:2};
const cam={...HOME},cur={...HOME};
let snap=true;
function applyCam(dt){const k=snap?1:1-Math.pow(.0005,dt);for(const key of['theta','phi','dist','tx','tz'])cur[key]+=(cam[key]-cur[key])*k;snap=false;
  const cp=Math.cos(cur.phi),sp=Math.sin(cur.phi);
  camera.position.set(cur.tx+Math.sin(cur.theta)*cp*cur.dist,sp*cur.dist,cur.tz+Math.cos(cur.theta)*cp*cur.dist);camera.lookAt(cur.tx,0,cur.tz);}
function clampCam(){cam.phi=clamp(cam.phi,.2,1.5);cam.dist=clamp(cam.dist,9,420);const r=Math.hypot(cam.tx,cam.tz);if(r>82){cam.tx*=82/r;cam.tz*=82/r;}}
function setupControls(el){const ptr=new Map();let last=null;

  el.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(ptr.size===1){if(p.b===2||p.s||e.shiftKey){pan(dx,dy);}else{cam.theta-=dx*.0055;cam.phi+=dy*.0045;}}
    else if(ptr.size===2){const o=[...ptr.entries()].find(([id])=>id!==e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y);
      p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(p.x-o.x,p.y-o.y);if(d0>5&&d1>5)cam.dist*=d0/d1;pan(dx*.5,dy*.5);clampCam();return;}
    p.x=e.clientX;p.y=e.clientY;clampCam();});

  el.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=Math.exp(e.deltaY*.0012);clampCam();},{passive:false});

function pan(dx,dy){const s=cam.dist*.0016;const c=Math.cos(cam.theta),sn=Math.sin(cam.theta);

/* ============ main ============ */
let tideManual=0,tideAuto=false,tideT=0,tide=0;
function landArea(t){let n=0;const cx=GN/2;for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){const x=-TS+(i+.5)*GC,z=-TS+(j+.5)*GC;if(x*x+z*z>TABLE_R*TABLE_R)continue;if(hgrid[j*GN+i]>t)n++;}return n*GC*GC;}

  W.boats.forEach(b=>{if(skipSail&&b.sail)return;mix(q(b.x));mix(q(b.z));});if(W.camp){mix(q(W.camp.fire.x));mix(q(W.camp.fire.z));}
  if(LD.on){mix(LD.pebbles.length);LD.pebbles.forEach(p=>{mix(q(p.x));mix(q(p.z));});mix(q(LD.boat.x));mix(q(LD.boat.z));mix(q(LD.tent.x));mix(q(LD.tent.z));}
  return('00000000'+h.toString(16)).slice(-8);}
function sceneTris(){let t=0;scene.traverse(o=>{if(o.isMesh&&o.visible&&o!==floorMesh){const g=o.geometry;t+=(g.index?g.index.count/3:g.attributes.position.count/3)*(o.isInstancedMesh?o.count:1);}if(o.isPoints)t+=0;});return Math.round(t);}

let stopLoop=false;
function build(){const t0=performance.now();
  if(scene){scene.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
  scene=new THREE.Scene();
  if(!U.uGrain.value)U.uGrain.value=makeGrain();
  ISL.forEach(I=>{});
  if(!hgrid){PADS.length=0;for(const k in W)Array.isArray(W[k])?W[k].length=0:(W[k]=null);W.rocks=[];placeWorld();if(LAND)placeLanding();buildGrid();}
  scene.add(sun=new THREE.DirectionalLight(0xffffff,1));scene.add(sun.target);
  if(LAND){sun.color.setRGB(1.0,.95,.86);sun.intensity=2.0;}else{sun.color.setRGB(1.0,.64,.34);sun.intensity=2.9;}
  hemi=new THREE.HemisphereLight(0x000000,0x000000,1);if(LAND){hemi.color.setRGB(.36,.46,.62);hemi.groundColor.setRGB(.26,.23,.18);hemi.intensity=.85;}else{hemi.color.setRGB(.24,.32,.50);hemi.groundColor.setRGB(.22,.15,.09);hemi.intensity=1.1;}scene.add(hemi);
  sun.castShadow=true;sun.shadow.mapSize.set(QUAL[quality].shadow,QUAL[quality].shadow);sun.shadow.bias=-.0004;sun.shadow.normalBias=.25;sun.shadow.camera.near=1;sun.shadow.camera.far=520;
  buildTable();
  const tg=buildTerrain(QUAL[quality].cell);terrainMesh=new THREE.Mesh(tg,landMat('terrain',true));terrainMesh.castShadow=true;terrainMesh.receiveShadow=true;scene.add(terrainMesh);
  const pg=buildProps();const pm=landMat('props',true);pm.side=THREE.DoubleSide;propsMesh=new THREE.Mesh(pg,pm);propsMesh.castShadow=true;propsMesh.receiveShadow=true;scene.add(propsMesh);
  buildBoats();if(LAND)buildSettlers();else buildPeople();buildPebbles();buildFire();buildSea();buildGulls();
  stats.tris=sceneTris();stats.build=Math.round(performance.now()-t0);}
function size(){const dpr=Math.min(window.devicePixelRatio||1,QUAL[quality].pr);const w=Math.max(2,Math.floor(innerWidth*dpr)),h=Math.max(2,Math.floor(innerHeight*dpr));
  renderer.setPixelRatio(1);renderer.setSize(w,h,false);const cv=renderer.domElement;cv.style.width='100%';cv.style.height='100%';
  camera.aspect=w/h;camera.updateProjectionMatrix();if(!NOPOST)makeRT(w,h);
  if(smoke)smoke.material.uniforms.uScale.value=h/(2*Math.tan(camera.fov*Math.PI/360));}
const clock={t:0,last:0,frames:0,fps:60,acc:0};
function frame(now){if(stopLoop)return;requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-clock.last)/1000||.016);clock.last=now;clock.t+=dt;clock.acc+=dt;clock.frames++;
  if(clock.acc>.5){clock.fps=clock.frames/clock.acc;clock.frames=0;clock.acc=0;updateInfo();autoQ();}
  if(tideAuto){tideT+=dt;tide=TIDE_RANGE*.92*Math.sin(tideT*2*Math.PI/55);el.tide.value=tide;}else tide=tideManual;
  U.uTide.value=tide;U.uTime.value=clock.t;waterMesh.position.y=tide;
  el.tideLbl.textContent=(tide>=0?'+':'')+tide.toFixed(2)+' m';
  applyCam(dt);animate(dt);
  /* sun / shadow follow */
  const s=clamp(cur.dist*.62,30,112);const tgt=new THREE.Vector3(cur.tx,0,cur.tz);sun.target.position.copy(tgt);sun.position.copy(tgt).addScaledVector(sunDir,230);sun.target.updateMatrixWorld();
  const sc=sun.shadow.camera;sc.left=-s;sc.right=s;sc.top=s;sc.bottom=-s;sc.updateProjectionMatrix();

  const pv=tgt.clone().project(camera);postMat.uniforms.uFocus.value=clamp(pv.y*.5+.5,.2,.8)+.02;
  const hpx=renderer.domElement.height;postMat.uniforms.uBlur.value=hpx*.0085*(quality==='high'?1:.8);postMat.uniforms.uBand.value=.13;
  if(NOPOST){renderer.render(scene,camera);}else{renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);}

function animate(dt){const t=clock.t;

  boatObjs.forEach(o=>{const b=o.b,m=o.mesh;let y,roll=0,pitch=0;
    if(b.sail){const a=t*.2,S=b.sail;const nx=S.cx+Math.cos(a)*S.r,nz=S.cz+Math.sin(a)*S.r;const vx=-Math.sin(a),vz=Math.cos(a);b.x=nx;b.z=nz;b.yaw=Math.atan2(-vz,vx);y=tide-.18+Math.sin(t*1.7)*.03;roll=Math.sin(t*1.1)*.04;pitch=.02;
      wakeT+=dt;if(wakeT>.2){wakeT=0;const W2=WAKE[wakeI];W2.set(nx-vx*b.L*.45,nz-vz*b.L*.45,0,0);wakeI=(wakeI+1)%24;}}
    else if(b.kind==='moored'){y=tide-.18+Math.sin(t*1.1+b.ph)*.05;roll=Math.sin(t*.9+b.ph)*.03;pitch=Math.sin(t*.7+b.ph*2)*.02;}
    else{const gy=H(b.x,b.z)+(b.lift!==undefined?b.lift:.1);y=Math.max(gy,tide-.12+Math.sin(t*1.1)*.03);roll=(b.tilt||0)+(y>gy+.02?Math.sin(t)*.03:0);pitch=b.heel||0;}
    m.position.set(b.x,y,b.z);m.rotation.set(0,b.yaw,0);m.rotateZ(roll);m.rotateX(pitch);});
  people.forEach(p=>{const ph=t*1.3+p.i*2;p.g.position.y=p.y0+(p.pose==='stand'?Math.abs(Math.sin(ph))*.015:0);
    if(p.pose==='sit'){p.arms[0].rotation.x=-.9+Math.sin(ph)*.12;p.arms[1].rotation.x=-1.1+Math.sin(ph+1)*.1;}
    else if(p.face==='sea'){p.arms[0].rotation.z=-.6+Math.sin(ph)*.9*.5-.9;p.arms[0].rotation.x=0;p.arms[1].rotation.x=Math.sin(ph)*.1;}
    else{p.arms[0].rotation.x=-.5+Math.sin(ph)*.25;p.arms[1].rotation.x=.1+Math.sin(ph+1)*.1;}});
  gulls.forEach(g=>{const a=g.ph+t*g.sp;const x=g.cx+Math.cos(a)*g.r,z=g.cz+Math.sin(a)*g.r;g.m.position.set(x,g.h+Math.sin(t*.7+g.ph)*1.2,z);g.m.rotation.y=Math.atan2(-Math.cos(a)*Math.sign(g.sp),-Math.sin(a)*Math.sign(g.sp))+1.57;g.m.scale.set(1,1,1).multiplyScalar(1.1);g.m.children.length;g.m.geometry.attributes.position;g.m.rotation.z=Math.sin(t*9+g.ph)*.35;});
  flames.forEach(f=>{const k=f.userData.k;const fl=.8+.35*Math.sin(t*9+k*2)*Math.sin(t*5.3+k);f.scale.set(1,fl,1);f.rotation.y=t*2+k;f.position.y=W.camp.fire.y+.3+.16*fl;});
  if(glow){glow.material.opacity=(.62+.16*Math.sin(t*7)*Math.sin(t*3.1))*(LAND?.4:1);}
  if(smoke){const u=smoke.userData,N=u.N,pa=smoke.geometry.attributes.position.array,aa=smoke.geometry.attributes.aS.array,f=W.camp.fire;
    for(let i=0;i<N;i++){u.ph[i]=(u.ph[i]+dt*.085)%1;const a=u.ph[i],rr=u.rr[i];
      pa[i*3]=f.x+.9*a*7+Math.sin(a*5+rr*9)*.5*a*3+(rr-.5)*.5;pa[i*3+1]=f.y+1+a*9.5;pa[i*3+2]=f.z+.3*a*7*(rr-.4)+Math.cos(a*4+rr*7)*.5*a*3;
      aa[i*3]=.55+a*2.6;aa[i*3+1]=Math.sin(Math.PI*Math.pow(a,.7))*(LAND?.24:.22)*(1-a*.3);aa[i*3+2]=rr;}
    smoke.geometry.attributes.position.needsUpdate=true;smoke.geometry.attributes.aS.needsUpdate=true;}}
const el={};
function updateInfo(){el.info.textContent=`${clock.fps.toFixed(0)} fps  ${stats.tris.toLocaleString()} tris  ${quality}  seed ${SEED}  ${stateHash()}`;}
let autoQDone=false;
function autoQ(){if(autoQDone||Q.get('q')||navigator.webdriver||clock.t<3)return;if(clock.t>10){autoQDone=true;return;}if(clock.fps<18&&quality==='high'){autoQDone=true;setQuality('low');}}

  window.__li={ready:true,seed:SEED,hash:stateHash,hashStatic:()=>stateHash(true),landArea,stats:()=>({...stats,tris:sceneTris(),fps:clock.fps,quality,renderTris:renderer.info.render.triangles,calls:renderer.info.render.calls}),

    setView:(o)=>{Object.assign(cam,o);clampCam();snap=true;},home:()=>{Object.assign(cam,HOME);snap=true;},
    ui:on=>document.body.classList.toggle('noui',!on),islands:ISL.map(I=>({id:I.id,x:I.x,z:I.z})),camp:()=>W.camp&&W.camp.fire,houses:()=>W.houses.length,
    counts:()=>({rocks:W.rocks.length,conifers:W.conifers.length,broad:W.broad.length,shrubs:W.shrubs.length,houses:W.houses.length}),H:(x,z)=>H(x,z),pass:LAND?'landing':'default',landing:()=>LD.on?{x:LD.L.x,z:LD.L.z,boat:{x:LD.boat.x,z:LD.boat.z},tent:{x:LD.tent.x,z:LD.tent.z}}:null,
    zoomLanding:()=>{if(!LD.on)return;const k=.62;Object.assign(cam,{tx:LD.L.x*k+LD.tent.x*(1-k)-LD.L.t[0]*.4,tz:LD.L.z*k+LD.tent.z*(1-k)-LD.L.t[1]*.4,dist:21,phi:.55,theta:.52});clampCam();snap=true;}};
}
setTimeout(init,40);
})();
