<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Living Islands: people options</title>
<style>
:root{--ink:#2b2118;--panel:rgba(251,246,236,.9);--line:#cdbb98;--acc:#2f6fe6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f16;color:var(--ink);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none;color-scheme:light}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.btn{min-height:44px;min-width:44px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:min(760px,calc(100vw - 16px))}
#banner{position:fixed;left:14px;top:12px;font-weight:800;font-size:20px;color:#fff6e2;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;white-space:pre-line}
#banner small{display:block;font-size:13px;font-weight:600;opacity:.9}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,0);font-size:11px;font-weight:700;color:#fff6e2;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.lr{position:absolute;transform:translate(-100%,-50%);font-size:15px;font-weight:800;color:#fff6e2;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
body.noui #bar{display:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a1f16;color:#f1e3c8;font-weight:700;font-size:18px;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="banner"></div>
<div id="bar" class="pill"></div>
<div id="boot">Gathering the settlers...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* People options for Living Islands. Procedural only: every figure is an anonymous archetype
   (a role label, not a person). Lighting copied from islands_look.html (sun 24 deg, warm; cool hemisphere). */
const Q=new URLSearchParams(location.search);
const SEED=(parseInt(Q.get('seed')||'1122',10)>>>0);
const FROZEN=Q.get('t')!==null;            /* deterministic: animation time fixed by ?t= or __ppl.setTime */
let TIME=FROZEN?parseFloat(Q.get('t')):0;
if(Q.get('ui')==='0')document.body.classList.add('noui');
const TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(ix,iz,s){let h=Math.imul(ix|0,374761393)+Math.imul(iz|0,668265263)+Math.imul(s|0,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function fade(t){return t*t*t*(t*(t*6-15)+10);}
function vnoise(x,z,s){const ix=Math.floor(x),iz=Math.floor(z),fx=fade(x-ix),fz=fade(z-iz);
  const a=hash2(ix,iz,s),b=hash2(ix+1,iz,s),c=hash2(ix,iz+1,s),d=hash2(ix+1,iz+1,s);return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz;}
function fbm(x,z,s,o){let a=.5,f=1,sum=0,n=0;for(let i=0;i<o;i++){sum+=a*vnoise(x*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03;}return sum/n;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const lin=c=>[Math.pow(c[0],2.2),Math.pow(c[1],2.2),Math.pow(c[2],2.2)];
const dark=(c,k)=>c.map(v=>v*k);

/* ================= palette: weathered Atlantic working clothes, muted earth ================= */
const PAL={
  skinW:[.90,.70,.57], skinM:[.76,.54,.42], skinF:[.86,.62,.48], skinS:[.80,.58,.45],
  hairW:[.40,.23,.14], hairM:[.17,.12,.09], beardF:[.62,.42,.26], beardS:[.74,.73,.70],
  oat:[.76,.68,.52], slate:[.30,.36,.42], linen:[.82,.76,.62], rust:[.53,.32,.24],
  gansey:[.27,.33,.40], moss:[.38,.35,.24], wool:[.55,.43,.24], boot:[.21,.15,.11],
  oilskin:[.52,.46,.25], wader:[.24,.29,.27], sou:[.64,.54,.26], manila:[.72,.62,.42],
  coat:[.21,.27,.32], cap:[.25,.24,.23], brass:[.72,.56,.26], zinc:[.55,.60,.60], wood:[.55,.40,.24], water:[.36,.50,.56]
};
/* the cast: role labels only */
const CAST=[
  {key:'woman', label:'Woman with water bucket', skin:PAL.skinW, hair:PAL.hairW, top:PAL.oat, legs:PAL.slate, skirt:true, apron:true, shawl:true, hat:'bun', tool:'bucket', beard:null},
  {key:'man',   label:'Man with mallet',         skin:PAL.skinM, hair:PAL.hairM, top:PAL.gansey, legs:PAL.moss, hat:'wool', tool:'mallet', beard:PAL.hairM, rolled:true},
  {key:'skip',  label:'Skipper, flat cap, long coat', skin:PAL.skinS, hair:PAL.beardS, top:PAL.coat, legs:PAL.coat, coat:true, scarf:true, hat:'flat', tool:'glass', beard:PAL.beardS},
  {key:'fish',  label:'Fisher with rope',        skin:PAL.skinF, hair:PAL.beardF, top:PAL.oilskin, legs:PAL.wader, smock:true, hat:'sou', tool:'rope', beard:PAL.beardF, rolled:true}
];
const STYLES=[
  {n:1,name:'CURRENT blocky (reference)'},
  {n:2,name:'STYLISED LOW-POLY, human proportions'},
  {n:3,name:'SMOOTH VINYL-TOY'},
  {n:4,name:'AGE-OF-EMPIRES painted sprites'},
  {n:5,name:'SILHOUETTE-RICH tiny figures'},
  {n:6,name:'BEST MIX, animated (idle / walk / work)'}
];
/* ================= renderer, scene, light ================= */
let renderer,scene,camera,sun,hemi,stage,ground,dirty=true,frames=0;
const SUNAZ=-132,SUNEL=24;
const sunDir=new THREE.Vector3(Math.sin(SUNAZ*Math.PI/180)*Math.cos(SUNEL*Math.PI/180),Math.sin(SUNEL*Math.PI/180),Math.cos(SUNAZ*Math.PI/180)*Math.cos(SUNEL*Math.PI/180)).normalize();
const STAGE_AZ=-70*Math.PI/180;      /* the stage is turned so the sun comes from the viewer's left-front */
const ROWZ=n=>(n-3.5)*3.6;
const XS=[-3.3,-1.1,1.1,3.3];        /* cast order along a row: man, woman, skipper, fisher (woman+skipper in the middle) */
const ORDER=['man','woman','skip','fish'];

/* ================= geometry helpers ================= */
const MAT=new THREE.MeshLambertMaterial({vertexColors:true});
const MATDS=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
function mk(geo,col,P,o){o=o||{};let g=geo;
  if(P.flat&&!o.smooth){g=geo.index?geo.toNonIndexed():geo;g.computeVertexNormals();}
  const c=lin(col),p=g.attributes.position,n=p.count,a=new Float32Array(n*3),jit=o.nojit?0:(P.jit||0);
  for(let i=0;i<n;i++){let j=1;
    if(jit){const k=(P.flat&&!o.smooth)?((i/3)|0):i;const x=P.flat&&!o.smooth?0:p.getX(i)*41,y=P.flat&&!o.smooth?0:p.getY(i)*37,z=P.flat&&!o.smooth?0:p.getZ(i)*29;
      j=1+(hash2(Math.round(x*100)+k*7,Math.round(y*100)+k*13,Math.round(z*100)+(o.seed||1))-.5)*jit;}
    a[i*3]=c[0]*j;a[i*3+1]=c[1]*j;a[i*3+2]=c[2]*j;}
  g.setAttribute('color',new THREE.BufferAttribute(a,3));
  const m=new THREE.Mesh(g,o.ds?MATDS:MAT);m.castShadow=true;m.receiveShadow=true;return m;}
function put(par,m,x,y,z,rx,ry,rz,sx,sy,sz){m.position.set(x||0,y||0,z||0);m.rotation.set(rx||0,ry||0,rz||0);if(sx!==undefined)m.scale.set(sx,sy===undefined?sx:sy,sz===undefined?sx:sz);par.add(m);return m;}
const G=()=>new THREE.Group();
function lathe(pts,seg,sx,sz,ps,pl){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg,ps===undefined?0:ps,pl===undefined?TAU:pl);
  if(sx!==undefined&&(sx!==1||sz!==1))g.scale(sx,1,sz===undefined?1:sz);return g;}
/* tapered capsule hanging down from y=0 (top cap centre) to y=-L */
function limbGeo(r0,r1,L,seg,rings){rings=rings||2;const pts=[[0,-L-r1]];
  for(let i=1;i<=2;i++){const a=i/2*Math.PI/2;pts.push([r1*Math.sin(a),-L-r1*Math.cos(a)]);}
  for(let i=1;i<rings;i++){const t=i/rings;pts.push([lerp(r1,r0,t),-L*(1-t)]);}
  pts.push([r0,0]);for(let i=1;i<=2;i++){const a=i/2*Math.PI/2;pts.push([r0*Math.cos(a),r0*Math.sin(a)]);}pts[pts.length-1][0]=0.0001;
  return lathe(pts,seg);}
function sphereGeo(r,seg,ph){return new THREE.SphereGeometry(r,seg,Math.max(3,ph||Math.round(seg/2)));}

/* bake every mesh under root into one geometry (1 draw call) */
function mergeGeos(list){let n=0;list.forEach(g=>n+=g.attributes.position.count);
  const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
  list.forEach(g=>{P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);C.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;});
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(P,3));out.setAttribute('normal',new THREE.BufferAttribute(N,3));out.setAttribute('color',new THREE.BufferAttribute(C,3));return out;}
function bake(root,skip){root.updateMatrixWorld(true);const list=[],keep=[];
  root.traverse(o=>{if(o.isMesh){if(skip&&skip(o)){keep.push(o);return;}let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);list.push(g);}});
  const m=new THREE.Mesh(mergeGeos(list),MATDS);m.castShadow=true;m.receiveShadow=true;
  const keepers=keep.map(o=>{o.parent.remove(o);return o;});
  while(root.children.length)root.remove(root.children[0]);
  root.add(m);keepers.forEach(k=>root.add(k));return m;}

/* ================= STYLE 1: current blocky, copied from islands_look.html personGeo/armGeo ================= */
function blocky(c){const root=G(),P={flat:true,jit:.05};
  const skin=c.skin,shirt=c.top,pants=c.legs,hair=c.hair;
  const box=(w,h,d,x,y,z,col,par)=>put(par||root,mk(new THREE.BoxGeometry(w,h,d),col,P),x,y,z);
  box(.2,.9,.22,-.12,.45,0,pants);box(.2,.9,.22,.12,.45,0,pants);
  box(.52,.74,.32,0,1.3,0,shirt);
  put(root,mk(new THREE.IcosahedronGeometry(.18,0),skin,P),0,1.85,0,0,0,0,1,1.1,1);
  put(root,mk(new THREE.IcosahedronGeometry(.19,0),hair,P),0,1.92,-.03,0,0,0,1,.8,1);
  const arms=[];
  for(const s of[-1,1]){const piv=G();piv.position.set(s*.34,1.6,0);
    put(piv,mk(new THREE.BoxGeometry(.14,.7,.14),shirt,P),0,-.35,0);put(piv,mk(new THREE.BoxGeometry(.12,.12,.12),skin,P),0,-.75,0);
    piv.rotation.z=-s*.75;root.add(piv);arms.push(piv);}   /* the arms-out look the owner dislikes */
  /* crude box tools, for the cast to be readable */
  if(c.tool==='bucket'){arms[0].rotation.z=.75;put(arms[0],mk(new THREE.BoxGeometry(.24,.24,.24),PAL.zinc,P),0,-.95,0);}
  if(c.tool==='mallet'){put(arms[0],mk(new THREE.BoxGeometry(.06,.6,.06),PAL.wood,P),0,-.75,.0);put(arms[0],mk(new THREE.BoxGeometry(.28,.14,.14),PAL.wood,P),0,-1.05,0);}
  if(c.tool==='rope'){put(root,mk(new THREE.BoxGeometry(.3,.3,.16),PAL.manila,P),.3,1.35,.22);}
  if(c.tool==='glass'){put(arms[0],mk(new THREE.BoxGeometry(.07,.07,.4),PAL.brass,P),0,-.75,.2);}
  bake(root);return{root,bob:true};}

/* ================= shared humanoid rig (styles 2, 3, 5, 6) ================= */
function props(kind,P,S){S=S||1;const g=G();
  if(kind==='bucket'){const bk=G();bk.position.y=-.30*S;
    put(bk,mk(new THREE.CylinderGeometry(.13*S,.10*S,.24*S,P.seg+2,1,true),PAL.zinc,P,{ds:true}),0,0,0);
    put(bk,mk(new THREE.CylinderGeometry(.10*S,.10*S,.012,P.seg+2),dark(PAL.zinc,.7),P),0,-.12*S,0);
    put(bk,mk(new THREE.CylinderGeometry(.122*S,.122*S,.008,P.seg+2),PAL.water,P,{nojit:true}),0,.085*S,0);
    put(bk,mk(new THREE.TorusGeometry(.132*S,.012*S,4,P.seg+2),dark(PAL.zinc,.8),P),0,.12*S,0,Math.PI/2,0,0);
    const h=mk(new THREE.TorusGeometry(.13*S,.008*S,4,10,Math.PI),dark(PAL.zinc,.6),P,{nojit:true});h.position.set(0,.12*S,0);h.rotation.set(0,0,0);bk.add(h);
    g.add(bk);g.userData.swing=bk;g.userData.swingTop=1;return g;}
  if(kind==='mallet'){const l=.5*S;
    put(g,mk(new THREE.CylinderGeometry(.02*S,.024*S,l,6),PAL.wood,P),0,l*.5-.12*S,0);
    put(g,mk(new THREE.CylinderGeometry(.055*S,.055*S,.2*S,P.seg>6?10:6),dark(PAL.wood,.82),P),0,l-.12*S,0,0,0,Math.PI/2);
    put(g,mk(new THREE.TorusGeometry(.055*S,.009*S,4,P.seg>6?10:6),dark(PAL.zinc,.7),P),-.07*S,l-.12*S,0,0,Math.PI/2,0);
    put(g,mk(new THREE.TorusGeometry(.055*S,.009*S,4,P.seg>6?10:6),dark(PAL.zinc,.7),P),.07*S,l-.12*S,0,0,Math.PI/2,0);return g;}
  if(kind==='glass'){
    put(g,mk(new THREE.CylinderGeometry(.021*S,.026*S,.30*S,8),PAL.brass,P),0,0,.12*S,Math.PI/2,0,0);
    put(g,mk(new THREE.CylinderGeometry(.027*S,.027*S,.12*S,8),dark(PAL.wood,.7),P),0,0,.09*S,Math.PI/2,0,0);
    put(g,mk(new THREE.CylinderGeometry(.034*S,.03*S,.05*S,8),PAL.brass,P),0,0,.28*S,Math.PI/2,0,0);return g;}
  return g;}

function ropeCoil(P,S){const g=G();S=S||1;
  /* concentric turns seen end-on, like a coil hung over the shoulder, plus a loose tail */
  [.07,.105,.14,.175].forEach((r,i)=>{put(g,mk(new THREE.TorusGeometry(r*S,.017*S,4,P.seg+6),i%2?dark(PAL.manila,.82):PAL.manila,P),0,0,(i%2?.012:-.012)*S);});
  put(g,mk(new THREE.CylinderGeometry(.012*S,.012*S,.2*S,4),PAL.manila,P),.1*S,-.2*S,0);return g;}

/* merge the rigid meshes that share one pivot into a single mesh (fewer draw calls, same pose behaviour) */
function mergePivots(root){root.traverse(g=>{if(g.isMesh)return;const ms=g.children.filter(c=>c.isMesh);if(ms.length<2)return;
  const geos=ms.map(m=>{m.updateMatrix();const geo=m.geometry.index?m.geometry.toNonIndexed():m.geometry.clone();geo.applyMatrix4(m.matrix);return geo;});
  ms.forEach(m=>g.remove(m));const mm=new THREE.Mesh(mergeGeos(geos),MATDS);mm.castShadow=true;mm.receiveShadow=true;g.add(mm);});}
/* build a rigged person. P = style params, c = cast entry */
function human(c,P){
  const R={},root=G();R.root=root;const S=P.S||1;
  const legL=P.legL,thighL=legL*.5,shinL=legL*.5-P.bootH*.4,torsoH=P.torsoH,pel=P.pel;
  const pelvis=G();pelvis.position.y=legL;root.add(pelvis);R.pelvis=pelvis;
  const spine=G();pelvis.add(spine);R.spine=spine;
  const flare=P.flare||1;
  /* legs */
  R.hipL=[];R.knee=[];
  for(const s of[1,-1]){
    const hip=G();hip.position.set(s*P.hipW/2,0,0);pelvis.add(hip);
    put(hip,mk(limbGeo(P.thR,P.knR,thighL,P.seg,2),c.legs,P),0,0,0);
    const knee=G();knee.position.y=-thighL;hip.add(knee);
    put(knee,mk(limbGeo(P.knR,P.ankR,shinL,P.seg,2),c.legs,P),0,0,0);
    /* boot: shaft + toe */
    const bt=P.bootH;
    put(knee,mk(new THREE.CylinderGeometry(P.ankR*1.28,P.ankR*1.15,bt*.9,P.seg),PAL.boot,P),0,-shinL-P.ankR*.4,0);
    put(knee,mk(sphereGeo(1,P.seg),PAL.boot,P),0,-shinL-bt*.6,P.ankR*1.2*P.bootL,0,0,0,P.ankR*1.3,bt*.4,P.ankR*2.4*P.bootL);
    if(c.rolled){put(knee,mk(new THREE.TorusGeometry(P.knR*.98,P.knR*.18,4,P.seg),dark(c.legs,1.15),P),0,-shinL*.55,0,Math.PI/2,0,0);}
    R.hipL.push(hip);R.knee.push(knee);}
  /* pelvis/torso lathe */
  const hR=P.hipR,wR=P.waistR,cR=P.chestR,sR=P.shR;
  const topY=torsoH;
  let tp;
  const bodyCol=c.coat?c.top:(c.smock?c.top:c.top);
  if(c.coat||c.smock||c.skirt){
    /* long garment: from the shoulders down to the hem; width follows the style's flare */
    const hem=c.coat?-legL*.50:c.smock?-legL*.26:-legL*.62;
    const hemR=(c.coat?hR*1.9:c.smock?hR*1.55:hR*2.0)*flare;
    tp=[[0,hem],[hemR,hem],[hemR*.9,hem*.55],[hR*1.25,-pel*.2],[wR*1.02,topY*.34],[cR*1.02,topY*.72],[sR,topY*.95],[sR*.58,topY*1.0],[P.neckR*1.1,topY*1.02],[0,topY*1.02]];
  } else {
    tp=[[0,-pel],[hR*.82,-pel+.02],[hR,-pel*.45],[wR,topY*.34],[cR,topY*.72],[sR,topY*.95],[sR*.58,topY*1.0],[P.neckR*1.1,topY*1.02],[0,topY*1.02]];
  }
  /* skirt/smock layered on a trouser body */
  if(c.skirt){ /* blouse torso above, skirt below */
    const bt=[[0,-pel],[hR*.9,-pel+.02],[hR*1.05,-pel*.3],[wR,topY*.34],[cR,topY*.72],[sR,topY*.95],[sR*.58,topY*1.0],[P.neckR*1.1,topY*1.02],[0,topY*1.02]];
    put(spine,mk(lathe(bt,P.seg,P.tw,P.td),c.top,P),0,0,0);
    const sk=[[hR*1.55*flare*1.25,-legL*.66],[hR*1.50*flare*1.2,-legL*.62],[hR*1.4*flare,-legL*.3],[hR*1.12,-pel*.2],[wR*1.08,topY*.22],[wR*1.0,topY*.34],[0.0001,topY*.34]];
    pelvis.add(put(spine,mk(lathe(sk.slice(0),P.seg,P.tw*1.05,P.td*1.05),c.legs,P,{ds:true}),0,0,0));
    put(spine,mk(new THREE.TorusGeometry(wR*P.tw*1.05,P.thR*.14,4,P.seg),dark(c.legs,.7),P),0,topY*.3,0,Math.PI/2,0,0,1,P.td/P.tw*1.0,1);
  } else put(spine,mk(lathe(tp,P.seg,P.tw,P.td),bodyCol,P),0,0,0);
  /* apron, shawl, scarf, belt, collar */
  if(c.apron&&P.detail>=1){
    const ap=[[hR*1.62*flare*1.28,-legL*.60],[hR*1.50*flare,-legL*.3],[hR*1.16,-pel*.2],[wR*1.1,topY*.28],[cR*1.1,topY*.66],[cR*.82,topY*.86]];
    put(spine,mk(lathe(ap,P.seg,P.tw*1.06,P.td*1.07,-.95,1.9),PAL.linen,P,{ds:true}),0,0,0.0);
    put(spine,mk(new THREE.TorusGeometry(wR*P.tw*1.08,P.thR*.1,4,P.seg),dark(PAL.linen,.8),P),0,topY*.3,0,Math.PI/2,0,0,1,P.td/P.tw*1.0,1);}
  if(c.shawl&&P.detail>=1){const sh=[[sR*1.18,topY*.7],[sR*1.16,topY*.84],[sR*1.06,topY*.95],[P.neckR*1.5,topY*1.04],[P.neckR*1.2,topY*1.05]];
    put(spine,mk(lathe(sh,P.seg,P.tw*1.05,P.td*1.1,0.5,TAU-1.0),PAL.rust,P,{ds:true}),0,0,-.005,0,0,0);
    put(spine,mk(lathe(sh,P.seg,P.tw*1.05,P.td*1.1,-.7,1.4),dark(PAL.rust,.88),P,{ds:true}),0,0,0);}
  if(c.scarf&&P.detail>=1){put(spine,mk(new THREE.TorusGeometry(P.neckR*1.35,P.neckR*.45,5,P.seg),PAL.rust,P),0,topY*1.03,0,Math.PI/2,0,0);
    put(spine,mk(new THREE.BoxGeometry(.07*S,.2*S,.02*S),PAL.rust,P),.05*S,topY*.86,P.chestR*P.td*.98*1.1);}

/* pose: angles in radians; fwd positive = forward (character faces +z); out positive = away from body */
function applyPose(R,p){
  R.pelvis.position.y=R.dims.legL+(p.bob||0);
  R.pelvis.rotation.set(0,p.hipTwist||0,0);
  R.spine.rotation.set(-(p.lean||0),p.twist||0,p.sway||0);
  R.head.rotation.set(-(p.headX||0),p.headY||0,0);
  const L=p.ll||[0,0],Rr=p.rl||[0,0];
  [[0,L],[1,Rr]].forEach(([i,v])=>{R.hipL[i].rotation.set(-v[0],0,(i===0?-1:1)*(v[2]||0));R.knee[i].rotation.set(v[1],0,0);});
  const A=[p.la||[0,.05,.1],p.ra||[0,.05,.1]];
  /* arm index 0 = +x (left), 1 = -x (right) */
  A.forEach((a,i)=>{const s=i===0?1:-1;R.arm[i].rotation.set(-a[0],0,s*a[1]);R.elbow[i].rotation.set(-a[2],0,0);R.hand[i].rotation.set(-(a[3]||0),0,0);});}

function makePerson(style,c,xi,rowZ){
  const rec={style,key:c.key,label:c.label};let root,upd;
  const yawBase={man:-.3,woman:.18,skip:.28,fish:-.12}[c.key];
  rec.x=XS[xi];rec.z=rowZ;rec.yaw=yawBase;
  const wob=(t,r,amp)=>{r.position.y=amp*(.5+.5*Math.sin(t*1.6+xi*1.7));};
  if(style===1){const b=blocky(c);root=b.root;upd=(t)=>{root.position.y=Math.abs(Math.sin(t*1.3+xi*2))*.015;};}
  else if(style===2){const R=styled(c,P2,BASEPOSE[c.key]);root=R.root;bake(root);upd=(t)=>{root.position.y=.008*Math.sin(t*1.4+xi*1.7);root.rotation.z=.01*Math.sin(t*.9+xi);};}
  else if(style===3){const R=styled(c,P3,BASEPOSE[c.key]);root=R.root;bake(root);upd=(t)=>{root.position.y=.012*Math.abs(Math.sin(t*1.6+xi*1.7));};}
  else if(style===4){const s=sprite(c.key,0,xi);root=s.root;rec.spr=s.spr;rec.dirYaw={man:Math.PI/4,woman:0,skip:-Math.PI/4,fish:Math.PI/2}[c.key];rec.yaw=rec.dirYaw;
    upd=(t)=>{s.spr.position.y=.01*Math.abs(Math.sin(t*1.6+xi*1.7));};}
  else if(style===5){const ex=tiny(c);root=ex.R.root;const R=ex.R;
    /* bake the body, keep tools and flaps live */
    const live=new Set();ex.anim.forEach(f=>live.add(f));if(R.tool)R.tool.traverse(o=>live.add(o));if(R.coil)R.coil.traverse(o=>live.add(o));
    const keepRoots=[...ex.anim];
    /* the bucket and the coil swing as groups: detach them first */
    const keepG=[];
    if(R.tool&&c.key==='woman'){const b=R.tool.userData.swing;const par=b.parent;const wp=new THREE.Vector3();R.root.updateMatrixWorld(true);par.updateMatrixWorld(true);
      const holder=G();par.add(holder);holder.position.set(0,0,0);holder.add(b);keepG.push(holder);R.swingHolder=holder;}
    const holders=keepG.concat(ex.anim);
    /* temporarily detach live parts, bake, reattach in the world frame of root */
    const saved=holders.map(h=>{h.updateMatrixWorld(true);const m=h.matrixWorld.clone();h.parent.remove(h);return{h,m};});
    const pr=root.getObjectByProperty?null:null;

      saved.forEach(({h})=>{
        if(h===R.swingHolder){/* pendulum about the hand */
          const base=h.userData.base||(h.userData.base=h.position.clone());h.rotation.z=.32*Math.sin(t*2.3+xi);h.rotation.x=.08*Math.sin(t*1.9);
          }
        else if(h.userData.base&&h.geometry){const p=h.geometry.attributes.position,b=h.userData.base,H=h.userData.h,ph=h.userData.ph;
          for(let i=0;i<p.count;i++){const y=b[i*3+1],u=-y/H;p.setZ(i,b[i*3+2]-u*H*.28-Math.sin(t*3.2+ph+u*3.1)*u*.09*H/.7);p.setX(i,b[i*3]+Math.sin(t*2.6+ph*1.3+u*2.4)*u*.05);}p.needsUpdate=true;h.geometry.computeVertexNormals();}
      });};

/* style 6 animation: idle bob, walk, work poses */
function poseAnim(rec,t){const R=rec.R,b=rec.base,m=rec.mode,p=clonePose(b),ph=t*5.2+rec.x;
  const sw=Math.sin(ph),cw=Math.cos(ph);
  if(m==='carry'){ /* woman walks with the bucket */
    p.ll=[sw*.5,.12+.7*Math.max(0,cw)];p.rl=[-sw*.5,.12+.7*Math.max(0,-cw)];
    p.la=[-sw*.45,.1,.35];p.ra=[.14+.04*sw,.22,.16];p.bob=-.02*Math.abs(cw)+.0;p.lean=.05;p.hipTwist=sw*.1;p.twist=-sw*.12;p.headX=.1;p.headY=0;
    if(R.tool){const sw0=R.tool.userData.swing;sw0.rotation.z=.18*Math.sin(ph*.5+.4)+.05;sw0.rotation.x=.12*Math.sin(ph);}
    /* walk a small loop */
    const a=t*.55-2.13,rad=.8;rec.root.position.set(rec.home.x+Math.sin(a)*rad,0,rec.home.z+(Math.cos(a)-1)*rad*.7);
    rec.root.rotation.y=Math.atan2(Math.cos(a)*rad,-Math.sin(a)*rad*.7);}
  else if(m==='hammer'){ /* mallet over the shoulder, then down on a stake */
    const T=1.25,u=((t+rec.x*.3)%T+T)%T/T;
    let a;if(u<.62)a=sm(u/.62);else if(u<.74)a=1-sm((u-.62)/.12);else a=0;
    const hit=u>=.72&&u<.82?1-Math.abs((u-.77)/.05):0;
    p.ra=[lerp(.35,2.6,a),.18,lerp(.9,1.55,a),lerp(.2,.0,a)];p.la=[.55,.2,.9];
    p.lean=lerp(.2,.0,a)+.1*Math.max(0,hit);p.ll=[.3,.35];p.rl=[-.22,.1];p.hipTwist=-.12;p.twist=lerp(.18,-.1,a);p.headX=.5;p.headY=-.05;p.bob=-.03-.015*a;
    p.rl[1]=.18;}
  else if(m==='haul'){ /* hand over hand on a rope */
    const cyc=Math.sin(t*3.2);p.la=[.85+.28*cyc,.15,1.05+.25*cyc];p.ra=[.85-.28*cyc,.15,1.05-.25*cyc];
    p.lean=-.12-.05*Math.sin(t*6.4);p.ll=[.25,.2];p.rl=[-.25,.3];p.headX=.15;p.headY=-.3;p.bob=-.03;p.twist=.1*cyc;p.hipTwist=-.05;}
  else if(m==='look'){ /* skipper raises the glass, lowers it, shifts his weight */
    const u=.5+.5*Math.sin(t*.8);p.ra=[lerp(.9,1.85,u),.15,lerp(.65,1.5,u),.1];p.headX=.12+.2*u;p.headY=.12*Math.sin(t*.5);p.sway=.015*Math.sin(t*.7);p.lean=-.03-.02*u;p.bob=.004*Math.sin(t*1.4);}
  if(m==='hammer'||m==='haul'||m==='look'||m==='carry'){/* breathing on all */p.bob=(p.bob||0)+.004*Math.sin(t*1.9+rec.x);}
  applyPose(R,p);}

      rec.home={x:rec.x,z:rec.z};rec.root.position.set(rec.x,0,rec.z);rec.root.rotation.y=rec.yaw;rowsGroup.add(rec.root);people.push(rec);});
    /* stake for the hammering man (all rows, same dressing) */
    const stake=mk(new THREE.CylinderGeometry(.04,.05,.34,6),PAL.wood,{flat:true,jit:.05});stake.position.set(XS[0]+.1,.17,ROWZ(n)+.62);stake.rotation.y=-.3;rowsGroup.add(stake);rowDecor.push({o:stake,n});
    const crate=mk(new THREE.BoxGeometry(.36,.26,.3),dark(PAL.wood,.85),{flat:true,jit:.08});crate.position.set(XS[3]+.8,.13,ROWZ(n)+.35);crate.rotation.y=.4;rowsGroup.add(crate);rowDecor.push({o:crate,n});}

  for(let d=0;d<8;d++){const s=sprite('skip',d,d);const rec={style:'4b',key:'skip',label:'facing '+d,root:s.root,spr:s.spr,x:-4.9+d*1.4,z:ROWZ(7),yaw:0,dirYaw:d*Math.PI/4,
      update:(t)=>{s.spr.position.y=.01*Math.abs(Math.sin(t*1.6+d));}};
    rec.root.position.set(rec.x,0,rec.z);rowsGroup.add(rec.root);rec.tris=2;rec.meshes=2;people.push(rec);}
}

    const shore=sm((z-14)/6);c=c.map((v,k)=>lerp(v,sand[k]*(.92+.16*n2),shore));
    const s=.9+.2*fine;c=c.map(v=>v*s);const ef=sm((Math.max(Math.abs(x)/22,Math.abs(z)/20)-.72)/.28);c=c.map((v,k)=>lerp(v,[.30,.35,.17][k]*.95,ef));const cc=lin(c);col[i*3]=cc[0];col[i*3+1]=cc[1];col[i*3+2]=cc[2];
    p.setY(i,(n2-.5)*.025+(n-.5)*.05);}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,MAT);m.receiveShadow=true;stage.add(m);
  /* outer skirt so the overview has an edge of land, then a hint of dark water */
  const ring=new THREE.Mesh(new THREE.CircleGeometry(120,48).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:new THREE.Color(...lin([.28,.33,.17]))}));ring.position.y=-.05;ring.receiveShadow=true;scene.add(ring);
  /* pebbles and grass tufts, merged */
  const geos=[];
  const addG=(geo,c,x,y,z,sx,sy,sz,ry)=>{const mm=mk(geo,c,{flat:true,jit:.12});mm.position.set(x,y,z);mm.scale.set(sx,sy,sz);mm.rotation.y=ry;mm.updateMatrixWorld(true);const gg=mm.geometry.clone();gg.applyMatrix4(mm.matrixWorld);geos.push(gg);};
  const ico=new THREE.IcosahedronGeometry(1,0),blade=new THREE.ConeGeometry(.03,.3,3);
  for(let i=0;i<520;i++){const x=(R()-.5)*(W-2),z=(R()-.5)*(Dp-2);
    if(Math.abs(z-Math.round((z/3.6)+3.5-0)*0)<0){}
    const inRow=[1,2,3,4,5,6,7].some(r=>Math.abs(z-ROWZ(r))<1.0&&Math.abs(x)<5.9);if(inRow&&R()<.8)continue;
    const y=0;
    if(R()<.55)addG(ico,stone.map(v=>v*(.7+R()*.5)),x,.03,z,.05+R()*.1,.04+R()*.06,.05+R()*.1,R()*6);
    else for(let b=0;b<4;b++){const a=R()*6.28;addG(blade,[.30+R()*.12,.38+R()*.1,.16],x+Math.cos(a)*.06,.14,z+Math.sin(a)*.06,1,.6+R()*.9,1,a);}}
  const gm=new THREE.Mesh(mergeGeos(geos),MATDS);gm.castShadow=true;gm.receiveShadow=true;stage.add(gm);
}

/* ================= camera / views ================= */
const cam={tx:0,ty:.9,tz:0,dist:30,phi:.5,theta:0};
const ZOOMS={
  overview:r=>({tx:0,ty:.8,tz:ROWZ(r),dist:24,phi:.40,theta:.0}),
  camp:r=>({tx:0,ty:.95,tz:ROWZ(r),dist:6.4,phi:.26,theta:.0}),
  close:r=>({tx:0,ty:1.0,tz:ROWZ(r),dist:3.7,phi:.16,theta:.0})};
function applyCam(){const az=STAGE_AZ+cam.theta;const cp=Math.cos(cam.phi);
  const T=new THREE.Vector3(cam.tx,cam.ty,cam.tz).applyAxisAngle(new THREE.Vector3(0,1,0),STAGE_AZ);
  camera.position.set(T.x+Math.sin(az)*cp*cam.dist,T.y+Math.sin(cam.phi)*cam.dist,T.z+Math.cos(az)*cp*cam.dist);camera.lookAt(T);
  const s=clamp(cam.dist*.75,7,34);sun.target.position.set(T.x,0,T.z);sun.position.copy(sun.target.position).addScaledVector(sunDir,120);
  const sc=sun.shadow.camera;sc.left=-s;sc.right=s;sc.top=s;sc.bottom=-s;sc.near=10;sc.far=260;sc.updateProjectionMatrix();sun.target.updateMatrixWorld();sun.updateMatrixWorld();
  camAz=az;dirty=true;}
let camAz=STAGE_AZ;
function setView(o){Object.assign(cam,o);applyCam();}
function viewRow(n,zoom){setView(ZOOMS[zoom](n));}
function solo(n){people.forEach(r=>{r.root.visible=!n||String(r.style)===String(n)||(n===4&&r.style==='4b'&&false);});rowDecor.forEach(d=>{d.o.visible=!n||d.n===n;});dirty=true;}
const rowDecor=[];

/* ================= labels ================= */
const LBL=document.getElementById('labels'),BAN=document.getElementById('banner');
let labelMode=Q.get('labels')||'none';
function setBanner(t,s){BAN.innerHTML=t?('<span>'+t+'</span><small>'+(s||'')+'</small>'):'';}
function updateLabels(){LBL.innerHTML='';if(labelMode==='none')return;
  const v=new THREE.Vector3();const W=renderer.domElement.clientWidth,H=renderer.domElement.clientHeight;
  const add=(cls,txt,wx,wy,wz,dx)=>{v.set(wx,wy,wz);stage.localToWorld(v);v.project(camera);if(v.z>1)return;const d=document.createElement('div');d.className=cls;d.textContent=txt;d.style.left=((v.x*.5+.5)*W+(dx||0))+'px';d.style.top=((-v.y*.5+.5)*H)+'px';LBL.appendChild(d);};
  if(labelMode==='rows'||labelMode==='all'){STYLES.forEach(s=>add('lr',s.n+'  '+s.name,-4.7,.6,ROWZ(s.n),0));add('lr','4b  eight facings',-5.3,.6,ROWZ(7),0);}
  if(labelMode==='all'){ORDER.forEach((k,i)=>{const c=CAST.find(q=>q.key===k);add('lb',{man:'man, mallet',woman:'woman, bucket',skip:'skipper',fish:'fisher, rope'}[k],XS[i],-.12,ROWZ(6)+.35,0);});}}

/* ================= render / loop ================= */
function updateAll(t){people.forEach(r=>r.update(t));}
function render(){updateAll(TIME);
  people.forEach(r=>{if(r.spr){const rel=r.dirYaw!==undefined?r.dirYaw:r.root.rotation.y;const a=(rel+STAGE_AZ)-camAz;const k=((Math.round(a/(Math.PI/4))%8)+8)%8;r.spr.material=sprMat(r.key,k);r.root.rotation.y=r.dirYaw!==undefined?r.dirYaw:0;r.spr.rotation.y=-r.root.rotation.y+(camAz-STAGE_AZ);}});
  renderer.render(scene,camera);updateLabels();frames++;window.__pplFrames=frames;dirty=false;}
let last=performance.now();
function loop(){requestAnimationFrame(loop);const now=performance.now();if(!FROZEN&&!freeze){TIME+=(now-last)/1000;dirty=true;}last=now;if(dirty)render();else window.__pplFrames=++frames;}
let freeze=FROZEN;

/* ================= stats and hash ================= */
function stats(){const per={};people.forEach(r=>{const k=String(r.style);(per[k]=per[k]||{tris:[],meshes:[],keys:[]});per[k].tris.push(r.tris);per[k].meshes.push(r.meshes);per[k].keys.push(r.key);});
  const out={};for(const k in per){const T=per[k].tris,M=per[k].meshes;out[k]={tris_avg:Math.round(T.reduce((a,b)=>a+b,0)/T.length),tris_max:Math.max(...T),tris:T,meshes_avg:+(M.reduce((a,b)=>a+b,0)/M.length).toFixed(1),meshes:M,keys:per[k].keys};}
  return out;}
function stateHash(){let h=2166136261>>>0;const mix=v=>{h^=v|0;h=Math.imul(h,16777619)>>>0;};
  stage.updateMatrixWorld(true);people.forEach(r=>{r.root.traverse(o=>{if(o.isMesh){const e=o.matrixWorld.elements;for(let i=0;i<16;i++)mix(Math.round(e[i]*1000));if(o.geometry.attributes.position&&o.userData.base){}}});
    if(r.spr)mix((r.spr.material.map.image.getContext('2d').getImageData(40,60,20,20).data.reduce((a,b)=>a+b,0))|0);});
  return h.toString(16);}
/* measured crowd cost: n copies of one style, one frame, real renderer counters + JS update time */
function crowd(style,n){const g=G();stage.add(g);const recs=[];
  for(let i=0;i<n;i++){const c=CAST[i%4];const r=makePerson(style,c,i%4,0);r.home={x:0,z:0};r.root.position.set((i%20)*1.3-12,0,18+Math.floor(i/20)*1.3);g.add(r.root);recs.push(r);}
  stage.updateMatrixWorld(true);
  const t0=performance.now();for(let k=0;k<20;k++)recs.forEach(r=>r.update(1.0+k*.05));const upd=(performance.now()-t0)/20;
  let tris=0,meshes=0;recs.forEach(r=>{tris+=r.tris;meshes+=r.meshes;});
  setView({tx:0,ty:1,tz:20,dist:30,phi:.5,theta:0});
  g.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});renderer.info.reset();render();
  const info={n,style,tris_scene:tris,meshes_scene:meshes,render_calls_total:renderer.info.render.calls,render_tris_total:renderer.info.render.triangles,update_ms:+upd.toFixed(3)};
  stage.remove(g);g.traverse(o=>{if(o.isMesh&&o.geometry&&!o.geometry.userData.shared)o.geometry.dispose();});dirty=true;return info;}
function texKB(){let b=0;for(const k in SPRTEX)b+=SPR.W*SPR.H*4;return Math.round(b/1024);}

/* ================= UI ================= */
function buildBar(){const bar=document.getElementById('bar');bar.innerHTML='';
  const mkb=(txt,fn,on)=>{const b=document.createElement('button');b.className='btn'+(on?' on':'');b.textContent=txt;b.onclick=fn;bar.appendChild(b);return b;};
  mkb('All styles',()=>{labelMode='all';setView({tx:0,ty:.5,tz:ROWZ(3.5)+1.8,dist:46,phi:.7,theta:0});});
  for(let n=1;n<=6;n++)mkb(String(n),()=>{labelMode='none';viewRow(n,'camp');setBanner(n+'. '+STYLES[n-1].name,'camp view; drag to orbit, wheel to zoom');});
  mkb('Close',()=>{setView({dist:4.3});});
  mkb('Overview',()=>{setView({dist:34});});}
function setupControls(cv){let drag=null;
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,th:cam.theta,ph:cam.phi};cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drag)return;setView({theta:drag.th-(e.clientX-drag.x)*.006,phi:clamp(drag.ph+(e.clientY-drag.y)*.005,.05,1.4)});});
  cv.addEventListener('pointerup',()=>{drag=null;});
  cv.addEventListener('wheel',e=>{e.preventDefault();setView({dist:clamp(cam.dist*Math.exp(e.deltaY*.001),2,80)});},{passive:false});}

function init(){
  const cv=document.getElementById('view');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance',alpha:false,preserveDrawingBuffer:true});
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(new THREE.Color(...lin([.46,.55,.66])),1);
  scene=new THREE.Scene();scene.fog=new THREE.Fog(new THREE.Color(...lin([.78,.70,.56])),18,115);
  {const c=document.createElement('canvas');c.width=4;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#5d7fa6');g.addColorStop(.55,'#9fb0b8');g.addColorStop(.8,'#dcc39a');g.addColorStop(1,'#dcc39a');x.fillStyle=g;x.fillRect(0,0,4,256);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t;}
  camera=new THREE.PerspectiveCamera(30,1,.3,600);
  sun=new THREE.DirectionalLight(0xffffff,1);scene.add(sun,sun.target);sun.color.setRGB(1.0,.64,.34);sun.intensity=2.9;
  sun.castShadow=true;sun.shadow.mapSize.set(Q.get('sh')?+Q.get('sh'):4096,Q.get('sh')?+Q.get('sh'):4096);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
  hemi=new THREE.HemisphereLight(0,0,1);hemi.color.setRGB(.24,.32,.50);hemi.groundColor.setRGB(.22,.15,.09);hemi.intensity=1.1;scene.add(hemi);
  stage=new THREE.Group();stage.rotation.y=STAGE_AZ;scene.add(stage);
  buildGround();buildRows();
  size();setupControls(cv);buildBar();
  const r=Q.get('row'),z=Q.get('zoom')||'camp';if(r)viewRow(+r,z);else setView({tx:0,ty:.5,tz:ROWZ(3.5)+1.8,dist:46,phi:.7,theta:0});
  if(Q.get('labels')===null)labelMode='rows';
  addEventListener('resize',()=>size());
  requestAnimationFrame(loop);
  setTimeout(()=>{const b=document.getElementById('boot');b.style.opacity=0;setTimeout(()=>b.remove(),700);},300);
  window.__ppl={ready:true,seed:SEED,styles:STYLES,
    setView,viewRow,solo,setTime:t=>{TIME=t;freeze=true;dirty=true;},live:()=>{freeze=false;},render:()=>{render();},
    setBanner,setLabels:m=>{labelMode=m;dirty=true;},resize:(w,h)=>{size(w,h);dirty=true;},
    stats,crowd,hash:()=>{updateAll(TIME);return stateHash();},texKB,
    drawStats:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles}),
    people:()=>people.map(p=>({style:p.style,key:p.key,tris:p.tris,meshes:p.meshes}))};
}
function size(w,h){const W=w||innerWidth,H=h||innerHeight;renderer.setPixelRatio(1);renderer.setSize(W,H,false);const cv=renderer.domElement;cv.style.width='100%';cv.style.height='100%';camera.aspect=W/H;camera.updateProjectionMatrix();dirty=true;}
setTimeout(init,40);
})();
</script>
