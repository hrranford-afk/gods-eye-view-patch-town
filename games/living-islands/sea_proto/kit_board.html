<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvage kit board</title>
<link rel="icon" href="data:,">
<!-- The salvage kit (salvage.js) laid out as a labelled board: every variant of every kind, then two rows of copies of one variant to show the repetition control.
     STANDALONE: three.js r128 from the repo's vendor copy, no game code. URL: ?rep=0..1 (repetition control, 1 = full variation, 0 = every instance the same) &lod=0|1|2 &ui=0 &kinds=plank,crate &cols=5 -->
<style>
:root{--bg:#f4efe6;--ink:#2a2620;--panel:rgba(250,246,238,.92);--line:#cfc5b2}
@media (prefers-color-scheme:dark){:root{--bg:#171a1c;--ink:#ece6da;--panel:rgba(28,32,34,.9);--line:#454b4d}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#lab{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.kbl{position:absolute;transform:translate(-50%,0);font-size:11px;white-space:nowrap;color:#2a2620;background:rgba(250,246,238,.78);padding:0 4px;border-radius:4px;display:none}
#ui{position:fixed;left:12px;top:12px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
#ui h1{font-size:15px;margin:0 0 6px}#ui label{display:block;margin:6px 0 2px;font-size:12px}
#ui input[type=range]{width:100%}#ui button{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:12px;margin-right:4px}
#st{font-size:12px;opacity:.85;margin-top:6px;white-space:pre-line}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="lab"></div>
<div id="ui"><h1>Salvage kit board</h1>
 <label for="rep">Repetition control: <span id="rv"></span> (0 = all the same, 1 = full variation)</label>
 <input id="rep" type="range" min="0" max="1" step="0.01" value="1">
 <div style="margin-top:6px"><button id="b0">Variation off</button><button id="b1">Full variation</button><button id="bz">Zoom in</button><button id="bo">Zoom out</button></div>
 <div id="st"></div></div>
<script src="../rubble/vendor/three/three.min.js"></script>
<script src="salvage.js"></script>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search), S=window.LI_SALVAGE;
const canvas=document.getElementById('c'), renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
const kit=S.makeKit(THREE), mats=S.makeMaterials(THREE), rep=Q.get('rep')!==null?parseFloat(Q.get('rep')):1;
const kq=Q.get('kinds'),board=S.makeBoard(kit,mats,{variation:rep,kinds:kq?kq.split(','):null,cols:Q.get('cols')?+Q.get('cols'):0}), lab=document.getElementById('lab');
function resize(){const pr=Math.min(window.devicePixelRatio||1,2);renderer.setPixelRatio(pr);renderer.setSize(window.innerWidth,window.innerHeight,false);board.resize(window.innerWidth,window.innerHeight);}
window.addEventListener('resize',resize);resize();
const sl=document.getElementById('rep');sl.value=rep;
function setRep(v){sl.value=v;document.getElementById('rv').textContent=(+v).toFixed(2);board.setVariation(+v);stats();}
function stats(){let n=0;for(const k of S.KINDS)n+=k.nV;document.getElementById('st').textContent=S.KINDS.length+' kinds, '+n+' variants, 3 levels of detail\nboard: '+board.calls+' draw calls, '+board.tris.toLocaleString()+' triangles';}
sl.oninput=()=>setRep(sl.value);document.getElementById('b0').onclick=()=>setRep(0);document.getElementById('b1').onclick=()=>setRep(1);
document.getElementById('bz').onclick=()=>{board.zoom(1.25);};document.getElementById('bo').onclick=()=>{board.zoom(.8);};
canvas.addEventListener('wheel',e=>{e.preventDefault();board.zoom(e.deltaY<0?1.1:.9);},{passive:false});
if(Q.get('ui')==='0')document.getElementById('ui').style.display='none';
setRep(rep);
function frame(){board.project(lab);renderer.render(board.scene,board.camera);requestAnimationFrame(frame);}
window.__board={board,kit,S,renderer,setRep,ready:true};requestAnimationFrame(frame);
})();
</script>
</body>
</html>
