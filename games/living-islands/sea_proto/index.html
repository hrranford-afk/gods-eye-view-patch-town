<!-- Living Islands sea prototype (see research/SEA_AND_STORM_PLAN.md). STANDALONE: no game code. three.js r128 from the repo's own vendor copy (rubble/vendor/three), WebGL2.
     One Gerstner sum (waves with sets and groups) in the vertex shader, a CPU port of the same sum for the boat and crates, Jacobian foam, spray points, sky with rainbow / rays / lightning, fog.
     Three tiers: iPad sea (8 waves, small polar mesh), Radeon sea (24 waves, dense mesh, 12000 spray points) and Radeon MAX (48 waves, 500k-triangle mesh that follows the camera, 100k spray, flotsam cloud). All numbers are TUNING, none measured on a device.
     Also: camera controls, GPU readout, a Bench ladder (see the Bench button), and two islands of the real seed 9001 height data with shoaling, refraction, breaking, swash and wet sand (island_9001.js).
     URL: ?tier=ipad|radeon|max &islands=0 &drift=1 &view=beach &look=x,y,z,dist,pitch,yaw &boat=x,z &type=calm|squall|after|gale|fog|swell|thunder|winter|wash &s=0..1 (how far the weather has risen) &t=seconds &freeze=1 &cam=radians -->
<style>

canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:12px;top:12px;right:12px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}

<div id="ui">

<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const G=9.81, TAU=Math.PI*2, MAXW=128;
function hash(i,s){let h=Math.imul(i|0,374761393)+Math.imul(s|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}

/* ------------------------------------------------------------ storm types: the inputs of the wave sum and the look (all TUNING) ------------------------------------------------------------
   kA = wave steepness (k times amplitude) of a band; L = wavelength in metres; sp = direction spread in degrees; q = Gerstner pinch scale (about 1 folds the crests);
   foamT = Jacobian level where foam starts; fog = exp2 density per metre. */
const CALM={wind:35,swOff:25,swKA:.030,swL:75,swSp:6,wsKA:.020,wsL:20,wsSp:35,chKA:.016,q:.85,foamT:.50,foam:.35,streak:0,
  hor:[.62,.74,.84],zen:[.16,.34,.62],sunEl:34,sunAz:215,sunI:1,cover:.25,cloud:[.95,.95,.97],fog:.0011,fogC:[.66,.77,.86],
  rainbow:0,rays:0,flash:0,smoke:0,deep:[.012,.085,.13],shal:[.05,.28,.30],vort:0,surge:0,exp:1.0,dark:0};
const TYPES={
 calm:{label:'Calm day'},
 squall:{label:'Summer squall',wind:60,swOff:15,swKA:.05,swL:60,wsKA:.15,wsL:15,chKA:.10,q:1.15,foamT:.85,foam:.8,streak:.5,hor:[.34,.38,.43],zen:[.10,.15,.24],sunEl:20,sunAz:250,sunI:.55,cover:.95,cloud:[.30,.33,.38],fog:.0042,fogC:[.42,.46,.50],rays:.0,deep:[.01,.06,.09],dark:.5,exp:1.05},
 after:{label:'Squall just gone (rainbow)',wind:60,swOff:15,swKA:.05,swL:60,wsKA:.07,wsL:16,chKA:.05,q:.95,foamT:.7,foam:.5,streak:.15,hor:[.80,.74,.62],zen:[.17,.32,.58],sunEl:20,sunAz:250,sunI:1.5,cover:.55,cloud:[.9,.82,.74],fog:.0016,fogC:[.78,.74,.68],rainbow:1,rays:1,deep:[.012,.08,.12]},
 gale:{label:'Autumn gale',wind:75,swOff:20,swKA:.10,swL:120,wsKA:.19,wsL:34,wsSp:25,chKA:.10,q:1.3,foamT:.95,foam:1,streak:1,hor:[.45,.48,.50],zen:[.15,.19,.24],sunEl:14,sunAz:230,sunI:.45,cover:1,cloud:[.36,.39,.42],fog:.0055,fogC:[.50,.54,.56],deep:[.012,.06,.075],dark:.35,exp:1.0},
 fog:{label:'Fog bank',wind:30,swOff:30,swKA:.020,swL:90,wsKA:.008,wsL:14,chKA:.004,q:.7,foamT:.4,foam:.1,hor:[.74,.77,.78],zen:[.66,.70,.72],sunEl:18,sunAz:200,sunI:.25,cover:.3,cloud:[.8,.82,.83],fog:.030,fogC:[.72,.75,.76],deep:[.02,.08,.10],exp:1.05},
 swell:{label:'Ground swell (clear)',wind:100,swOff:-60,swKA:.085,swL:150,swSp:3,wsKA:.004,wsL:22,chKA:.002,q:1.0,foamT:.45,foam:.25,hor:[.66,.78,.88],zen:[.10,.28,.60],sunEl:38,sunAz:200,sunI:1.2,cover:.12,fog:.0010,fogC:[.68,.79,.88],deep:[.008,.08,.14],shal:[.05,.30,.34]},
 thunder:{label:'Thunderstorm',wind:80,swOff:20,swKA:.07,swL:90,wsKA:.17,wsL:26,chKA:.11,q:1.25,foamT:.95,foam:.9,streak:.8,hor:[.26,.28,.31],zen:[.06,.07,.11],sunEl:10,sunAz:230,sunI:.25,cover:1,cloud:[.18,.19,.23],fog:.0050,fogC:[.28,.30,.33],flash:1,deep:[.008,.04,.055],dark:.6},
 winter:{label:'Winter storm (sea smoke)',wind:70,swOff:20,swKA:.09,swL:130,wsKA:.17,wsL:30,chKA:.09,q:1.25,foamT:.95,foam:.9,streak:1,hor:[.58,.64,.72],zen:[.12,.18,.30],sunEl:5,sunAz:190,sunI:.7,cover:.8,cloud:[.55,.60,.68],fog:.0060,fogC:[.62,.68,.74],smoke:1,deep:[.014,.07,.10],dark:.2},
 wash:{label:'The Great Wash',wind:55,swOff:25,swKA:.13,swL:140,swSp:5,wsKA:.17,wsL:32,chKA:.08,q:1.25,foamT:.95,foam:1,streak:.8,hor:[.60,.46,.32],zen:[.13,.15,.20],sunEl:6,sunAz:215,sunI:1.0,cover:.9,cloud:[.30,.30,.34],fog:.0030,fogC:[.50,.42,.34],rays:.8,vort:1,surge:1.2,deep:[.012,.055,.08],dark:.4}
};
TYPES.calm=Object.assign({},TYPES.calm);
function paramsFor(type,s){const T=TYPES[type]||TYPES.calm,P={};
  for(const k in CALM){const a=CALM[k],b=T[k]!==undefined?T[k]:a;
    if(Array.isArray(a))P[k]=a.map((v,i)=>lerp(v,b[i],s)); else P[k]=lerp(a,b,s);}
  return P;}

/* ------------------------------------------------------------ tiers (cost knobs) ------------------------------------------------------------ */
const TIERS={
 ipad:{name:'iPad sea',refract:0,rings:72,segs:160,nSw:3,nWs:5,nCh:0,rip:4,clouds:0,spray:600,debris:400,prCap:2,flashBolt:0},
 radeon:{name:'Radeon sea',refract:1,rings:220,segs:480,nSw:5,nWs:9,nCh:10,rip:10,clouds:1,spray:12000,debris:20000,prCap:2,flashBolt:1},
 /* Radeon MAX: picked from the bench knee (or by hand). A denser mesh that FOLLOWS THE CAMERA (the polar rings are tightest at the middle, so the middle is where the camera is), 48 waves,
    more spray, and a debris cloud of flotsam drifting with the wind round the viewer. Numbers are TUNING until the owner's bench report says where the knee is. */
 max:{name:'Radeon MAX',refract:1,tris:500000,waves:48,rip:12,clouds:1,spray:100000,debris:20000,prCap:2,flashBolt:1,follow:1,flotsam:1}
};
/* the shared tier table (../tiers.js, loaded and used only with &cost=1): the pixel ratio cap, ripples, spray and debris of each tier come from the one table the island page also reads (the iPad cap is 1.5, not 2: the owner's iPad bench held 1.5x and took 24.1 ms at 2x). Absent = the numbers above, unchanged. */
if(Q.get('cost')==='1'&&window.LI_TIERS){for(const k of ['ipad','radeon','max']){const f=LI_TIERS.seaFor(k),T=TIERS[k];if(!f||!T)continue;T.prCap=f.prCap;T.rip=f.rip;T.spray=f.spray;T.debris=f.debris;}}
/* the effective tier: a tier plus the bench / hand knobs state.K = {tris,waves,spray,debris,scale}. tris -> a polar grid (segs about 2.2 x rings); waves -> sets/wind sea/chop in about 5:9:10 */
function effTier(){const B=TIERS[state.tier],K=state.K,T=Object.assign({},B);
  if(B.tris){T.rings=Math.round(Math.sqrt(B.tris/2/2.2));T.segs=Math.round(T.rings*2.2);}
  if(B.waves){const w=B.waves;T.nSw=w<=12?Math.round(w*3/8):Math.round(w*5/24);T.nWs=w<=12?w-T.nSw:Math.round(w*9/24);T.nCh=w<=12?0:w-T.nSw-T.nWs;}
  if(K){if(K.tris!==undefined){T.rings=Math.max(8,Math.round(Math.sqrt(K.tris/2/2.2)));T.segs=Math.round(T.rings*2.2);}
    if(K.waves!==undefined){const w=K.waves;T.nSw=w<=12?Math.round(w*3/8):Math.round(w*5/24);T.nWs=w<=12?w-T.nSw:Math.round(w*9/24);T.nCh=w<=12?0:w-T.nSw-T.nWs;}
    if(K.spray!==undefined)T.spray=K.spray;if(K.debris!==undefined){T.debris=K.debris;T.flotsam=K.flotsam!==undefined?K.flotsam:T.flotsam;}
    if(K.scale!==undefined)T.scale=K.scale;if(K.follow!==undefined)T.follow=K.follow;}
  T.islands=(K&&K.islands!==undefined)?K.islands:(state.islands?1:0);T.islStep=T.islStep||(B.refract===0?3:1.5);T.nTot=T.nSw+T.nWs+T.nCh;T.triCount=2*T.rings*T.segs;return T;}
const VORT=[-45,-80,28,9]; /* x, z, radius, depth in metres of the funnel at full strength */

/* ------------------------------------------------------------ wave table: sets (swell trains), groups (close neighbours beat), wind sea, chop ------------------------------------------------------------ */
function buildWaves(P,tier){
  const W=[];const wr=P.wind*Math.PI/180;
  function band(n,kA,Lmin,Lmax,dirC,spreadDeg,salt,gm){
    for(let i=0;i<n;i++){const u=n>1?i/(n-1):.5;const L=Lmin*Math.pow(Lmax/Lmin,u)*(.94+.12*hash(i,salt));
      const dir=dirC+(hash(i,salt+7)-.5)*2*spreadDeg*Math.PI/180;
      const k=TAU/L, A=kA/Math.sqrt(n)/k*(gm||1);
      W.push({dx:Math.cos(dir),dz:Math.sin(dir),k,A,w:Math.sqrt(G*k),phi:hash(i,salt+13)*TAU,L});}}
  band(tier.nSw,P.swKA,P.swL*.78,P.swL*1.3,wr+P.swOff*Math.PI/180,P.swSp,100);     /* swell set: close wavelengths and directions, so groups form */
  band(tier.nWs,P.wsKA,P.wsL*.45,P.wsL*1.5,wr,P.wsSp,200);                          /* wind sea */
  if(tier.nCh)band(tier.nCh,P.chKA,6.2,Math.min(P.wsL*.4,12),wr,50,300);           /* chop (Radeon only: the iPad does these as fragment ripples) */
  const n=W.length;
  for(const w of W){w.Q=clamp(P.q/(n*w.k*w.A),0,1);}                                   /* sum of Q k A = q: about 1 begins to fold the crests */
  return W;
}
/* ------------------------------------------------------------ ISLANDS: the real seed 9001 island, put in the sea twice ------------------------------------------------------------
   Heights come from island_9001.js (the landform world seed 9001 arrays, 129 x 129 cells of 2 m, as rubble/terrain.js reads them). Island A is turned half a turn so its lee beach faces the open sea the waves come from, island B is
   the same island turned a quarter. Outside the island windows the sea floor falls to -40 m (open sea). A world grid (2 m nodes) of depth, a wave-shadow and a ground class feeds the shader; a 4 m grid holds the extra phase path
   of a swell wave and a wind-sea wave (PHI), made by walking each node back along the wind through the depths. The same arrays answer the CPU height query, so the boat, crates and camera agree with the picture. */
const ISLS=[{cx:10,cz:70,rot:Math.PI,id:'A'},{cx:-170,cz:200,rot:Math.PI/2,id:'B'}];
const WG={x0:-348,z0:-188,n:289,cell:2,nb:145,cellB:4};
const TIDE_AMP=0.6,TIDE_PERIOD=240,SWASHK=.40;   /* TUNING: the tide of the world (1.1 m) is cut to 0.6 m and run on a 4 minute period so it can be watched */
let ISLD=null;
function b64bytes(b){const a=atob(b),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u;}
function islandData(){if(ISLD)return ISLD;const D=window.SEA_ISLAND;if(!D)return null;
  const hb=b64bytes(D.h),h16=new Int16Array(hb.buffer,0,D.nx*D.nx),hF=new Float32Array(D.nx*D.nx);for(let i=0;i<hF.length;i++)hF[i]=h16[i]/256;
  ISLD={nx:D.nx,dx:D.dx,half:(D.nx-1)*D.dx/2,hF,g:b64bytes(D.g)};return ISLD;}
function crW(t,o){const t2=t*t,t3=t2*t;o[0]=-.5*t3+t2-.5*t;o[1]=1.5*t3-2.5*t2+1;o[2]=-1.5*t3+2*t2+.5*t;o[3]=.5*t3-.5*t2;}
const _wx=[0,0,0,0],_wz=[0,0,0,0];
function islLocalH(D,x,z){const fx=(x+D.half)/D.dx,fz=(z+D.half)/D.dx,i=Math.floor(fx),j=Math.floor(fz);crW(fx-i,_wx);crW(fz-j,_wz);let s=0;const nx=D.nx;   /* bicubic, as rubble/terrain.js */
  for(let b=0;b<4;b++){const jj=clamp(j-1+b,0,nx-1)*nx;let r=0;for(let a=0;a<4;a++)r+=_wx[a]*D.hF[jj+clamp(i-1+a,0,nx-1)];s+=_wz[b]*r;}return s;}
function worldToLocal(I,x,z){const dx=x-I.cx,dz=z-I.cz,c=Math.cos(I.rot),s=Math.sin(I.rot);return [dx*c+dz*s,-dx*s+dz*c];}
function meshH(x,z){const D=islandData();if(!D)return -40;let best=-40;
  for(const I of ISLS){const l=worldToLocal(I,x,z),m=Math.max(Math.abs(l[0]),Math.abs(l[1]));if(m>=D.half)continue;
    const h=islLocalH(D,l[0],l[1]),f=sm((m-100)/28),v=lerp(h,-40,f);if(v>best)best=v;}return best;}
function groundClass(x,z){const D=islandData();if(!D)return 0;let c=0,bm=1e9;
  for(const I of ISLS){const l=worldToLocal(I,x,z),m=Math.max(Math.abs(l[0]),Math.abs(l[1]));if(m>=D.half||m>=bm)continue;bm=m;
    const k=clamp(Math.round((l[1]+D.half)/D.dx),0,D.nx-1)*D.nx+clamp(Math.round((l[0]+D.half)/D.dx),0,D.nx-1);c=D.g[k];}return c;}
const WF={H:null,gc:null,shd:null,PH1:null,PH2:null,windKey:-999,texA:null,texB:null,ready:false};
function wfH(x,z){const q=WF.H;const fx=(x-WG.x0)/WG.cell,fz=(z-WG.z0)/WG.cell;if(fx<0||fz<0||fx>=WG.n-1||fz>=WG.n-1)return -40;
  const i=Math.floor(fx),j=Math.floor(fz),ax=fx-i,az=fz-j,n=WG.n,a=q[j*n+i],b=q[j*n+i+1],c=q[(j+1)*n+i],d=q[(j+1)*n+i+1];return (a+(b-a)*ax)*(1-az)+(c+(d-c)*ax)*az;}
function wfB(arr,x,z){const fx=(x-WG.x0)/WG.cellB,fz=(z-WG.z0)/WG.cellB,n=WG.nb;if(fx<0||fz<0||fx>=n-1||fz>=n-1)return 0;
  const i=Math.floor(fx),j=Math.floor(fz),ax=fx-i,az=fz-j,a=arr[j*n+i],b=arr[j*n+i+1],c=arr[(j+1)*n+i],d=arr[(j+1)*n+i+1];return (a+(b-a)*ax)*(1-az)+(c+(d-c)*ax)*az;}
function wfShadow(x,z){const n=WG.n;const fx=(x-WG.x0)/WG.cell,fz=(z-WG.z0)/WG.cell;if(fx<0||fz<0||fx>=n-1||fz>=n-1)return 0;
  const i=Math.floor(fx),j=Math.floor(fz),ax=fx-i,az=fz-j,q=WF.shd,a=q[j*n+i],b=q[j*n+i+1],c=q[(j+1)*n+i],d=q[(j+1)*n+i+1];return (a+(b-a)*ax)*(1-az)+(c+(d-c)*ax)*az;}
function nIndex(D,k0){let k=k0/Math.sqrt(Math.max(Math.tanh(Math.min(k0*D,6)),0.02));for(let it=0;it<14;it++){const t=Math.max(Math.tanh(Math.min(k*D,6)),0.02);k=.5*(k+k0/t);}return k/k0;}   /* refractive index n = k(d)/k0 from w^2 = g k tanh(k d), by a damped fixed-point step */
function buildWorld(){if(WF.ready)return true;const D=islandData();if(!D)return false;const n=WG.n,nb=WG.nb;

  const stormK=sm((P.wsKA-.03)/.12);U.uDebOn.value=(T.flotsam&&T.debris>0)?1:0;U.uDebAmt.value=.12+.38*stormK;U.uVK.value=P.vort;const tide=tideAt(t);U.uTide.value=tide;U.uLevel.value=P.surge+tide;{let ea=0;for(const w of W)ea+=w.A;U.uEnvA.value=ea*SWASHK*.8;}if(state.islandsOn)computeField(P.wind*Math.PI/180);U.uAmt.value=clamp((P.foam+P.streak)*.8,0,1)*sm((P.wsKA-.03)/.12);

/* ------------------------------------------------------------ camera: orbit / pan / zoom / fly, never under the sea ------------------------------------------------------------
   cam = { tx,ty,tz = look-at point, yaw, pitch, dist } in orbit mode; in free mode the same fields describe the pose (position = look-at point minus dist along the view, dist kept for the switch back).
   Until the first touch of the controls the old automatic framing runs (it also frames the whirlpool); Reset camera goes back to it. */
const cam={tx:0,ty:1.5,tz:0,yaw:state.cam,pitch:Math.atan2(6,22),dist:Math.hypot(22,6),px:0,py:0,pz:0};
const camKeys={};let camHit=0;
function camPose(){const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  if(state.free){return {x:cam.px,y:cam.py,z:cam.pz,fx:-cp*cy,fy:-sp,fz:-cp*sy};}
  return {x:cam.tx+cam.dist*cp*cy,y:cam.ty+cam.dist*sp,z:cam.tz+cam.dist*cp*sy,fx:-cp*cy,fy:-sp,fz:-cp*sy};}
function camFloor(x,z,t){return Math.max(seaHeight(state.W,x,z,t,state.P),groundAt(x,z))+0.5;}   /* the surface the camera may never go under: the CPU wave height plus half a metre */
function camReset(){state.user=false;state.free=false;state.follow=false;cam.yaw=state.cam;cam.pitch=Math.atan2(6,22);cam.dist=Math.hypot(22,6);syncCamButtons();}
function camSetFree(on){if(on===state.free)return;state.user=true;
  if(on){const p=camPose();cam.px=p.x;cam.py=p.y;cam.pz=p.z;state.free=true;state.follow=false;}
  else{const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);cam.tx=cam.px+cam.dist*cp*Math.cos(cam.yaw)*-1;cam.ty=cam.py+cam.dist*sp*-1;cam.tz=cam.pz+cam.dist*cp*Math.sin(cam.yaw)*-1;state.free=false;}
  syncCamButtons();}
function camRotate(dx,dy){state.user=true;cam.yaw-=dx*0.0052;cam.pitch=clamp(cam.pitch+dy*0.0052,-0.35,1.5);}
function camZoom(f){state.user=true;if(state.free){const p=camPose();const m=(f-1)*-cam.dist*0.6;cam.px+=p.fx*m;cam.py+=p.fy*m;cam.pz+=p.fz*m;}else cam.dist=clamp(cam.dist*f,1.5,1500);}
function camPan(dx,dy){state.user=true;const p=camPose();const rx=-Math.sin(cam.yaw),rz=Math.cos(cam.yaw);   /* screen right on the ground; up = world up */
  const sc=(state.free?Math.max(6,cam.py):cam.dist)*0.0016;const mx=-dx*sc,my=dy*sc;
  if(state.free){cam.px+=rx*mx;cam.pz+=rz*mx;cam.py+=my;}else{cam.tx+=rx*mx;cam.tz+=rz*mx;cam.ty=clamp(cam.ty+my,-2,300);state.follow=false;syncCamButtons();}}
function camFly(dt,t){let f=0,r=0,u=0;
  if(camKeys.w||camKeys.arrowup)f+=1;if(camKeys.s||camKeys.arrowdown)f-=1;if(camKeys.d||camKeys.arrowright)r+=1;if(camKeys.a||camKeys.arrowleft)r-=1;if(camKeys.e)u+=1;if(camKeys.q)u-=1;
  if(!f&&!r&&!u)return;state.user=true;const p=camPose();const h=Math.max(p.y,1);const sp=(4+1.4*h)*(camKeys.shift?4:1)*dt;   /* speed scales with height */
  const fl=Math.hypot(p.fx,p.fz)||1,fx=p.fx/fl,fz=p.fz/fl,rx=-fz,rz=fx;
  const mx=(fx*f+rx*r)*sp,mz=(fz*f+rz*r)*sp,my=u*sp;
  if(state.free){cam.px+=mx;cam.pz+=mz;cam.py+=my;}else{cam.tx+=mx;cam.tz+=mz;cam.ty=clamp(cam.ty+my,-2,300);state.follow=false;syncCamButtons();}}
function updateCamera(dt,t,P){
  if(!state.user){const ang=P.vort>.3?Math.atan2(0-VORT[1],0-VORT[0]):cam.yaw,rad=P.vort>.3?30:22,hgt=P.vort>.3?10:7.5;
    const ty=lerp(1.5,3,P.vort);cam.tx=lerp(0,VORT[0]*.55,P.vort*.9);cam.tz=lerp(0,VORT[1]*.55,P.vort*.9);cam.ty=ty;
    cam.yaw=ang;cam.dist=Math.hypot(rad,hgt-ty);cam.pitch=Math.atan2(hgt-ty,rad);}
  else{camFly(Math.min(dt,.1),t);if(state.follow&&boat&&!state.free){cam.tx=lerp(cam.tx,boat.position.x,.2);cam.ty=lerp(cam.ty,boat.position.y+1.2,.2);cam.tz=lerp(cam.tz,boat.position.z,.2);}}
  const p=camPose();let y=p.y;const fl=camFloor(p.x,p.z,t);camHit=0;if(y<fl){y=fl;camHit=1;}
  if(state.free){cam.py=Math.max(cam.py,fl);}
  camera.position.set(p.x,y,p.z);
  if(state.free)camera.lookAt(p.x+p.fx,y+p.fy,p.z+p.fz);else camera.lookAt(cam.tx,cam.ty,cam.tz);}
function syncCamButtons(){const f=document.getElementById('bFollow'),r=document.getElementById('bFree');if(f)f.classList.toggle('on',state.follow);if(r)r.classList.toggle('on',state.free);}
function camBeach(){state.user=true;state.free=false;state.follow=false;cam.tx=30;cam.ty=.4;cam.tz=30;cam.dist=36;cam.pitch=.2;cam.yaw=-Math.PI/2+.5;syncCamButtons();}
function camEvents(){const el=canvas,ptr=new Map();let lastPinch=0,lastMid=null;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId);}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey});el.style.cursor='grabbing';
    if(ptr.size===2){const a=[...ptr.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);lastMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}});
  el.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptr.size===1){if(p.b===2||p.b===1||p.sh||e.shiftKey)camPan(dx,dy);else camRotate(dx,dy);}
    else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
      if(lastPinch>0&&d>0)camZoom(lastPinch/d);if(lastMid)camPan(mid.x-lastMid.x,mid.y-lastMid.y);lastPinch=d;lastMid=mid;}});
  const up=e=>{ptr.delete(e.pointerId);lastPinch=0;lastMid=null;if(!ptr.size)el.style.cursor='grab';};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();camZoom(Math.exp(clamp(e.deltaY,-300,300)*0.0016));},{passive:false});
  window.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test((e.target&&e.target.tagName)||''))return;const k=e.key.toLowerCase();
    if(k==='shift'){camKeys.shift=true;return;}if('wasdqe'.includes(k)&&k.length===1||k.startsWith('arrow')){camKeys[k]=true;e.preventDefault();}});
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='shift')camKeys.shift=false;else delete camKeys[k];});
  window.addEventListener('blur',()=>{for(const k in camKeys)delete camKeys[k];});
  document.getElementById('bReset').onclick=camReset;
  const bI2=document.getElementById('bIsl'),bD=document.getElementById('bDrift');
  const syncI=()=>{bI2.classList.toggle('on',state.islands);bD.classList.toggle('on',state.drift);};
  bI2.onclick=()=>{state.islands=!state.islands;syncI();build();resize();};bD.onclick=()=>{state.drift=!state.drift;syncI();};
  document.getElementById('bBeach').onclick=camBeach;document.getElementById('bBack').onclick=resetBodies;syncI();
  if(Q.get('view')==='beach')camBeach();
  {const v=Q.get('look');if(v){const p=v.split(',').map(parseFloat);if(p.length>=5&&p.every(isFinite)){state.user=true;cam.tx=p[0];cam.ty=p[1];cam.tz=p[2];cam.dist=p[3];cam.pitch=p[4];if(p.length>5)cam.yaw=p[5];}}}
  document.getElementById('bFollow').onclick=()=>{if(state.free)camSetFree(false);state.user=true;state.follow=!state.follow;syncCamButtons();};
  document.getElementById('bFree').onclick=()=>camSetFree(!state.free);}

/* ------------------------------------------------------------ GPU readout: EXT_disjoint_timer_query_webgl2 around the render call, else a sampled gl.finish() ------------------------------------------------------------
   The timer gives the time the GPU spent on one frame's commands. It is not available in every browser (some switch it off for privacy), so the page says so and falls back to a sampled finish() time,
   which is rougher. "GPU busy" = GPU ms / 16.7 ms: an ESTIMATE of how much of a 60 Hz frame the GPU was working. */
const gl=renderer.getContext();
const GPU={ext:null,kind:'none',ms:0,n:0,pending:[],free:[],disjoint:0,frameBudget:1000/60,hist:[]};
try{if(isGL2){GPU.ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');if(GPU.ext)GPU.kind='timer';}}catch(e){}
if(!GPU.ext)GPU.kind='finish';

function gpuEnd(frameNo){if(GPU.kind==='timer'){if(GPU.cur){gl.endQuery(GPU.ext.TIME_ELAPSED_EXT);GPU.pending.push(GPU.cur);GPU.cur=null;}}
  else if(frameNo%6===0){const t0=performance.now();gl.finish();gpuPush(performance.now()-t0);}}
function gpuPush(ms){GPU.n++;GPU.ms=GPU.n===1?ms:GPU.ms*.85+ms*.15;GPU.hist.push(ms);if(GPU.hist.length>240)GPU.hist.shift();}
function gpuPoll(){if(GPU.kind!=='timer')return;
  while(GPU.pending.length){const q=GPU.pending[0];let ok=false;try{ok=gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);}catch(e){}if(!ok)break;
    GPU.pending.shift();let dis=false;try{dis=gl.getParameter(GPU.ext.GPU_DISJOINT_EXT);}catch(e){}
    if(!dis){const ns=gl.getQueryParameter(q,gl.QUERY_RESULT);if(ns>=0&&isFinite(ns))gpuPush(ns/1e6);}else GPU.disjoint++;GPU.free.push(q);}}
function gpuMean(n){const a=GPU.hist.slice(-(n||60));if(!a.length)return 0;let s=0;for(const v of a)s+=v;return s/a.length;}
function gpuSrcLabel(){return GPU.kind==='timer'?'GPU timer query':'sampled finish() (rough)';}

/* ------------------------------------------------------------ BENCH LADDER ------------------------------------------------------------
   One axis at a time from a light base (24k triangles, 8 waves, no spray, no debris, 1x resolution), about 6 s a rung; then one combined rung with every axis at its last good value.
   An axis stops at the first rung where the frame time is over 33 ms for 5 frames in a row (or a rung that ends with an average over 33 ms). If even the first rung of the first axis is over, the whole bench stops (software GL does this).
   An error (context lost, a shader error, an exception) stops it at once. Numbers are what this browser measured on this machine: nothing is assumed about any other device. */
const BASE={tris:24000,waves:8,spray:0,debris:0,scale:1,follow:1,flotsam:1,islands:0};
const AXES=[
 {id:'mesh',label:'Sea mesh',unit:'triangles',key:'tris',vals:[24000,100000,210000,500000,1000000,2000000]},
 {id:'waves',label:'Wave count',unit:'waves',key:'waves',vals:[8,24,48,96]},
 {id:'spray',label:'Spray particles',unit:'points',key:'spray',vals:[0,20000,100000,400000]},
 {id:'debris',label:'Debris points',unit:'points',key:'debris',vals:[0,5000,20000,100000]},
 {id:'islands',label:'Islands in the sea (2 islands, shoaling, refraction, swash, wave shadow)',unit:'off/on',key:'islands',vals:[0,1]},
 {id:'scale',label:'Render resolution',unit:'x scale',key:'scale',vals:[1,1.5,2,3]}];
const BQ={sec:parseFloat(Q.get('benchsec')||'6'),warm:parseFloat(Q.get('benchwarm')||'1.2'),limit:parseFloat(Q.get('benchlimit')||'33'),n:5,maxRungs:parseInt(Q.get('benchrungs')||'99',10),hardCap:parseFloat(Q.get('benchcap')||'25')};
const fmtV=(a,v)=>a.key==='tris'?(v>=1e6?v/1e6+'M':v/1e3+'k'):a.key==='scale'?v+'x':a.key==='islands'?(v?'on':'off'):(v>=1000?v/1000+'k':''+v);
const bench={running:false,rows:[],plan:[],i:-1,rung:null,stop:'',err:'',savedState:null,report:''};
function benchPlan(){const p=[];for(const a of AXES)a.vals.slice(0,BQ.maxRungs).forEach((v,j)=>p.push({axis:a,v,j}));p.push({axis:{id:'all',label:'Everything up (combined)',unit:'',key:'all'},v:0,j:0});return p;}
const benchBox=document.getElementById('benchBox');
function benchShow(html){benchBox.innerHTML=html;benchBox.style.display='block';}
function benchWarn(){benchShow('<h2>Bench: find this card\'s limit</h2><p>This pushes the graphics card hard for about '+Math.round(benchPlan().length*(BQ.sec+0.2)/60*10)/10+' minutes: sea meshes up to 2 million triangles, up to 96 waves, 400 thousand spray points and up to 3x resolution.</p>'+
  '<p>The picture will stutter and may flicker. On a weak machine the browser can lose the graphics context or the tab can freeze for a while. Close other heavy tabs first. Nothing is saved or sent anywhere.</p>'+
  '<p>It stops by itself when a rung is slower than '+BQ.limit+' ms a frame for '+BQ.n+' frames, or on an error, and then shows a report you can copy.</p>'+
  '<div class="bt"><button class="go" id="bbGo">Start</button><button id="bbNo">Cancel</button></div>');
  document.getElementById('bbGo').onclick=benchStart;document.getElementById('bbNo').onclick=()=>{benchBox.style.display='none';};}
function benchStart(){if(bench.running)return;
  bench.saved={type:state.type,s:state.s,user:state.user,free:state.free,follow:state.follow,cam:Object.assign({},cam),K:state.K,tier:state.tier,freeze:state.freeze,ui:document.getElementById('ui').style.display};
  bench.running=true;bench.rows=[];bench.plan=benchPlan();bench.i=-1;bench.stop='';bench.err='';bench.axisDone={};bench.good={};bench.skipAxis=null;
  state.type='gale';state.s=.85;state.user=false;state.free=false;state.follow=false;document.getElementById('ui').style.display='none';
  bench.errHook=window.addEventListener('error',benchOnErr);canvas.addEventListener('webglcontextlost',benchCtxLost);
  const ce=console.error;bench.ce=ce;console.error=function(){if(bench.running&&/shader|GL|WebGL/i.test(String([].slice.call(arguments).join(' ')).slice(0,400)))bench.err='GL error: '+String(arguments[0]).slice(0,120);return ce.apply(console,arguments);};
  benchNext();}
function benchOnErr(e){if(bench.running)bench.err='script error: '+(e&&e.message||'unknown');}
function benchCtxLost(){if(bench.running)bench.err='the graphics context was lost';}
function benchKnobsFor(item){const K=Object.assign({},BASE);
  if(item.axis.id==='all'){for(const a of AXES){const g=bench.good[a.id];if(g!==undefined)K[a.key]=g;}}else K[item.axis.key]=item.v;return K;}
function benchNext(){
  if(bench.err)return benchFinish();

  const it=bench.plan[bench.i],K=benchKnobsFor(it);bench.item=it;bench.K=K;
  try{state.K=K;build();resize();applyParams(state.t);}catch(e){bench.err='building the rung failed: '+e.message;return benchFinish();}
  bench.rung={t0:performance.now(),dts:[],over:0,maxOver:0,frames:0,gpuStart:GPU.hist.length,gpuStartN:GPU.n};
  bench.rung.gpuHistMark=GPU.n;bench.label=it.axis.label+(it.axis.id==='all'?'':': '+fmtV(it.axis,it.v)+' '+it.axis.unit);
  benchProgress();}
function benchProgress(){const r=bench.rung;if(!r)return;const el=(performance.now()-r.t0)/1000;
  const msg='Bench: rung '+(bench.i+1)+' of '+bench.plan.length+'\n'+bench.label+'\n'+Math.min(el,BQ.sec+BQ.warm).toFixed(0)+' s of '+(BQ.sec+BQ.warm).toFixed(0)+' s   (frame '+state.ms.toFixed(1)+' ms)';
  benchShow('<h2>Bench running</h2><pre>'+msg.replace(/</g,'&lt;')+'</pre><div class="bt"><button id="bbStop">Stop now</button></div>');
  document.getElementById('bbStop').onclick=()=>{bench.stop='stopped by you';benchEndRung(true);};}
let benchLastShown=0;
function benchOnFrame(dt){if(!bench.running||!bench.rung)return;const r=bench.rung,el=(performance.now()-r.t0)/1000;r.frames++;
  if(bench.err)return benchFinishRung(true);
  if(el>=BQ.warm&&r.frames>3){r.dts.push(dt);if(dt>BQ.limit){r.over++;if(r.over>r.maxOver)r.maxOver=r.over;}else r.over=0;}
  if(performance.now()-benchLastShown>700){benchLastShown=performance.now();benchProgress();}
  const measured=el-BQ.warm;
  if(r.maxOver>=BQ.n||(measured>=BQ.sec&&r.dts.length>=3)||el>BQ.hardCap+BQ.warm+BQ.sec)benchFinishRung(false);}
function benchFinishRung(errored){const r=bench.rung;bench.rung=null;const d=r.dts.slice().sort((a,b)=>a-b);let sum=0;for(const v of d)sum+=v;
  const avg=d.length?sum/d.length:0,p95=d.length?d[Math.min(d.length-1,Math.ceil(.95*d.length)-1)]:0,max=d.length?d[d.length-1]:0;
  const gh=GPU.hist.slice(-Math.max(1,Math.min(GPU.hist.length,d.length)));let gs=0;for(const v of gh)gs+=v;const gpu=GPU.n>r.gpuHistMark&&gh.length?gs/gh.length:-1;
  const bad=errored||r.maxOver>=BQ.n||(d.length>=3&&avg>BQ.limit);
  const T=state.T,row={axis:bench.item.axis,v:bench.item.v,label:bench.label,avg,p95,max,gpu,frames:d.length,bad,tris:state.tris,calls:state.calls,res:renderer.domElement.width+'x'+renderer.domElement.height,nW:T.nTot,spray:T.spray,debris:T.debris,meshTris:T.triCount};
  bench.rows.push(row);const id=bench.item.axis.id;
  if(id!=='all'){if(bad){bench.axisDone[id]=true;if(bench.item.j===0&&bench.i===0){bench.stop='even the smallest rung ('+bench.label+') is over '+BQ.limit+' ms a frame, so the bench stopped at once';return benchFinish();}}else bench.good[id]=bench.item.v;}
  if(errored||bench.err)return benchFinish();setTimeout(benchNext,60);}
function benchEndRung(){if(bench.rung)benchFinishRung(false);benchFinish();}
function benchFinish(){if(!bench.running)return;bench.running=false;bench.rung=null;console.error=bench.ce||console.error;window.removeEventListener('error',benchOnErr);canvas.removeEventListener('webglcontextlost',benchCtxLost);
  const sv=bench.saved;state.type=sv.type;state.s=sv.s;state.user=sv.user;state.free=sv.free;state.follow=sv.follow;Object.assign(cam,sv.cam);state.K=sv.K;document.getElementById('ui').style.display=sv.ui;

  bench.report=benchReport();benchShow('<h2>Bench report</h2><pre id="bbRep"></pre><div class="bt"><button class="go" id="bbCopy">Copy report</button><button id="bbMax">Use these limits for Radeon MAX</button><button id="bbClose">Close</button></div><p id="bbMsg" style="font-size:12px;opacity:.8"></p>');
  document.getElementById('bbRep').textContent=bench.report;
  document.getElementById('bbCopy').onclick=()=>benchCopy();document.getElementById('bbClose').onclick=()=>{benchBox.style.display='none';};
  document.getElementById('bbMax').onclick=()=>{const k=benchKnee();TIERS.max.tris=k.tris;TIERS.max.waves=k.waves;TIERS.max.spray=k.spray;TIERS.max.debris=k.debris;window.__setTier('max');document.getElementById('bbMsg').textContent='Radeon MAX now uses: '+k.tris+' triangles, '+k.waves+' waves, '+k.spray+' spray, '+k.debris+' debris.';};}
function benchKnee(){const k={tris:TIERS.max.tris,waves:TIERS.max.waves,spray:TIERS.max.spray,debris:TIERS.max.debris};   /* knee = the biggest rung that still held 55 fps on average (18 ms) with the 95th percentile under 25 ms */
  for(const a of AXES){let best=null;for(const r of bench.rows)if(r.axis.id===a.id&&!r.bad&&r.avg<=18&&r.p95<=25)best=r.v;if(best!==null&&a.key!=='scale'&&a.key!=='islands')k[a.key]=best;}return k;}
function benchReport(){const L=[],f=(v,n)=>typeof v==='number'&&isFinite(v)&&v>=0?v.toFixed(n===undefined?1:n):'n/a';
  L.push('SEA BENCH (Living Islands sea prototype)','renderer: '+(glName||'unknown (browser hides it)')+(isGL2?'  WebGL2':'  WEBGL1'),'GPU timer: '+(GPU.kind==='timer'?'EXT_disjoint_timer_query_webgl2 (GPU ms are per-frame GPU time)':'not available; GPU ms from a sampled finish() (rough)'),
    'page '+window.innerWidth+' x '+window.innerHeight+' css px, device pixel ratio '+(window.devicePixelRatio||1).toFixed(2),'rule: an axis stops when a rung is over '+BQ.limit+' ms for '+BQ.n+' frames; each rung '+BQ.sec+' s after '+BQ.warm+' s warm-up','base: 24k triangles, 8 waves, no spray, no debris, 1x, islands off; storm weather (gale, 0.85)');
  if(soft)L.push('NOTE: this is a SOFTWARE renderer. It stops early by itself, and its numbers say nothing about a real graphics card.');
  for(const a of AXES.concat([{id:'all',label:'Everything up (combined)',unit:'',key:'all'}])){const rows=bench.rows.filter(r=>r.axis.id===a.id);if(!rows.length)continue;L.push('','== '+a.label+(a.unit?' ('+a.unit+')':'')+' ==');
    for(const r of rows)L.push((a.id==='all'?'combined':fmtV(a,r.v)).padEnd(10)+' frame avg '+f(r.avg)+' ms, p95 '+f(r.p95)+', worst '+f(r.max)+'   GPU '+(r.gpu>=0?f(r.gpu,2)+' ms':'n/a')+'   '+r.meshTris.toLocaleString('en-US')+' mesh tris, '+r.nW+' waves, '+r.res+'   '+(r.bad?'OVER '+BQ.limit+' ms':'ok'));
    if(a.id!=='all'){const g=bench.good[a.id];L.push('last good rung: '+(g===undefined?'none (the first rung was already over the limit)':fmtV(a,g)+' '+a.unit));}}
  const k=benchKnee();L.push('','suggested Radeon MAX from the 55 fps knee: '+k.tris.toLocaleString('en-US')+' triangles, '+k.waves+' waves, '+k.spray.toLocaleString('en-US')+' spray, '+k.debris.toLocaleString('en-US')+' debris (an axis with no rung at 55 fps keeps the default)');
  L.push('','result: '+(bench.err?'stopped on an error: '+bench.err:bench.stop?bench.stop:'ran to the end'));
  const gp=bench.rows.filter(r=>r.gpu>=0);if(gp.length){const pk=gp.reduce((a,b)=>b.gpu>a.gpu?b:a);L.push('heaviest rung by GPU time: '+pk.label+' at '+f(pk.gpu,2)+' ms ('+Math.round(pk.gpu/16.7*100)+' percent of a 16.7 ms frame)');}
  return L.join('\n');}
function benchCopy(){const t=bench.report,msg=document.getElementById('bbMsg');
  const done=ok=>{if(msg)msg.textContent=ok?'Copied. Paste it into the chat.':'Could not copy by itself: select the text above and copy it.';};
  const fb=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);done(ok);}catch(e){done(false);}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>done(true),fb);else fb();}catch(e){fb();}}
document.getElementById('bBench').onclick=benchWarn;

/* ------------------------------------------------------------ frame ------------------------------------------------------------ */
let last=performance.now(),ema=0,frames=0;
function frame(now){
  const dt=now-last;last=now;ema=ema?ema*.9+dt*.1:dt;frames++;benchOnFrame(dt);
  const t=state.tFix!==null?state.tFix+(state.freeze?0:(now/1000-state.t0)):(now/1000-state.t0);state.t=t;
  U.uT.value=t;U.uT2.value=t;applyParams(t);const P=state.P;
  /* the boat holds its place; crates drift in a small ring; the hulk lies at the whirlpool's edge, listing */
  const yaw=P.wind*Math.PI/180+.5;driftBodies(dt/1000,P);const bb=bodies[0];placeBody(boat,state.W,bb.x,bb.z,bb.grounded?bb.yaw:yaw,4.4,1.6,t,P,.38,1,.30);
  crates.forEach((c,i)=>{const b=bodies[i+1];placeBody(c,state.W,b.x,b.z,b.yaw,.9,.9,t,P,.5,1,.18);});
  hulk.visible=P.vort>.05;if(hulk.visible){const hy=placeBody(hulk,state.W,VORT[0]+VORT[2]*1.15,VORT[1]+VORT[2]*.4,.9,16,5.4,t,P,.3,1);hulk.position.y=hy+.4;hulk.rotation.x+=.18*P.vort;hulk.scale.setScalar(1);}
  updateCamera(dt/1000,t,P);salvFrame(dt/1000,t,P);
  U.uCam.value.copy(camera.position);{const T=state.T;if(T&&T.follow)U.uMesh.value.set(Math.round(camera.position.x*2)/2,Math.round(camera.position.z*2)/2);else U.uMesh.value.set(0,0);}
  skyMesh.position.copy(camera.position);
  gpuBegin();renderer.render(scene,camera);gpuEnd(frames);gpuPoll();
  const inf=renderer.info.render;state.tris=inf.triangles;state.calls=inf.calls;state.ms=ema;
  if(frames%10===0)updateStats();
  requestAnimationFrame(frame);
}
let glName='';try{const e=renderer.getContext().getExtension('WEBGL_debug_renderer_info');if(e)glName=renderer.getContext().getParameter(e.UNMASKED_RENDERER_WEBGL);}catch(e){}
const soft=/swiftshader|llvmpipe|software/i.test(glName);
function busyLine(frameMs){
  if(!GPU.n)return 'GPU busy: waiting for the first timer result';
  const g=GPU.ms,pct=g/GPU.frameBudget*100,hz=frameMs<=GPU.frameBudget*1.12;let v;
  if(hz&&pct<75)v='limited by the 60 Hz display, the GPU has room';else if(pct>=85||g>=frameMs*.85)v='GPU-bound: the card is the limit';else v='not the GPU alone (CPU, driver or browser)';
  return (pct>100?'GPU needs about '+(pct/100).toFixed(1)+' x a 16.7 ms frame (over 100 percent: cannot hold 60 fps)':'GPU busy about '+Math.round(pct)+' percent of a 16.7 ms frame')+' (estimate from the GPU time)\n=> '+v;}
function updateStats(){const T=state.T||effTier(),P=state.P;
  const cv=renderer.domElement,pr=renderer.getPixelRatio();
  const lines=[T.name+'  |  '+TYPES[state.type].label,'waves '+state.W.length+' (swell '+T.nSw+', wind sea '+T.nWs+', chop '+T.nCh+' + '+T.rip+' pixel ripples)',
   'mesh '+T.rings+' x '+T.segs+'  spray '+T.spray+'  debris '+(P.vort>.05?T.debris:0)+' (points)',
   'triangles '+state.tris.toLocaleString()+'   draw calls '+state.calls,
   salvLine(),
   'frame '+state.ms.toFixed(1)+' ms  ('+(1000/Math.max(state.ms,.01)).toFixed(0)+' fps)'+(soft?'  (SOFTWARE GL, not a real GPU)':''),
   'GPU '+(GPU.n?GPU.ms.toFixed(2)+' ms':'not available')+'  ['+gpuSrcLabel()+(GPU.disjoint?', '+GPU.disjoint+' discarded':'')+']',
   busyLine(state.ms),
   'resolution '+cv.width+' x '+cv.height+' px  (page '+window.innerWidth+' x '+window.innerHeight+', pixel ratio '+pr.toFixed(2)+')',
   'renderer '+(glName||'unknown (browser hides it)')+(isGL2?'  WebGL2':'  WEBGL1!')];
  document.getElementById('stats').textContent=lines.join('\n');document.getElementById('sv').textContent=state.s.toFixed(2);}
function ui(){const sel=document.getElementById('type');for(const k in TYPES){const o=document.createElement('option');o.value=k;o.textContent=TYPES[k].label;sel.appendChild(o);}
  sel.value=state.type;sel.onchange=()=>{state.type=sel.value;};
  const sl=document.getElementById('s');sl.value=state.s;sl.oninput=()=>{state.s=parseFloat(sl.value);};
  const bI=document.getElementById('bI'),bR=document.getElementById('bR'),bM=document.getElementById('bM');
  function setTier(t){state.tier=t;state.K=null;bI.classList.toggle('on',t==='ipad');bR.classList.toggle('on',t==='radeon');bM.classList.toggle('on',t==='max');build();resize();}
  window.__setTier=setTier;bI.onclick=()=>setTier('ipad');bR.onclick=()=>setTier('radeon');bM.onclick=()=>setTier('max');setTier(state.tier);
  if(Q.get('ui')==='0')document.getElementById('ui').style.display='none';}
/* ------------------------------------------------------------ salvage: the real instanced models (salvage.js, salvage_world.js; research/VARIETY_AND_SALVAGE_PLAN.md) ------------------------------------------------------------
   They replace the debris and flotsam points (those come back only while the bench runs, so the bench numbers stay comparable). URL: &salv=0..2000 &rep=0..1 (variation) &size=0.6..3 &points=1 (old debris points). Spray stays as points. */
const SALV={w:null,on:Q.get('salv')!=='0'&&!!(window.LI_SALVAGE&&window.LI_SALVAGE.makeWorld),n:Q.get('salv')!==null?parseInt(Q.get('salv'),10):null,rep:Q.get('rep')!==null?parseFloat(Q.get('rep')):1,size:Q.get('size')!==null?parseFloat(Q.get('size')):1.35,kit:null,mats:null,key:'',settled:false};
const SALV_N={ipad:400,radeon:800,max:1200};
function salvEnv(){return {seaH:(x,z,t)=>seaHeight(state.W,x,z,t,state.P),ground:groundAt,gclass:(x,z)=>(state.islandsOn&&WF.ready)?groundClass(x,z):0,tide:tideAt,shadow:(x,z)=>(state.islandsOn&&WF.ready)?wfShadow(x,z):0,wind:()=>state.P.wind*Math.PI/180,storm:()=>sm((state.P.wsKA-.03)/.12),
  vort:()=>state.P.vort>.05?{x:VORT[0],z:VORT[1],R:VORT[2],k:state.P.vort}:null,islands:()=>state.islandsOn&&WF.ready,isl:ISLS,time:()=>state.tFix!==null?state.tFix:(state.t||0)};}
function salvBuild(){if(!SALV.on)return;const S=window.LI_SALVAGE;if(!SALV.kit){SALV.kit=S.makeKit(THREE);SALV.mats=S.makeMaterials(THREE);}
  if(SALV.w){SALV.w.dispose();SALV.w=null;}if(bench.running||!state.P)return;
  SALV.w=S.makeWorld({THREE,scene,kit:SALV.kit,mats:SALV.mats,env:salvEnv(),variation:SALV.rep,size:SALV.size,lodK:(state.T&&state.T.refract===0)?.6:1});
  if(SALV.n===null)SALV.n=SALV_N[state.tier]||400;
  SALV.w.setCount(SALV.n);salvSync();}
/* the boat and crates are unlit basic materials: keep them out of the new fog */
let salvFogFix=false;function salvFogOff(){if(salvFogFix||!boat)return;salvFogFix=true;[boat,hulk].concat(crates).forEach(g=>{if(g)g.traverse(o=>{if(o.material)o.material.fog=false;});});}
function salvSync(){const g=id=>document.getElementById(id);if(!g('sN'))return;g('sN').value=SALV.n;g('sNv').textContent=SALV.n;g('sV').value=SALV.rep;g('sVv').textContent=SALV.rep.toFixed(2);g('sK').value=SALV.size;g('sKv').textContent=SALV.size.toFixed(2);
  g('bSalv').textContent=SALV.on?'Salvage on':'Salvage off';}
function salvFrame(dt,t,P){salvFogOff();if(SALV.on&&!SALV.w&&!bench.running)salvBuild();const w=SALV.w;if(debPts)debPts.visible=!!(bench.running||Q.get('points')==='1'||!SALV.on||!w);
  if(!w)return;const show=SALV.on&&!bench.running;w.setVisible(show);if(!show)return;
  w.updateLights(P,U.uSunDir.value);if(!state.freeze)w.step(dt,t);w.render(t,camera);}
function salvLine(){const w=SALV.w;if(!SALV.on||!w)return 'salvage models: off (debris points)';const s=w.stats();return 'salvage models: '+s.tot+' ('+s.drawn+' drawn, '+s.rafts+' rafts, '+s.beach+' on the beach, '+s.aground+' aground), '+s.calls+' calls, '+Math.round(s.tris/1000)+'k tris, repetition '+(s.repetition*100).toFixed(0)+' percent';}
function salvUi(){const g=id=>document.getElementById(id);
  g('sN').oninput=()=>{SALV.n=parseInt(g('sN').value,10);g('sNv').textContent=SALV.n;if(SALV.w)SALV.w.setCount(SALV.n);};
  g('sV').oninput=()=>{SALV.rep=parseFloat(g('sV').value);g('sVv').textContent=SALV.rep.toFixed(2);if(SALV.w)SALV.w.setVariation(SALV.rep);};
  g('sK').oninput=()=>{SALV.size=parseFloat(g('sK').value);g('sKv').textContent=SALV.size.toFixed(2);if(SALV.w)SALV.w.setSize(SALV.size);};
  g('bSalv').onclick=()=>{SALV.on=!SALV.on&&!!(window.LI_SALVAGE&&window.LI_SALVAGE.makeWorld);if(SALV.on&&!SALV.w)salvBuild();salvSync();};}
ui();salvUi();salvSync();buildBoat();camEvents();resize();requestAnimationFrame(frame);
window.__sea={salvage:()=>SALV.w,salv:SALV,bodies,groundAt,tideAt,WF,WG,bench,benchStart,benchWarn,effTier,state,GPU,gpuMean,busyLine,updateStats,glName:()=>glName,TYPES,TIERS,cam,camPose,camKeys,camFloor:(x,z)=>camFloor(x,z,state.t),camera,seaHeight:(x,z,t)=>seaHeight(state.W,x,z,t===undefined?state.t:t,state.P),ready:true};
})();
