<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brick Lab</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;}body{background:#2a1c12;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff3df;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
.btn{background:rgba(58,40,26,.92);color:#fff3df;border:2px solid rgba(255,243,223,.5);border-radius:14px;padding:11px 16px;font-weight:700;font-size:17px;cursor:pointer;font-family:inherit;min-height:48px;touch-action:manipulation}
.btn.on{background:#e8842c;border-color:#ffd9a8}.btn.go{background:#e8842c;border-color:#ffd9a8}
#top{position:fixed;left:8px;right:8px;top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
#top .btn,#top .pill{pointer-events:auto}
.pill{background:rgba(58,40,26,.9);border-radius:16px;padding:8px 14px;font-weight:700;font-size:16px}
#stats{position:fixed;right:8px;top:8px;text-align:right;font:700 15px ui-monospace,Menlo,monospace;background:rgba(40,27,17,.85);border-radius:12px;padding:8px 12px;pointer-events:none;white-space:pre;line-height:1.35}
#bot{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
#bot .btn{pointer-events:auto}
#buildbar{display:none}
#msg{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:92px;font-weight:800;color:#fff3df;text-shadow:0 5px 0 #3a281a,0 0 24px rgba(0,0,0,.5);pointer-events:none;display:none;white-space:nowrap}
#hint{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#fff8ea;color:#3a281a;border:3px solid #3a281a;border-radius:14px;padding:8px 16px;font-size:18px;font-weight:800;pointer-events:none;text-align:center;max-width:86vw}
#pull{position:fixed;display:none;pointer-events:none;width:30px;height:132px;border-radius:15px;border:3px solid #fff3df;background:#3a2a1c;box-shadow:0 3px 10px rgba(0,0,0,.5);font:700 13px system-ui,sans-serif;color:#fff3df}
#pull .sw{position:absolute;left:0;right:0;background:#5fd04a;opacity:.55}#pull .fl{position:absolute;left:3px;right:3px;bottom:0;height:0;background:#ffd23a;border-radius:10px}
#pull .tx{position:absolute;left:40px;top:50%;white-space:nowrap;text-shadow:0 1px 3px #000}
#bench{position:fixed;inset:0;display:none;background:#241710;overflow:auto;z-index:20}
#bench .in{max-width:1100px;margin:0 auto;padding:16px 18px 40px}
#bench h1{font-size:46px;margin:6px 0 4px}
#bench .sub{font-size:22px;opacity:.9;margin:2px 0 12px}
#bench table{border-collapse:collapse;width:100%;font-size:30px}
#bench th{font-size:20px;text-align:right;padding:6px 8px;color:#ffd9a8;border-bottom:3px solid #ffd9a8}
#bench th:first-child,#bench td:first-child{text-align:left}
#bench td{padding:10px 8px;text-align:right;border-bottom:1px solid rgba(255,243,223,.25);font-weight:800}
#bench td.g{color:#bff0b6}#bench td.y{color:#ffe27a}#bench td.r{color:#ff9a8a}
#bench .big{font-size:34px;font-weight:800;margin:14px 0 6px}
#bench .note{font-size:19px;opacity:.85;margin:8px 0;line-height:1.35}
#bench .prog{font-size:30px;font-weight:800;color:#ffd23a;margin:10px 0}
#bench pre{font-size:13px;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.4);padding:8px;border-radius:8px;-webkit-user-select:text;user-select:text}
#txt{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,18,10,.7);z-index:15}
#txt .card{background:rgba(58,40,26,.97);border:3px solid #ffd9a8;border-radius:20px;padding:16px;width:min(92vw,640px)}
#txt textarea{width:100%;height:42vh;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
@media (max-width:760px){.btn{font-size:15px;padding:9px 11px}#stats{font-size:12px}#msg{font-size:60px}}

<div style="display:flex;gap:8px"><button class="btn" id="cL">&#9664;</button><button class="btn" id="cR">&#9654;</button><button class="btn" id="cIn">+</button><button class="btn" id="cOut">&minus;</button></div></div>
<div id="txt"><div class="card"><div style="font-size:20px;font-weight:800;margin-bottom:6px">A base as text: one piece per line, type x y z rotation(qx qy qz qw)</div><textarea id="ta"></textarea><div style="display:flex;gap:8px;margin-top:8px;justify-content:center"><button class="btn go" id="tLoad">Load this text</button><button class="btn" id="tClose">Close</button></div></div></div>
<div id="bench"><div class="in"></div></div>

    $('stats').textContent = 'pieces ' + sim.pieces.length + '   awake ' + sim.awake() + '\nmoved ' + stat.moved + '   fallen ' + stat.fallen + '\nphysics ' + pa.toFixed(2) + ' ms (max ' + pm.toFixed(1) + ')\nframe ' + fa.toFixed(1) + ' ms  ' + (1000 / Math.max(1, fa)).toFixed(0) + ' fps' + (slow.cur < 0.9 ? '\nSLOW-MO' : '');
  }

    camera: function (o) { for (var k in o) camS[k] = o[k]; },

  if (BENCH) { bench = new Bench(BKEYS); bench.start(); }
  else buildPreset(Q.get('preset') && BL.PRESETS[Q.get('preset')] ? Q.get('preset') : 'wall');
