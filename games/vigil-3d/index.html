<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vigil 3D</title>
<style>
:root{
  --bg:#12101c; --panel:rgba(18,20,38,.9); --line:rgba(255,255,255,.14);
  --ink:#f4f1ea; --dim:#a9a6b8;
  --you:#3d8bff; --youd:#1f4fa8; --foe:#ff7a2e; --foed:#9a3a0e;
  --gold:#ffd24a; --ok:#58e08c; --bad:#ff4d4d;
  --gut:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#top{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) max(var(--gut),env(safe-area-inset-right)) 0 max(var(--gut),env(safe-area-inset-left));display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
.chip{pointer-events:auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:24px;background:var(--panel);border:2px solid var(--line);font-size:22px;font-weight:800;backdrop-filter:blur(6px)}
.chip svg{font-size:26px}
.chip.hive{color:#ffb98a}
.chip.pad{color:var(--gold)}
#topL,#topR{display:flex;gap:8px;flex:1;align-items:center}
#topR{justify-content:flex-end}
#banner{pointer-events:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 26px;border-radius:30px;font-size:28px;font-weight:900;letter-spacing:.02em;background:var(--you);border:3px solid #fff;color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.45);transition:background .25s,transform .25s}
#banner svg{font-size:32px}
#banner.foe{background:var(--foe)}
#banner.drn{background:#7b6cf0}
#banner.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{transform:scale(.8);opacity:.2}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;animation:rise 1.4s ease-out forwards;white-space:nowrap}
.pop.dmg{color:#ff6b5a}.pop.heal{color:var(--ok)}.pop.miss{color:#cfd3e6;font-size:20px}.pop.hive{color:#ffb98a;font-size:20px}
@keyframes rise{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.pct{position:absolute;transform:translate(-50%,-50%);font-size:15px;font-weight:900;color:#c6fff3;text-shadow:0 1px 0 #000,0 0 6px #000}
.atk{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;padding:3px 9px 3px 6px;border-radius:14px;background:rgba(150,20,20,.92);border:2px solid #ffb0a0;font-size:16px;font-weight:900;color:#fff;white-space:nowrap}
.atk svg{font-size:16px}
#toast{display:none}

#dice{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;gap:8px;z-index:6;pointer-events:none}
.die{width:46px;height:46px;border-radius:10px;background:#efe6d0;border:3px solid #1a1410;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;gap:1px;animation:tumble .45s ease-out;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.die i{border-radius:50%;background:transparent}
.die i.on{background:#1a1410}
.die.hit{background:#ffe27a;border-color:#7a4a00;box-shadow:0 0 18px #ffb300}
.die.miss{opacity:.55}
@keyframes tumble{0%{transform:translateY(-70px) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px max(var(--gut),env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(var(--gut),env(safe-area-inset-left));display:flex;gap:12px;align-items:stretch;background:linear-gradient(0deg,rgba(10,9,20,.92),rgba(10,9,20,.55) 80%,transparent)}
#squad{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
#squad::-webkit-scrollbar{display:none}
.unit{flex:none;position:relative;width:78px;min-height:92px;border-radius:16px;background:var(--panel);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 4px}
.unit.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,74,.35),0 0 18px rgba(255,210,74,.5);transform:translateY(-4px)}
.unit.gone{opacity:.35}
.unit.drone{width:66px;border-style:dashed}
.unit .k{position:absolute;left:6px;top:3px;font-size:13px;color:var(--dim);font-weight:800}
.unit .ic{font-size:34px;color:#cfe3ff}
.unit.drone .ic{color:#c9c2ff}
.unit .ord{position:absolute;right:3px;top:3px;min-width:30px;height:26px;border-radius:13px;background:#2a2d4a;font-size:13px;font-weight:900;color:#fff;padding:0 6px}
.hp{display:flex;gap:3px}
.hp i{width:11px;height:11px;border-radius:50%;background:var(--ok);border:1.5px solid #0a2a14}
.hp i.e{background:#2a2d3c;border-color:#555a70}
.ap{display:flex;gap:4px}
.ap i{width:14px;height:6px;border-radius:3px;background:var(--gold)}
.ap i.e{background:#3a3d52}
.st{position:absolute;right:5px;bottom:4px;font-size:18px}
#acts{display:flex;gap:10px;align-items:stretch}
.btn{min-width:68px;min-height:68px;border-radius:20px;background:#2b3050;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:34px;color:#fff;position:relative}
.btn:disabled{opacity:.3}
.btn.on{background:#3b6dff;border-color:#fff}
.btn.end{min-width:120px;background:var(--you);border-color:#fff;font-size:22px;font-weight:900;padding:0 18px}
.btn.end svg{font-size:36px}
.btn.end:disabled{background:#33385a}
.btn.heal{color:var(--ok)}
.btn.ext{color:var(--gold)}
.btn small{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.04em}
.btn .tag{position:absolute;top:-8px;right:-4px;font-size:14px;background:#0008;border-radius:10px;padding:1px 6px}

#help{position:fixed;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;gap:14px;padding:8px 18px;border-radius:26px;background:var(--panel);border:2px solid var(--line);font-size:26px;color:#fff;transition:opacity .4s}
#help svg{font-size:30px}

#end{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(8,6,16,.78);backdrop-filter:blur(4px)}
#end[hidden]{display:none}
.card{background:#1b1d36;border:3px solid #fff;border-radius:28px;padding:28px 34px;text-align:center;max-width:min(92vw,460px)}
.card h1{margin:0 0 14px;font-size:40px;font-weight:900}
.card .row{display:flex;gap:22px;justify-content:center;margin:12px 0 22px;font-size:30px;font-weight:900}
.card .row span{display:flex;align-items:center;gap:8px}
.card .row svg{font-size:34px}
.card .go{min-width:200px;min-height:76px;border-radius:38px;background:var(--you);border:3px solid #fff;color:#fff;font-size:30px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.card .go svg{font-size:38px}

@media (max-aspect-ratio:1/1){
  #dock{flex-direction:column;gap:6px}
  #acts{justify-content:space-between}
  .btn{flex:1;min-width:0}
  .btn.end{flex:2}
  #banner{font-size:24px;padding:0 20px;min-height:52px}
  #topL,#topR{flex:none}
  #top{flex-wrap:wrap;justify-content:center}
  #banner{order:-1;width:100%;justify-content:center}
}
@media (max-height:560px){
  .unit{min-height:76px;width:66px}.unit .ic{font-size:26px}
  .btn{min-height:58px;min-width:58px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2"/></symbol>

    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></symbol>

    <symbol id="i-hold" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"/></symbol>
  </defs>
</svg>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="dice"></div>
<div id="toast"></div>
<div id="top">
  <div id="topL">
    <div class="chip" title="Round"><svg class="i"><use href="#i-flag"/></svg><b id="roundN">1</b></div>
    <div class="chip pad" title="Out"><svg class="i"><use href="#i-up"/></svg><b id="extN">0/6</b></div>
  </div>
  <div id="banner"><svg class="i"><use href="#i-person"/></svg><span id="bannerT">Your turn</span></div>
  <div id="topR">
    <div class="chip hive" title="The hive reads you"><svg class="i"><use href="#i-bug"/></svg><b id="hiveN">…</b></div>
    <button class="chip" id="homeBtn" aria-label="Whole board"><svg class="i"><use href="#i-home"/></svg></button>
  </div>
</div>
<div id="dock">
  <div id="squad"></div>
  <div id="acts">
    <button class="btn" id="owBtn" aria-label="Watch"><svg class="i"><use href="#i-eye"/></svg><small>WATCH</small></button>
    <button class="btn heal" id="healBtn" aria-label="Heal" hidden><svg class="i"><use href="#i-plus"/></svg><small>HEAL</small></button>

  </div>
</div>
<div id="end" hidden>
  <div class="card">
    <h1 id="eTitle">Done</h1>
    <div class="row"><span><svg class="i"><use href="#i-up"/></svg><b id="eExt">0</b></span><span><svg class="i"><use href="#i-skull"/></svg><b id="eKills">0</b></span><span><svg class="i"><use href="#i-flag"/></svg><b id="eRounds">0</b></span></div>
    <button class="go" id="again"><svg class="i"><use href="#i-replay"/></svg>AGAIN</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

(() => {
"use strict";
/* ================= Vigil 3D =================
   The rules and turn logic in the middle of this file are copied from games/vigil/index.html,
   unchanged except for the places marked "3D port". Only the picture and the touch controls are new.
   Math.random is used ONLY by the rules (dice, spawns, tie-breaks), in the same order as the 2D game.
   Anything cosmetic uses vr(), a separate little generator, so a seeded Math.random replays the same game. */
const W = 22, H = 22;
const $ = id => document.getElementById(id);
const C = c => new THREE.Color(c);
let _cs = 12345;
const vr = (a = 0, b = 1) => { _cs = (_cs * 1664525 + 1013904223) >>> 0; return a + (_cs / 4294967296) * (b - a); };
const rand = vr;
const noop = () => {};
const sfx = new Proxy({}, { get: () => noop });
const tone = noop, noise = noop;
const SVG = (id, cls = "") => `<svg class="i ${cls}"><use href="#${id}"/></svg>`;

/* ---- renderer, scene, camera ---- */
const TOUCH = matchMedia("(pointer: coarse)").matches;
const cv = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, TOUCH ? 1.5 : 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = C("#2a2018");
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 220);
const GRAD = (() => { const t = new THREE.DataTexture(new Uint8Array([120, 190, 245]), 3, 1, THREE.LuminanceFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (col, o = {}) => new THREE.MeshToonMaterial(Object.assign({ color: C(col), gradientMap: GRAD }, o));
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x7a6350, 0.5));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.55);
sun.position.set(-9, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -15; sun.shadow.camera.right = 15; sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15; sun.shadow.camera.near = 4; sun.shadow.camera.far = 50; sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fb8ff, 0.3); fill.position.set(10, 7, -12); scene.add(fill);

/* ---- ink outline (inverted hull) ---- */
const INK = 0x120d1c;
const inkN = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { thick: { value: 0.024 } },
  vertexShader: "uniform float thick; void main(){ vec3 p = position + normalize(normal) * thick; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }",
  fragmentShader: "void main(){ gl_FragColor = vec4(0.07, 0.05, 0.11, 1.0); }" });
const inkB = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
function addInk(parent, m, t = 0.024) {
  const g = m.geometry, box = g.type === "BoxGeometry";
  const h = new THREE.Mesh(g, box ? inkB : inkN);
  h.position.copy(m.position); h.rotation.copy(m.rotation); h.scale.copy(m.scale);
  if (box) { const p = g.parameters; h.scale.set(m.scale.x * (p.width + 2 * t) / p.width, m.scale.y * (p.height + 2 * t) / p.height, m.scale.z * (p.depth + 2 * t) / p.depth); }
  h.userData.hull = true; parent.add(h); return h;
}

/* ---- the table and the board ---- */
const GY = 0.08;   /* the standing level of every unit */
const table = new THREE.Mesh(new THREE.PlaneGeometry(120, 120).rotateX(-Math.PI / 2), toon("#5a4636"));
table.position.y = -0.62; table.receiveShadow = true; scene.add(table);
const tableTex = (() => {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512; const x = c.getContext("2d");
  x.fillStyle = "#6a5240"; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(${vr() < 0.5 ? "30,18,10" : "150,115,80"},${vr(0.05, 0.14)})`; x.fillRect(0, vr(0, 512), 512, vr(2, 9)); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(8, 8); return t;
})();
table.material.map = tableTex;
const frameMat = toon("#7a5232");
const tframe = new THREE.Mesh(new THREE.BoxGeometry(W + 1.2, 0.5, H + 1.2), frameMat); tframe.position.y = -0.4; tframe.castShadow = tframe.receiveShadow = true; scene.add(tframe); addInk(scene, tframe, 0.03);
const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 0.1, 0.2, H + 0.1), toon("#241c34")); slab.position.y = -0.08; slab.receiveShadow = true; scene.add(slab);


/* ---- the city as a diorama: instanced tiles, with a little height ---- */
let cityKinds = [], cityGroup = null, tileTop = new Float32Array(W * H);
const tileInst = {};   /* name -> { mesh, tiles:[k], base:[Color] } */
const BOXG = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const FOGC = C("#161426");
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function instBox(name, list, mat, hull) {
  /* list: [{k, x, y, z, sx, sy, sz, ry, col}] */
  const mesh = new THREE.InstancedMesh(BOXG, mat, Math.max(1, list.length)); mesh.count = list.length;
  mesh.castShadow = true; mesh.receiveShadow = true;
  const inst = { mesh, tiles: list.map(o => o.k), base: list.map(o => C(o.col)) };
  list.forEach((o, i) => {
    _q.setFromEuler(_e.set(0, o.ry || 0, 0)); _m4.compose(_v.set(o.x, o.y, o.z), _q, _s.set(o.sx, o.sy, o.sz)); mesh.setMatrixAt(i, _m4);
    mesh.setColorAt(i, inst.base[i]);
  });
  mesh.instanceMatrix.needsUpdate = true; cityGroup.add(mesh); tileInst[name] = inst;
  if (hull) {
    const h = new THREE.InstancedMesh(BOXG, inkB, Math.max(1, list.length)); h.count = list.length; const t = 0.03;
    list.forEach((o, i) => { _q.setFromEuler(_e.set(0, o.ry || 0, 0)); _m4.compose(_v.set(o.x, o.y - t, o.z), _q, _s.set(o.sx + 2 * t, o.sy + 2 * t, o.sz + 2 * t)); h.setMatrixAt(i, _m4); });
    h.instanceMatrix.needsUpdate = true; cityGroup.add(h);
  }
}
const instMat = () => toon("#ffffff");
const floorTone = { street: ["#d1bd92", "#c6b184"], inner: ["#a99a86", "#9d8e7a"], plaza: ["#b9bfc4", "#aab1b8"], crater: ["#a58f6e", "#9a8564"], rubble: ["#b8a27e", "#ad9873"], pad: ["#f0c64e", "#e6ba3c"], nest: ["#2a1a2e", "#2a1a2e"] };
const ROOFS = ["#c85a3e", "#4f7fae", "#d6a640", "#6e9a66", "#8c6aa8"];
const WALLS = ["#9aa6b8", "#b9a48c", "#8f9aa0", "#a8957f"];
let beam = null;
function buildCity() {
  if (cityGroup) { scene.remove(cityGroup); cityGroup.traverse(o => { if (o.isInstancedMesh) o.dispose(); }); }
  cityGroup = new THREE.Group(); scene.add(cityGroup);
  const R = mulberry(seed * 13 + 5), kindAt = new Array(W * H).fill(null);
  for (const kd of cityKinds) for (let y = kd.y0; y <= kd.y1; y++) for (let x = kd.x0; x <= kd.x1; x++) kindAt[key(x, y)] = kd;

  async overwatch() { const u = sel; if (!u) return false; const a = u.ap; overwatch(); return u.ap !== a; },
  async heal() { const u = sel; if (!u) return false; const a = u.ap; heal(); return u.ap !== a; },
  async extract() { const u = sel; if (!u) return false; const a = u.ap; await extract(); return u.out || u.ap !== a; },
  info(aid, tid) { const a = byId(aid), t = byId(tid); return a && t ? infoPlain(attackInfo(a, t)) : null; },
  reach(id) { const u = byId(id); if (!u) return null; return [...reach(u, u.mv).dist.keys()].sort((a, b) => a - b); },
  newGame(s) { $("end").hidden = true; newBattle(loadout, droneSel, s); return seed; },
  fast(on) { SPEED.v = on ? 0 : 1; return SPEED.v; },
  camera(o) { Object.assign(cam, o); cam.gd = null; if (o.tx != null) cam.gx = o.tx; if (o.tz != null) cam.gz = o.tz; return { ...cam }; },
  W, H, key,
};

/* ---- start ---- */
resize(); cam.dist = fitDist();
const urlP = new URLSearchParams(location.search);
if (urlP.get("fast")) SPEED.v = 0;
newBattle(loadout, droneSel, urlP.get("seed") ? +urlP.get("seed") : undefined);
requestAnimationFrame(frame);
})();
</script>
</body>
