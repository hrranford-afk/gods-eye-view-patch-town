<meta charset="utf-8">
<title>Baguettes &amp; Ballistics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
/* Layout: full-screen toy tabletop; HUD floats over it, thumb controls in the bottom corners. */
:root {
  --blue: #2f7df6;
  --red: #ef4136;
  --gold: #ffc23d;
  --ink: #1c1712;
  --paper: #fff8ec;
  --glass: rgba(28, 23, 18, 0.62);
  --display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: #3b2a1c; color: var(--paper);
  font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.basebar { display: grid; gap: 4px; min-width: 0; flex: 1; max-width: 260px; }
.basebar.red { text-align: right; }
.basebar .eco { font-size: 13px; font-weight: 700; color: var(--paper); opacity: 0.85; }
.basebar b { font-family: var(--display); font-size: 13px; letter-spacing: 0.04em; }
.bar { height: 10px; border-radius: 6px; background: var(--glass); overflow: hidden; border: 2px solid rgba(255, 248, 236, 0.25); }
.basebar .pct { font-variant-numeric: tabular-nums; }
.bar i { display: block; height: 100%; width: 100%; transition: width 0.2s; }
.blue .bar i { background: var(--blue); }
.red .bar i { background: var(--red); margin-left: auto; }
.mid { display: grid; justify-items: center; gap: 6px; }
.res { display: flex; gap: 16px; align-items: baseline; }
.cereal { font-family: var(--display); font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
.cereal.clips { color: #dfe3ea; }
.cereal.batt { color: #7dffb0; }
.bossbar { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 112px); left: 50%; transform: translateX(-50%); width: min(300px, 40vw); pointer-events: none; text-align: center; }
.bossbar b { font-family: var(--display); font-size: 13px; letter-spacing: 0.06em; color: var(--paper); text-shadow: 0 2px 0 var(--ink); }
.bossbar .bar i { background: #c8281f; }
.pips { display: flex; gap: 6px; }
.pips span { width: 14px; height: 14px; border-radius: 50%; background: #9a8f80; border: 2px solid var(--paper); }
.banner { position: fixed; z-index: 4; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font-family: var(--display); color: var(--gold, #ffc23d); text-shadow: 0 3px 0 #1c1712; font-size: clamp(26px, 5vw, 46px); line-height: 1.05; max-width: 90vw; }
.banner small { display: block; margin-top: 10px; font-family: var(--body); font-weight: 700; font-size: clamp(16px, 2.6vw, 22px); line-height: 1.3; color: #fff8ec; text-shadow: 0 2px 0 #1c1712; }
.bossArrow { position: fixed; z-index: 3; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #c8281f; filter: drop-shadow(0 2px 0 #1c1712); pointer-events: none; }
.toast { font-family: var(--display); font-size: 14px; color: var(--paper); text-shadow: 0 2px 0 var(--ink); min-height: 18px; text-align: center; }

.controls {
  position: fixed; right: 0; bottom: 0; z-index: 3; display: grid; justify-items: end; gap: 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; }
button {
  font: 700 15px/1 var(--body); color: var(--paper); background: var(--glass); border: 3px solid rgba(255, 248, 236, 0.4);
  border-radius: 16px; padding: 10px 12px; min-width: 64px; min-height: 52px; display: grid; justify-items: center; gap: 3px;
  touch-action: none; cursor: pointer;
}
button small { font-size: 12px; color: var(--gold); font-weight: 700; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button[disabled] { opacity: 0.4; }
button.fire { width: 104px; height: 104px; border-radius: 50%; font: 20px var(--display); background: rgba(239, 65, 54, 0.75); border-color: var(--paper); }
button.fire.on { background: var(--red); transform: scale(0.96); }

.garage {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 3; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: var(--glass); max-width: calc(100vw - 300px); overflow-x: auto;
}
.garage button { min-width: 74px; }
.garage button.cur { border-color: var(--blue); background: rgba(47, 125, 246, 0.55); }

.stick { position: fixed; z-index: 3; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 3px solid rgba(255, 248, 236, 0.45); background: rgba(28, 23, 18, 0.25); pointer-events: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255, 248, 236, 0.75); }
.hint { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 2; font-weight: 700; color: rgba(255, 248, 236, 0.7); pointer-events: none; }

.screen {
  /* Scrolls when the card is taller than the screen (long level text on a small screen pushed PLAY off the bottom). */
  position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; background: rgba(28, 23, 18, 0.72);
  overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-top: 16px; padding-bottom: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { margin: auto 0; max-width: 700px; display: grid; gap: 14px; text-align: center; justify-items: center; }
.card h1 { font: 44px/1 var(--display); margin: 0; color: var(--gold); text-shadow: 0 4px 0 var(--ink); text-wrap: balance; }
.card .sub { font: 14px var(--display); color: var(--paper); opacity: 0.8; letter-spacing: 0.06em; }
.card p { margin: 0; font-size: 18px; line-height: 1.4; max-width: 46ch; }
.card ul { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.5; display: grid; gap: 2px; }
.card .go { font: 24px var(--display); background: var(--blue); border-color: var(--paper); padding: 16px 30px; min-width: 200px; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.levels button { width: 100px; min-width: 0; min-height: 76px; padding: 8px 6px; font-size: 13px; line-height: 1.15; }
.levels button b { font: 20px var(--display); }
.levels button.cur { border-color: var(--gold); background: rgba(255, 194, 61, 0.28); }
.levels button.locked, .levels button.soon { opacity: 0.4; filter: grayscale(1); cursor: default; }
.stars { font: 30px var(--display); color: var(--gold); letter-spacing: 0.1em; text-shadow: 0 2px 0 var(--ink); }
.levels .stars { font-size: 15px; letter-spacing: 0.05em; }
.stars .off { color: rgba(255, 248, 236, 0.28); text-shadow: none; }
.card .two { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.card .go.alt { background: var(--glass); font-size: 18px; padding: 14px 20px; min-width: 120px; }
/* Level 1 race opening: race HUD, Drop button, arrow to the next gate. While racing, the build and fight buttons are hidden. */
.raceHud { display: grid; justify-items: center; gap: 6px; }
.raceHud .line { font: 15px var(--display); color: var(--gold); text-shadow: 0 2px 0 var(--ink); text-align: center; text-wrap: balance; }
.raceHud button { pointer-events: auto; min-height: 40px; padding: 6px 14px; font-size: 14px; }
body.racing .res, body.racing .pips { display: none; }
body.racing .controls .row:not(.raceRow) { display: none; }
button.drop { width: 104px; height: 104px; border-radius: 50%; font: 20px var(--display); background: rgba(255, 194, 61, 0.78); border-color: var(--paper); color: var(--ink); }
button.drop small { color: var(--ink); }
button.drop[disabled] { opacity: 0.45; }
.gateArrow { position: fixed; z-index: 3; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #ffc23d; filter: drop-shadow(0 2px 0 #1c1712); pointer-events: none; }
@media (max-width: 700px) { .garage { max-width: calc(100vw - 32px); bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); } .card h1 { font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
'use strict';
// ---------- World ----------
let W = 150, D = 96; // the tabletop, in toy units (1 unit ≈ 1 cm). Level 6 has a bigger one: setTableSize() swaps these in buildLevel; levels 1 to 5 stay 150 x 96
const BLUE = 0, RED = 1;
const COLORS = [0x2f7df6, 0xef4136];
const $ = (id) => document.getElementById(id);

// ---------- Graphics: the toy look (flags first; see HANDOVER.md "Graphics: the toy look") ----------
// Every flag can be switched off from the URL (?tilt=0&round=0&ao=0&env=0&clearcoat=0&fx=0&pr=1) or in the console (GFX.tiltShift = false).
const GFXQ = new URLSearchParams(location.search);
const gfxFlag = (k, d) => (GFXQ.has(k) ? GFXQ.get(k) !== '0' : d);
const GFX = {
  tiltShift: gfxFlag('tilt', true),   // miniature look: blurred top and bottom bands (one extra full-screen pass; the scene renders into a MSAA target)
  round: gfxFlag('round', true),      // rounded edges on box shapes (RoundedBoxGeometry, shared and cached)
  ao: gfxFlag('ao', true),            // dark soft blob under cars, units, turrets, props and boxes
  env: gfxFlag('env', true),          // a tiny made-in-code studio environment map: glossy plastic highlights
  clearcoat: gfxFlag('clearcoat', true), // MeshPhysicalMaterial clearcoat on the toy bodies (cars, units, turrets)
  fx: gfxFlag('fx', true),            // tyre dust, smoke puffs, debris, splashes, ring shimmer
  tiltAmount: 7,                      // blur radius at the very top and bottom (screen pixels at pixel ratio 1)
  pixelRatio: GFXQ.has('pr') ? +GFXQ.get('pr') : Math.min(window.devicePixelRatio || 1, 1.5), // an iPad is 2: 1.5 looks the same and costs 44% fewer pixels
};
window.GFX = GFX;
const renderer = new THREE.WebGLRenderer({ antialias: !GFX.tiltShift, powerPreference: 'high-performance' }); // with the tilt-shift pass the scene draws into its own MSAA target
renderer.setPixelRatio(GFX.pixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3b2a1c);
scene.fog = new THREE.Fog(0x3b2a1c, 90, 170);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 400);
// Warm kitchen key light (the sun, with soft shadows), a cool soft fill from the other side, and a hemisphere light for the bounce.
const KEY_COLOR = 0xffe2bc, FILL_I = 0.32;
const hemi = new THREE.HemisphereLight(0xfff0dc, 0x5a3d26, 0.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(KEY_COLOR, 1.1);
sun.position.set(-40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.35; // rounded shapes shade themselves cleanly
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 60, bottom: -60, near: 1, far: 200 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xa9c6ff, FILL_I);
fill.position.set(60, 40, -35);
scene.add(fill);

// A tiny studio made in code (a sky-to-brown gradient, three bright softboxes), baked once into an environment map: the glossy shine on the plastic.
let envTex = null;
function makeEnv() {
  const es = new THREE.Scene();
  const sg = new THREE.SphereGeometry(40, 24, 16), cols = [], c = new THREE.Color(), top = new THREE.Color(0.62, 0.72, 0.95), mid = new THREE.Color(1, 0.86, 0.68), bot = new THREE.Color(0.22, 0.15, 0.09);
  for (let i = 0; i < sg.attributes.position.count; i++) { const h = sg.attributes.position.getY(i) / 40; c.copy(mid).lerp(h > 0 ? top : bot, Math.pow(Math.abs(h), h > 0 ? 0.6 : 0.5)); cols.push(c.r, c.g, c.b); }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const box = (w, h, x, y, z, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.93, 0.8).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  box(26, 16, -20, 24, 14, 5); box(18, 10, 24, 20, -16, 3); box(30, 6, 0, 34, 0, 4);
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(es, 0.03);
  pm.dispose();
  es.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  return rt.texture;
}
try { if (GFX.env) { envTex = makeEnv(); scene.environment = envTex; } } catch (e) { envTex = null; }

// Post: the scene draws into a multisampled target, then one full-screen pass blurs the top and bottom bands (tilt-shift), with a touch of colour and a soft vignette.
const post = { on: false, rt: null, scene: new THREE.Scene(), cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), mat: null };
function gfxInitPost() {
  if (!GFX.tiltShift) return;
  try {
    post.mat = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: { tDiffuse: { value: null }, px: { value: new THREE.Vector2(1, 1) }, amount: { value: GFX.tiltAmount }, focus: { value: 0.46 }, band: { value: 0.2 }, sat: { value: 1.12 }, vig: { value: 0.28 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: `precision highp float; uniform sampler2D tDiffuse; uniform vec2 px; uniform float amount, focus, band, sat, vig; varying vec2 vUv;
        void main(){
          vec3 col = texture2D(tDiffuse, vUv).rgb;
          float r = smoothstep(band, band + 0.34, abs(vUv.y - focus)) * amount;
          if (r > 0.6) {
            float rot = 6.2831853 * fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
            vec3 acc = col; float ws = 1.0;
            for (int i = 0; i < 12; i++) {
              float a = float(i) * 2.3999632 + rot, rr = sqrt((float(i) + 0.5) / 12.0) * r;
              acc += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * rr * px).rgb; ws += 1.0;
            }
            col = acc / ws;
          }
          float l = dot(col, vec3(0.299, 0.587, 0.114));
          col = mix(vec3(l), col, sat);
          vec2 q = vUv - 0.5; col *= 1.0 - vig * dot(q, q) * 2.2;
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post.mat);
    quad.frustumCulled = false;
    post.scene.add(quad);
    post.on = true;
  } catch (e) { post.on = false; }
}
function gfxSize() {
  if (!post.on) return;
  const w = Math.max(1, Math.floor(innerWidth * GFX.pixelRatio)), h = Math.max(1, Math.floor(innerHeight * GFX.pixelRatio));
  if (post.rt) post.rt.dispose();
  const gl2 = renderer.capabilities.isWebGL2;
  post.rt = gl2 ? new THREE.WebGLMultisampleRenderTarget(w, h, { samples: 4 }) : new THREE.WebGLRenderTarget(w, h);
  post.rt.texture.encoding = THREE.sRGBEncoding; // the scene's shaders write sRGB straight into it; the blur pass just copies
  post.mat.uniforms.tDiffuse.value = post.rt.texture;
  post.mat.uniforms.px.value.set(1 / w * GFX.pixelRatio, 1 / h * GFX.pixelRatio);
}
function gfxRender() {
  if (!post.on || !post.rt) { renderer.render(scene, camera); return; }
  renderer.setRenderTarget(post.rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  post.mat.uniforms.amount.value = GFX.tiltShift ? GFX.tiltAmount : 0;
  renderer.info.autoReset = false; // keep the scene's counts: the blur pass is a second render() call
  renderer.render(post.scene, post.cam);
  renderer.info.autoReset = true;
}
gfxInitPost();

let meshParent = scene; // where mesh() puts things by default: the level's group while a level is being built
const mat = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.46, metalness: 0, envMapIntensity: 0.25, ...extra });
// Glossy toy plastic for bodies: clearcoat where it is cheap (few meshes), otherwise just low roughness.
const toy = (c, extra = {}) => GFX.clearcoat ? new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.4, metalness: 0, clearcoat: 0.7, clearcoatRoughness: 0.14, envMapIntensity: 0.5, ...extra }) : mat(c, { roughness: 0.3, ...extra });
// Shapes and colours made once and shared (shots, sparks, cereal loops): fresh ones each time ran iPads out of memory.
const SHARED = new Map();
function shared(key, make) { let v = SHARED.get(key); if (!v) { v = make(); if (v.userData) v.userData.shared = true; SHARED.set(key, v); } return v; }
function mesh(geo, material, x = 0, y = 0, z = 0, parent = meshParent) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Wood grain, drawn once to a canvas.
function woodTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#b07a4a'; g.fillRect(0, 0, 1024, 512);

const levelRoot = new THREE.Group();
scene.add(levelRoot);
const patches = [];
function buildLevel(L) {
  setTableSize(...(L.size || [150, 96])); // level 6 is bigger; everything else is 150 x 96 as before
  // Throw away the old level's shapes, then build this one's blocks and patches into a fresh group.
  scene.remove(levelRoot);
  levelRoot.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  levelRoot.clear();
  scene.add(levelRoot);
  obstacles.length = patches.length = erasers.length = ferries.length = 0;
  sink = null; torchPos = null; hobVis = null; finVis = null;
  setLighting(!!L.dark); // the drawer is dark; every other level gets its normal light back
  finaleLight(!!L.finale); // level 6: warm night kitchen (undoes itself on every other level)
  table.visible = !L.finale; // level 6 builds its own U-shaped worktop in finaleDecor
  table.material.color.setHex(L.tableColor);
  table.material.map = L.tableTex === 'mat' ? (matTex = matTex || matTexture()) : L.tableTex === 'tile' ? (tileTex = tileTex || tileTexture()) : L.tableTex === 'felt' ? (feltTex = feltTex || feltTexture()) : L.tableTex === 'hob' ? (hobTex = hobTex || hobTexture()) : woodTex;
  table.material.needsUpdate = true;
  meshParent = levelRoot;
  for (const b of L.blocks) block(...b);
  for (const e of L.erasers) makeEraser(...e);
  for (const p of L.patches) {
    patches.push(p);
    const look = p.kind === 'juice' ? mat(p.color || 0xff9f1c, { transparent: true, opacity: 0.7, roughness: 0.1, metalness: 0.2 })
      : p.kind === 'sauce' ? mat(0xb3261e, { transparent: true, opacity: 0.85, roughness: 0.25 })
      : p.kind === 'oil' ? mat(0xe8c547, { transparent: true, opacity: 0.45, roughness: 0.02, metalness: 0.4 })
      : mat(0xe8c89a, { transparent: true, opacity: 0.55 });
    const m = mesh(new THREE.CircleGeometry(p.r, 40), look, p.x, 0.03, p.z);
    m.rotation.x = -Math.PI / 2; m.castShadow = false;
  }
  if (L.decor) L.decor();
  meshParent = scene;
}
const patchAt = (x, z) => patches.find((p) => (x - p.x) ** 2 + (z - p.z) ** 2 < p.r * p.r)?.kind;

// ---------- Water (level 4, the sink) ----------
// A channel x0..x1 across the full depth. Wheels can't enter it except on the bridge (a ruler, bridge.w wide) or on a ferry;
// the Hover floats over it. Boats stay inside it. state.water is null on levels without water.
const ferries = [];
let sink = null; // moving look-only pieces of the sink: ripple texture, drip drop, splash rings
const inWaterX = (x, z, m = 0) => { const w = state.water; return !!w && x > w.x0 - m && x < w.x1 + m && (w.z0 === undefined || (z > w.z0 - m && z < w.z1 + m)); }; // anywhere across the channel, bridge included (level 6's channel only runs z0..z1)
const onFerry = (e) => { for (const f of ferries) if (Math.hypot(e.x - f.x, e.z - f.z) < f.R) return f; return null; };
const onIsland = (e) => { const i = state.water?.island; return !!i && Math.hypot(e.x - i.x, e.z - i.z) < i.r; };
// Bridge deck lift: cars on the ruler sit 0.5 higher, with a short ramp at each end.
const bridgeLift = (e) => { const w = state.water; return w && Math.abs(e.z - w.bridge.z) < w.bridge.w / 2 ? 0.5 * Math.max(0, Math.min(1, ((w.x1 - w.x0) / 2 + 0.5 - Math.abs(e.x - (w.x0 + w.x1) / 2)) / 1.5)) : 0; };
function waterPush(e) {
  const w = state.water;
  if (!w || e.floats || (e.kind === 'player' && VEHICLES[e.vehicle].floats)) return;
  if (onIsland(e)) { e.onIsl = true; return; }
  const wasIsl = e.onIsl; e.onIsl = false;
  if (onFerry(e)) return;
  const m = e.r * 0.6, hw = w.bridge.w / 2;
  // Two blocked rectangles: the water north of the bridge and the water south of it.
  for (const [z0, z1] of [[w.z0 ?? -D / 2 - 10, w.bridge.z - hw], [w.bridge.z + hw, w.z1 ?? D / 2 + 10]]) {
    if (e.x + m <= w.x0 || e.x - m >= w.x1 || e.z + m <= z0 || e.z - m >= z1) continue;
    const pens = [[e.x + m - w.x0, -1, 0], [w.x1 - (e.x - m), 1, 0], [e.z + m - z0, 0, -1], [z1 - (e.z - m), 0, 1]];
    pens.sort((a, b) => a[0] - b[0]);
    const [pen, nx, nz] = pens[0], f = e.ferryRef || (wasIsl && { x: w.island.x, z: w.island.z, R: w.island.r + 0.2 });
    if (f) {
      // Leaving a ferry out over open water: the rim stops you (you can only step off where there is a bank, the bridge or the island).
      const fx = e.x - f.x, fz = e.z - f.z, fd = Math.hypot(fx, fz) || 1, k = (f.R - 0.5) / fd;
      e.x = f.x + fx * k; e.z = f.z + fz * k;
      const vn = ((e.vx || 0) * fx + (e.vz || 0) * fz) / fd;
      if (vn > 0) { e.vx -= vn * fx / fd; e.vz -= vn * fz / fd; }
      continue;
    }
    e.x += nx * pen; e.z += nz * pen;
    const vn = (e.vx || 0) * nx + (e.vz || 0) * nz;
    if (vn < 0) { e.vx -= 1.2 * vn * nx; e.vz -= 1.2 * vn * nz; }
  }
}

// A boat's wake: two pale strips streaming back from the stern, shared geometry and material, scaled with speed in render.
let wakeGeo = null, wakeMat = null;
function addWake(g, back) {
  wakeGeo = wakeGeo || new THREE.PlaneGeometry(4, 0.7);
  wakeMat = wakeMat || new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false });
  const w = new THREE.Group();
  w.name = 'wake'; w.position.set(-back, 0.12, 0);
  for (const s of [-1, 1]) {
    const strip = new THREE.Mesh(wakeGeo, wakeMat);
    strip.rotation.x = -Math.PI / 2; strip.rotation.z = s * 0.28; strip.position.set(-1.8, 0, s * 0.7);
    w.add(strip);
  }
  g.add(w);
}
function wheel(g, x, z, r = 0.8, w = 0.6) {
  const m = mesh(new THREE.CylinderGeometry(r, r, w, 12), mat(0x1c1712), x, r, z, g);
  m.rotation.x = Math.PI / 2;
}

function itemsUpdate(dt) {

// Find a clear spot near the middle for the machine (levels with gumball: true).
function placeGumball(L) {
  const spots = L?.gumball?.spots || [[0, 0], [0, 10], [0, -10], [10, 0], [-10, 0], [0, 18], [0, -18], [8, 12], [-8, -12], [12, -8], [-12, 8]];

    if (dominoes.some((d) => Math.hypot(d.x - x, d.z - z) < 7) || piles.some((q) => Math.hypot(q.x - x, q.z - z) < 7) || outposts.some((o) => Math.hypot(o.x - x, o.z - z) < 8)) continue;

// ---------- Magnet tower: pulls in loose cereal and drags enemy cars ----------
function magnetThink(m, dt) {
  const R = m.weapon.range;
  for (const sp of spills) {
    if (sp.amount > 0 && dist2(sp, m) < (R + 4) ** 2) {
      const got = Math.min(sp.amount, 8 * dt);
      sp.amount -= got; state.cereal[m.team] += got;
      if (Math.random() < dt * 6) burst(sp.x + (m.x - sp.x) * Math.random(), sp.z + (m.z - sp.z) * Math.random(), 0xffd166, 1, 2, 1);
    }
  }
  for (const e of entities) {
    if (e.team === m.team || e.hp <= 0 || e.fly || !(e.kind === 'unit' || e.kind === 'worker' || (e.kind === 'player' && e.alive))) continue;
    const d = Math.hypot(e.x - m.x, e.z - m.z);
    if (d < R && d > 2.5) {
      const k = Math.exp(-2.5 * dt); e.vx = (e.vx || 0) * k; e.vz = (e.vz || 0) * k; // drag
      e.x += (m.x - e.x) / d * 3 * dt; e.z += (m.z - e.z) / d * 3 * dt; // and a gentle pull
    }
  }
  if (m.mesh) { const head = m.mesh.getObjectByName('turret'); if (head) head.rotation.y += dt * 0.8; }
}

const redHome = () => { const b = state.bases[RED]; return state.finale ? [[b.x - 12, b.z + 16], [b.x + 10, b.z + 16], [b.x, b.z + 24]] : RED_HOME; };
function commanderBuild(ramp) {

  const homeWanted = T > 45 ? Math.min(3, 1 + Math.floor(T / 90)) : 0;

// Erasers slide where you shove them, stop at walls and each other, and the route grid is rebuilt as they settle.
function erasersUpdate(dt) {
  for (const o of erasers) {
    o.blocked = false;
    const moving = o.vx !== 0 || o.vz !== 0;
    if (moving) {
      o.x += o.vx * dt; o.z += o.vz * dt;
      const f = Math.exp(-4 * dt);
      o.vx *= f; o.vz *= f;
      if (Math.hypot(o.vx, o.vz) < 0.2) o.vx = o.vz = 0;
    }
    // Keep on the table, and out of walls, turrets and other erasers.
    const hx = W / 2 - o.w / 2, hz = D / 2 - o.d / 2;
    if (o.x < -hx) { o.x = -hx; o.vx = 0; o.blocked = true; } else if (o.x > hx) { o.x = hx; o.vx = 0; o.blocked = true; }
    if (o.z < -hz) { o.z = -hz; o.vz = 0; o.blocked = true; } else if (o.z > hz) { o.z = hz; o.vz = 0; o.blocked = true; }
    for (const q of obstacles) {

      const ox = (o.w + q.w) / 2 - Math.abs(o.x - q.x), oz = (o.d + q.d) / 2 - Math.abs(o.z - q.z);

      if (!other) o.blocked = true;
    }

    const still = o.vx === 0 && o.vz === 0;

// ---------- Level 6, finale gumball (Harry's owner idea): the gumball machine in the middle of the bend, the STAND MIXER and four special team members ----------
// The machine is level 2's (PRIZES, ITEMS, useItem, spinGumball, cereal only). On this level `finalePrizes` adds five bigger prizes:

//   Captain Teaspoon (fast melee, flips infantry, +25% damage to squads near him), the Salt Shaker (sniper, his shots leave salt that slows enemy cars),
//   Nurse Duck (heals nearby friends slowly, fragile) and the Egg Timer (rings every 30 s: your squads speed up for 10 s).

      e.mesh.rotation.z = a ? (0.5 - f) * 0.5 : (Math.abs(e.x) < state.ledge.rw && e.z < state.ledge.rz1 && e.z > state.ledge.z1 ? Math.atan(-LEDGE_H / (state.ledge.rz1 - state.ledge.z1) * Math.sin(e.heading)) : 0);
    }
    if (e.type === 'toaster') for (let k = 0; k < 2; k++) e.slices[k].position.y = 7.6 + (e.pop > 0 && (k === 0) === (e.side > 0) ? Math.sin((1 - e.pop / 0.45) * Math.PI) * 1.2 : 0);
    if (e.type === 'duck') { e.mesh.position.y = 0.7 + Math.sin(time * 2) * 0.3; e.mesh.rotation.z = Math.sin(time * 1.5) * 0.06; }
    if (e.kind === 'boat') {
      e.mesh.position.y = 0.2 + Math.sin(time * 3 + e.x) * 0.1; e.mesh.rotation.z = Math.sin(time * 2.3 + e.z) * 0.05;
      const wake = e.mesh.getObjectByName('wake');
      if (wake) wake.scale.set(0.2 + Math.hypot(e.vx, e.vz) / 8, 1, 1);
    }
    if (e.type === 'rcar') { const k = Math.sin(time * 13) > 0; e.blinkA.visible = k; e.blinkB.visible = !k; e.tip.visible = Math.sin(time * 5) > -0.3; }
    if (e.kind === 'boss' && e.lid) e.lid.rotation.z = e.snap > 0 ? 0.9 * Math.max(0, 1 - e.snap * 3.5) : 0.65 + Math.sin(time * 3) * 0.15; // snaps shut, then creaks open
    if (e.role === 'digger') { const arm = e.mesh.getObjectByName('arm'); if (arm) arm.rotation.z = e.digging ? Math.sin(time * 4) * 0.45 : 0.2; }
    if (e.role === 'truck') {
      const bed = e.mesh.getObjectByName('bed');
      const load = bed.getObjectByName('load');
      load.scale.y = Math.max(0.01, e.load / WORKERS.truck.carry) * 0.9;
      if (e.load > 0) load.material.color.setHex(e.loadRes === 'clips' ? 0xdfe3ea : e.loadRes === 'batteries' ? 0x3ddc84 : e.loadRes === 'peas' ? 0x7ccf4a : 0xf2c97d);
      bed.rotation.z = e.going === 'drop' && e.load === 0 ? 0.5 : 0;
    }
    if (e.vehicle === 'mech') e.mesh.children.filter((c) => c.name === 'leg').forEach((leg, i) => { leg.rotation.z = Math.sin(time * 10 + i * Math.PI) * Math.min(1, Math.hypot(e.vx, e.vz) / 5) * 0.5; });
  }
  for (const b of state.bases || []) {
    const health = b.hp / b.maxHp;
    b.mesh.rotation.z = (1 - Math.min(1, health * 2)) * 0.12 * (b.team === BLUE ? 1 : -1);
    if (health < 0.5 && b.hp > 0 && Math.random() < dt * (health < 0.25 ? 10 : 4)) burst(b.x + (Math.random() - 0.5) * 8, b.z + (Math.random() - 0.5) * 8, health < 0.25 ? 0x3a332c : 0x8a8178, 2, 3, 7.5);
  }
  hobDraw(dt, time);
  landMarksUpdate(time);
  if (sink) { waterTex.offset.x += dt * 0.012; waterTex.offset.y -= dt * 0.03; } // the ripples slide along
  for (const f of ferries) { f.g.position.set(f.x, 0.2 + Math.sin(time * 2 + f.z) * 0.05, f.z); f.g.rotation.y += dt * 0.05; }
  for (const o of outposts) {
    o.cloth.material.color.setHex(o.owner === BLUE ? COLORS[BLUE] : o.owner === RED ? COLORS[RED] : 0xc9c2b6);
    o.ring.material.opacity = 0.25 + Math.abs(o.progress) * 0.4;
    o.cloth.position.y = 2.2 + (Math.abs(o.progress)) * 1.7;
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt; q.vy -= 30 * dt;
    q.mesh.position.x += q.vx * dt; q.mesh.position.y = Math.max(0.2, q.mesh.position.y + q.vy * dt); q.mesh.position.z += q.vz * dt;
    q.mesh.rotation.x += dt * 8;
    if (q.life <= 0) { scene.remove(q.mesh); parts.splice(i, 1); }
  }
  // Camera: high and angled, leading the way you're going. Pulls back on tall screens.
  const p = state.player;
  if (p) {
    const zoom = (camera.aspect < 1 ? 1.5 : 1) * (state.level.camZoom || 1) * (state.finale?.peek || state.finale?.cine > 0 ? 1.2 : 1); // level 6 pulls the camera back to read the bigger space
    // Keep the view on the table: near an edge the car moves off-centre instead of the camera showing the dark beyond.
    const lead = new THREE.Vector3(p.x + p.vx * 0.35, 0, p.z + p.vz * 0.35);
    if (state.finale?.peek) { lead.x = 120; lead.z = -4; } // level 6: hold the Peek button to look at Red's side
    else if (state.finale?.cine > 0) { state.finale.cine -= dt; lead.x = 0; lead.z = -62; } // level 6: the camera glances at the fridge as its door opens
    lead.x = Math.max(-W / 2 + 30, Math.min(W / 2 - 30, lead.x));
    lead.z = Math.max(-D / 2 + 22, Math.min(D / 2 - 14, lead.z));
    camTarget.lerp(lead, 1 - Math.exp(-4 * dt));
    // Build ghost: where a turret would go (behind you). Green = you can build here, red = you can't.
    if (!ghost) {
      ghost = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.15, 24), new THREE.MeshBasicMaterial({ color: 0x3ddc84, transparent: true, opacity: 0.45, depthWrite: false }));
      scene.add(ghost);
    }
    const gx = p.x - Math.cos(p.heading) * 4, gz = p.z - Math.sin(p.heading) * 4;
    const ok = p.alive && !canPlace(gx, gz, BLUE) && state.cereal[BLUE] >= costOf('gun');
    ghost.visible = p.alive && !state.over && state.phase === 'battle';
    ghost.position.set(gx, 0.1 + (state.ledge ? ledgeLift({ x: gx, z: gz }) : 0), gz);
    ghost.material.color.setHex(ok ? 0x3ddc84 : 0xff5a5f);
    ghost.material.opacity = (darkNow() ? 0.6 : 0.3) + Math.sin(time * 5) * 0.12; // brighter in the dark drawer
    state.shake = Math.max(0, (state.shake || 0) - dt * 2.5);
    const sh = state.shake * 0.8;
    camera.position.set(camTarget.x + (Math.random() - 0.5) * sh, 50 * zoom, camTarget.z + 34 * zoom + (Math.random() - 0.5) * sh);
    camera.lookAt(camTarget.x, 0, camTarget.z + 2);
  }
  if (bannerTimer > 0 && (bannerTimer -= dt) <= 0) $('banner').hidden = true;
  const box = state.bases?.[RED];
  if (box?.bubble) { box.bubble.material.opacity = 0.18 + Math.sin(performance.now() / 300) * 0.06; box.bubble.rotation.y += dt * 0.3; }
  // Arrow at the screen edge pointing to the boss when it's off-camera.
  const B = state.boss, arrow = $('bossArrow');
  if (B && B.hp > 0 && !state.over) {
    const v = new THREE.Vector3(B.x, 2, B.z).project(camera);
    const off = v.x < -0.95 || v.x > 0.95 || v.y < -0.9 || v.y > 0.9;
    arrow.hidden = !off;
    if (off) {
      const k = 0.88 / Math.max(Math.abs(v.x), Math.abs(v.y)), ax = v.x * k, ay = v.y * k;
      arrow.style.left = `${(ax + 1) / 2 * innerWidth - 14}px`; arrow.style.top = `${(1 - ay) / 2 * innerHeight - 13}px`;
      arrow.style.transform = `rotate(${Math.atan2(v.x, v.y)}rad)`;
    }
  } else arrow.hidden = true;
  raceArrow();
  mixArrowDraw();
  if (state.finale) { finaleDraw(dt, time); if (state.finale.ending) endingDraw(dt, time); }
  if (state.level?.dark) darkUpdate(dt);
  gfxRender();
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  gfxSize();
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- Progress and level select ----------
// Stars per level (by level number) live in localStorage; every read and write is wrapped so the game works without storage.
const SAVE_KEY = 'bb-progress-v1';
const progress = { stars: {} };
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (saved && typeof saved.stars === 'object') for (const k in saved.stars) progress.stars[k] = Math.max(0, Math.min(3, saved.stars[k] | 0));
} catch (e) { /* no storage: progress lasts until the page closes */ }
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ } }
const starsOf = (i) => progress.stars[i + 1] | 0;
const isUnlocked = () => true; // Harry: pick any level from the start (no locks); stars still save
const isPlayable = (i) => isUnlocked(i) && !LEVELS[i].soon;
const starRow = (n) => [0, 1, 2].map((k) => `<span class="${k < n ? '' : 'off'}">\u2605</span>`).join('');
const FAST_WIN = 480; // seconds: the "under 8 minutes" star
function renderLevels() {
  $('levels').innerHTML = LEVELS.map((L, i) => {
    const cls = [i === curLevel ? 'cur' : '', !isUnlocked(i) ? 'locked' : '', L.soon ? 'soon' : ''].join(' ');
    const note = L.soon ? 'coming soon' : !isUnlocked(i) ? 'locked' : '';
    return `<button data-i="${i}" class="${cls}" ${isPlayable(i) ? '' : 'aria-disabled="true"'}><b>${i + 1}</b>${L.name}${note ? `<small>${note}</small>` : `<span class="stars">${starRow(starsOf(i))}</span>`}</button>`;
  }).join('');
  for (const b of $('levels').querySelectorAll('button')) b.addEventListener('click', () => { if (isPlayable(+b.dataset.i)) selectLevel(+b.dataset.i); });
  const L = LEVELS[curLevel];
  $('lvlSub').textContent = `Mealtime Mayhem \u00b7 Level ${curLevel + 1} \u00b7 ${L.name}`;
  $('lvlBlurb').textContent = L.blurb;
  $('lvlTips').innerHTML = L.tips.map((t) => `<li>${t}</li>`).join('');
}
function selectLevel(i) {
  curLevel = i;
  reset(); // the new level shows behind the card
  renderLevels();
}
// Open on the first level you haven't won yet (or the last one you can play).
curLevel = LEVELS.findIndex((L, i) => isPlayable(i) && !starsOf(i));
if (curLevel < 0) curLevel = LEVELS.reduce((best, L, i) => (isPlayable(i) ? i : best), 0);

function endGame(won) {
  state.over = true;
  const earned = won ? 1 + (state.time < FAST_WIN ? 1 : 0) + (state.trucksLost === 0 ? 1 : 0) : 0;
  if (won && earned > starsOf(curLevel)) { progress.stars[curLevel + 1] = earned; saveProgress(); }
  else if (won) saveProgress();
  if (won && state.finale) return finaleEnding(earned); // level 6: the light flicks on, then the MEALTIME MAYHEM COMPLETE screen
  $('endTitle').textContent = won ? 'YOU WIN' : 'TOY BOX LOST';
  const mins = Math.floor(state.time / 60), secs = String(Math.floor(state.time % 60)).padStart(2, '0');
  $('endText').textContent = won
    ? `Their toy box is crumbs. Time ${mins}:${secs}. ${state.time < FAST_WIN ? 'Fast win star!' : 'Win in under 8 minutes for a star.'} ${state.trucksLost === 0 ? 'No trucks lost star!' : `You lost ${state.trucksLost} truck${state.trucksLost === 1 ? '' : 's'}: win without losing one for a star.`}`
    : `They flattened your toy box after ${mins}:${secs}. Build turrets on the caps you hold and try again.`;
  $('endStars').innerHTML = won ? starRow(earned) : '';
  const nextOk = won && LEVELS[curLevel + 1] && isPlayable(curLevel + 1);
  $('next').hidden = !nextOk;
  setTimeout(() => { sfx(won ? 'win' : 'lose'); $('end').hidden = false; }, 1200);
}
function start() {
  audioInit();
  $('start').hidden = true; $('end').hidden = true;
  reset();
}
$('play').addEventListener('click', start);
$('again').addEventListener('click', start);
$('next').addEventListener('click', () => { curLevel += 1; start(); });
$('menu').addEventListener('click', () => { $('end').hidden = true; $('start').hidden = false; selectLevel(curLevel); });
renderLevels();
reset();
requestAnimationFrame(step);
</script>
