<style>
/* Layout: full-screen toy tabletop; HUD floats over it, thumb controls in the bottom corners. */
:root {
  --blue: #2f7df6;
  --red: #ef4136;
  --gold: #ffc23d;
  --ink: #1c1712;
  --paper: #fff8ec;
  --glass: rgba(28, 23, 18, 0.62);
  --display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: #3b2a1c; color: var(--paper);
  font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.basebar { display: grid; gap: 4px; min-width: 0; flex: 1; max-width: 260px; }
.basebar.red { text-align: right; }
.basebar .eco { font-size: 13px; font-weight: 700; color: var(--paper); opacity: 0.85; }
.basebar b { font-family: var(--display); font-size: 13px; letter-spacing: 0.04em; }
.bar { height: 10px; border-radius: 6px; background: var(--glass); overflow: hidden; border: 2px solid rgba(255, 248, 236, 0.25); }
.basebar .pct { font-variant-numeric: tabular-nums; }
.bar i { display: block; height: 100%; width: 100%; transition: width 0.2s; }
.blue .bar i { background: var(--blue); }
.red .bar i { background: var(--red); margin-left: auto; }
.mid { display: grid; justify-items: center; gap: 6px; }
.res { display: flex; gap: 16px; align-items: baseline; }
.cereal { font-family: var(--display); font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
.cereal.clips { color: #dfe3ea; }
.bossbar { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 112px); left: 50%; transform: translateX(-50%); width: min(300px, 40vw); pointer-events: none; text-align: center; }
.bossbar b { font-family: var(--display); font-size: 13px; letter-spacing: 0.06em; color: var(--paper); text-shadow: 0 2px 0 var(--ink); }
.bossbar .bar i { background: #c8281f; }
.pips { display: flex; gap: 6px; }
.pips span { width: 14px; height: 14px; border-radius: 50%; background: #9a8f80; border: 2px solid var(--paper); }
.banner { position: fixed; z-index: 4; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font-family: var(--display); color: var(--gold, #ffc23d); text-shadow: 0 3px 0 #1c1712; font-size: clamp(26px, 5vw, 46px); line-height: 1.05; max-width: 90vw; }
.banner small { display: block; margin-top: 10px; font-family: var(--body); font-weight: 700; font-size: clamp(16px, 2.6vw, 22px); line-height: 1.3; color: #fff8ec; text-shadow: 0 2px 0 #1c1712; }
.bossArrow { position: fixed; z-index: 3; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #c8281f; filter: drop-shadow(0 2px 0 #1c1712); pointer-events: none; }
.toast { font-family: var(--display); font-size: 14px; color: var(--paper); text-shadow: 0 2px 0 var(--ink); min-height: 18px; text-align: center; }

.controls {
  position: fixed; right: 0; bottom: 0; z-index: 3; display: grid; justify-items: end; gap: 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; }
button {
  font: 700 15px/1 var(--body); color: var(--paper); background: var(--glass); border: 3px solid rgba(255, 248, 236, 0.4);
  border-radius: 16px; padding: 10px 12px; min-width: 64px; min-height: 52px; display: grid; justify-items: center; gap: 3px;
  touch-action: none; cursor: pointer;
}
button small { font-size: 12px; color: var(--gold); font-weight: 700; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button[disabled] { opacity: 0.4; }
button.fire { width: 104px; height: 104px; border-radius: 50%; font: 20px var(--display); background: rgba(239, 65, 54, 0.75); border-color: var(--paper); }
button.fire.on { background: var(--red); transform: scale(0.96); }

.garage {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 3; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: var(--glass); max-width: calc(100vw - 300px); overflow-x: auto;
}
.garage button { min-width: 74px; }
.garage button.cur { border-color: var(--blue); background: rgba(47, 125, 246, 0.55); }

.stick { position: fixed; z-index: 3; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 3px solid rgba(255, 248, 236, 0.45); background: rgba(28, 23, 18, 0.25); pointer-events: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255, 248, 236, 0.75); }
.hint { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 2; font-weight: 700; color: rgba(255, 248, 236, 0.7); pointer-events: none; }

.screen {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(28, 23, 18, 0.72);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { max-width: 700px; display: grid; gap: 14px; text-align: center; justify-items: center; }
.card h1 { font: 44px/1 var(--display); margin: 0; color: var(--gold); text-shadow: 0 4px 0 var(--ink); text-wrap: balance; }
.card .sub { font: 14px var(--display); color: var(--paper); opacity: 0.8; letter-spacing: 0.06em; }
.card p { margin: 0; font-size: 18px; line-height: 1.4; max-width: 46ch; }
.card ul { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.5; display: grid; gap: 2px; }
.card .go { font: 24px var(--display); background: var(--blue); border-color: var(--paper); padding: 16px 30px; min-width: 200px; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.levels button { width: 100px; min-width: 0; min-height: 76px; padding: 8px 6px; font-size: 13px; line-height: 1.15; }
.levels button b { font: 20px var(--display); }
.levels button.cur { border-color: var(--gold); background: rgba(255, 194, 61, 0.28); }
.levels button.locked, .levels button.soon { opacity: 0.4; filter: grayscale(1); cursor: default; }
.stars { font: 30px var(--display); color: var(--gold); letter-spacing: 0.1em; text-shadow: 0 2px 0 var(--ink); }
.levels .stars { font-size: 15px; letter-spacing: 0.05em; }
.stars .off { color: rgba(255, 248, 236, 0.28); text-shadow: none; }
.card .two { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.card .go.alt { background: var(--glass); font-size: 18px; padding: 14px 20px; min-width: 120px; }
@media (max-width: 700px) { .garage { max-width: calc(100vw - 32px); bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); } .card h1 { font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ---------- World ----------
const W = 150, D = 96; // the tabletop, in toy units (1 unit ≈ 1 cm)
const BLUE = 0, RED = 1;
const COLORS = [0x2f7df6, 0xef4136];
const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3b2a1c);
scene.fog = new THREE.Fog(0x3b2a1c, 90, 170);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 400);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x5a3d26, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(-40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 60, bottom: -60, near: 1, far: 200 });
scene.add(sun);

let meshParent = scene; // where mesh() puts things by default: the level's group while a level is being built
const mat = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.05, ...extra });
// Shapes and colours made once and shared (shots, sparks, cereal loops): fresh ones each time ran iPads out of memory.
const SHARED = new Map();
function shared(key, make) { let v = SHARED.get(key); if (!v) { v = make(); if (v.userData) v.userData.shared = true; SHARED.set(key, v); } return v; }
function mesh(geo, material, x = 0, y = 0, z = 0, parent = meshParent) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Wood grain, drawn once to a canvas.
function woodTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#b07a4a'; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? '#a8713f' : '#b98656'; g.fillRect(0, i * 57, 1024, 55); }
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = `rgba(80,45,20,${Math.random() * 0.18})`; g.lineWidth = Math.random() * 2 + 0.5;
    const y = Math.random() * 512; g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x / 90 + i) * 4);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
// A green cutting mat with a grid, for the pencil-case level.
function matTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#3f8a64'; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i <= 1024; i += 65) { g.strokeStyle = i % 325 === 0 ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.22)'; g.lineWidth = i % 325 === 0 ? 3 : 1.5; g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke(); }
  for (let j = 0; j <= 512; j += 65) { g.strokeStyle = j % 325 === 0 ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.22)'; g.lineWidth = j % 325 === 0 ? 3 : 1.5; g.beginPath(); g.moveTo(0, j); g.lineTo(1024, j); g.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
// Ruler ticks, drawn once and shared by every ruler.
function rulerTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#ecc875'; g.fillRect(0, 0, 512, 64);
  g.fillStyle = '#3b2a1c';
  for (let i = 0; i <= 64; i++) { const x = i * 8 - (i === 64 ? 2 : 0); g.fillRect(x, 0, 2, i % 5 === 0 ? 30 : 16); }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
// White kitchen tiles with grey grout, for the sink level.
function tileTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#c9d2d8'; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 32; i++) for (let j = 0; j < 22; j++) {
    const v = 238 + Math.floor(Math.random() * 12);
    g.fillStyle = `rgb(${v},${v + 3},${v + 4})`; g.fillRect(i * 32 + 1.5, j * 24 + 1.5, 29, 21);
  }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
// Water ripples: wavy light lines that repeat seamlessly; the sink slides the texture along instead of moving any geometry.
function waterTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#3f9fdc'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 14; i++) {
    const y0 = (i + 0.5) * 256 / 14, k = 1 + (i % 3), ph = i * 1.7;
    g.strokeStyle = i % 2 ? 'rgba(255,255,255,0.30)' : 'rgba(150,215,255,0.35)'; g.lineWidth = 2 + (i % 3);
    g.beginPath();
    for (let x = 0; x <= 256; x += 8) { const y = y0 + Math.sin(x / 256 * Math.PI * 2 * k + ph) * 6; x ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const woodTex = woodTexture();
let matTex = null, rulerTex = null, tileTex = null, waterTex = null;
const table = mesh(new THREE.BoxGeometry(W + 8, 4, D + 8), mat(0xffffff, { map: woodTex, roughness: 0.75 }), 0, -2, 0);
table.castShadow = false;

// Obstacles: axis-aligned boxes the cars bump into (x, z centre, w, d).
const obstacles = [];
function block(x, z, w, d, h, color, kind) {
  const o = { x, z, w, d, h, kind };
  obstacles.push(o);
  if (kind === 'book') {
    mesh(new THREE.BoxGeometry(w, h, d), mat(color), x, h / 2, z);
    mesh(new THREE.BoxGeometry(w - 1.2, h - 0.8, d + 0.05), mat(0xfaf3e3), x + 0.4, h / 2, z);
  } else if (kind === 'pencil') {
    const along = w > d, len = along ? w : d;
    const p = mesh(new THREE.CylinderGeometry(1, 1, len - 3, 6), mat(color), x, 1, z);
    p.rotation.set(along ? 0 : Math.PI / 2, 0, along ? Math.PI / 2 : 0);
    const tip = mesh(new THREE.ConeGeometry(1, 3, 6), mat(0xe8c79a), along ? x + len / 2 - 1.5 : x, 1, along ? z : z + len / 2 - 1.5);
    tip.rotation.set(along ? 0 : Math.PI / 2, 0, along ? -Math.PI / 2 : 0);
    const rub = mesh(new THREE.CylinderGeometry(1, 1, 1.6, 12), mat(0xf28fb1), along ? x - len / 2 + 2.3 : x, 1, along ? z : z - len / 2 + 2.3);
    rub.rotation.copy(p.rotation);
  } else if (kind === 'ruler') {
    mesh(new THREE.BoxGeometry(w, h, d), mat(0xecc875), x, h / 2, z);
    rulerTex = rulerTex || rulerTexture();
    const face = mesh(new THREE.PlaneGeometry(Math.max(w, d), Math.min(w, d)), mat(0xffffff, { map: rulerTex }), x, h + 0.03, z);
    face.rotation.set(-Math.PI / 2, 0, w > d ? 0 : Math.PI / 2);
    face.castShadow = false;
  } else if (kind === 'mug') {
    mesh(new THREE.CylinderGeometry(w / 2, w / 2 * 0.92, h, 28, 1, true), mat(color, { side: THREE.DoubleSide }), x, h / 2, z);
    mesh(new THREE.CylinderGeometry(w / 2 - 0.5, w / 2 - 0.5, 0.4, 28), mat(0x4a2a14), x, h - 1.5, z);
    const handle = mesh(new THREE.TorusGeometry(2.4, 0.6, 8, 16, Math.PI), mat(color), x + w / 2 + 0.2, h / 2, z);
    handle.rotation.z = -Math.PI / 2;
  } else {
    mesh(new THREE.BoxGeometry(w, h, d), mat(color), x, h / 2, z);
    if (kind === 'die') for (const [dx, dz] of [[-1, -1], [1, 1], [0, 0], [1, -1], [-1, 1]]) mesh(new THREE.SphereGeometry(0.35, 8, 6), mat(0x1c1712), x + dx * 1.1, h + 0.05, z + dz * 1.1);
  }
  return o;
}
// An eraser: a pushable block (a pink or white rubber with a card sleeve). Pushed by your car, it slides to a stop.
const erasers = [];
function makeEraser(x, z, w, d, color) {
  const g = new THREE.Group();
  mesh(new THREE.BoxGeometry(w, 3, d), mat(color, { roughness: 0.9 }), 0, 1.5, 0, g);
  const along = w > d;
  mesh(new THREE.BoxGeometry(along ? w * 0.45 : w + 0.15, 3.15, along ? d + 0.15 : d * 0.45), mat(0x2a5db0), 0, 1.5, 0, g);
  g.position.set(x, 0, z);
  meshParent.add(g);
  const o = { x, z, w, d, h: 3, kind: 'eraser', vx: 0, vz: 0, nx: x, nz: z, blocked: false, group: g };
  obstacles.push(o);
  erasers.push(o);
  return o;
}
// The case's floor, zip, label and the open lid folded away: looks only, nothing to bump into.
function pencilCaseDecor() {
  mesh(new THREE.BoxGeometry(42.4, 0.5, 18.4), mat(0x14606f), 0, 0.25, 0);
  mesh(new THREE.BoxGeometry(44.4, 0.5, 2), mat(0xc9ccd2, { metalness: 0.5 }), 0, 5.15, 10).castShadow = false;
  mesh(new THREE.BoxGeometry(44.4, 0.5, 2), mat(0xc9ccd2, { metalness: 0.5 }), 0, 5.15, -10).castShadow = false;
  mesh(new THREE.BoxGeometry(3, 1.6, 2.4), mat(0xef4136), 21, 5.6, 10); // zip pull
  mesh(new THREE.BoxGeometry(9, 0.2, 3), mat(0xfff8ec), -12, 5.45, 10.9).rotation.x = 0; // name tag
}

// The sink: a basin of water down the middle with a ruler bridge, two bottle-cap ferries, a soap-dish island and the tap.
// Everything that moves is a few shapes made once per level; the ripples slide a texture, nothing is rebuilt per frame.
function sinkDecor() {
  const Wt = LEVELS[curLevel].water, wx = (Wt.x0 + Wt.x1) / 2, ww = Wt.x1 - Wt.x0, depth = D + 8;
  waterTex = waterTex || waterTexture();
  waterTex.repeat.set(ww / 9, depth / 9);
  // The basin floor, a darker blue, then the see-through water over it.
  const floor = mesh(new THREE.PlaneGeometry(ww + 1.6, depth), mat(0x2b6e9c, { roughness: 0.4 }), wx, 0.04, 0);
  floor.rotation.x = -Math.PI / 2; floor.castShadow = false;
  const water = mesh(new THREE.PlaneGeometry(ww, depth), new THREE.MeshStandardMaterial({ color: 0xbfe6ff, map: waterTex, transparent: true, opacity: 0.8, roughness: 0.12, metalness: 0.15, depthWrite: false }), wx, 0.14, 0);
  water.rotation.x = -Math.PI / 2; water.castShadow = false;
  sink = { water };

function buildLevel(L) {

  table.material.needsUpdate = true;

  for (const e of L.erasers) makeEraser(...e);

// ---------- Water (level 4, the sink) ----------
// A channel x0..x1 across the full depth. Wheels can't enter it except on the bridge (a ruler, bridge.w wide) or on a ferry;
// the Hover floats over it. Boats stay inside it. state.water is null on levels without water.
const ferries = [];
let sink = null; // moving look-only pieces of the sink: ripple texture, drip drop, splash rings
const inWaterX = (x, z, m = 0) => !!state.water && x > state.water.x0 - m && x < state.water.x1 + m; // anywhere across the channel, bridge included
const onFerry = (e) => { for (const f of ferries) if (Math.hypot(e.x - f.x, e.z - f.z) < f.R) return f; return null; };
const onIsland = (e) => { const i = state.water?.island; return !!i && Math.hypot(e.x - i.x, e.z - i.z) < i.r; };
// Bridge deck lift: cars on the ruler sit 0.5 higher, with a short ramp at each end.
const bridgeLift = (e) => { const w = state.water; return w && Math.abs(e.z - w.bridge.z) < w.bridge.w / 2 ? 0.5 * Math.max(0, Math.min(1, (w.x1 + 0.5 - Math.abs(e.x)) / 1.5)) : 0; };
function waterPush(e) {
  const w = state.water;
  if (!w || (e.kind === 'player' && VEHICLES[e.vehicle].floats)) return;
  if (onIsland(e)) { e.onIsl = true; return; }
  const wasIsl = e.onIsl; e.onIsl = false;
  if (onFerry(e)) return;
  const m = e.r * 0.6, hw = w.bridge.w / 2;
  // Two blocked rectangles: the water north of the bridge and the water south of it.
  for (const [z0, z1] of [[-D / 2 - 10, w.bridge.z - hw], [w.bridge.z + hw, D / 2 + 10]]) {
    if (e.x + m <= w.x0 || e.x - m >= w.x1 || e.z + m <= z0 || e.z - m >= z1) continue;
    const pens = [[e.x + m - w.x0, -1, 0], [w.x1 - (e.x - m), 1, 0], [e.z + m - z0, 0, -1], [z1 - (e.z - m), 0, 1]];
    pens.sort((a, b) => a[0] - b[0]);
    const [pen, nx, nz] = pens[0], f = e.ferryRef || (wasIsl && { x: w.island.x, z: w.island.z, R: w.island.r + 0.2 });
    if (f) {
      // Leaving a ferry out over open water: the rim stops you (you can only step off where there is a bank, the bridge or the island).
      const fx = e.x - f.x, fz = e.z - f.z, fd = Math.hypot(fx, fz) || 1, k = (f.R - 0.5) / fd;
      e.x = f.x + fx * k; e.z = f.z + fz * k;
      const vn = ((e.vx || 0) * fx + (e.vz || 0) * fz) / fd;
      if (vn > 0) { e.vx -= vn * fx / fd; e.vz -= vn * fz / fd; }
      continue;
    }
    e.x += nx * pen; e.z += nz * pen;
    const vn = (e.vx || 0) * nx + (e.vz || 0) * nz;
    if (vn < 0) { e.vx -= 1.2 * vn * nx; e.vz -= 1.2 * vn * nz; }
  }
}

// Cereal: piles from spilled bowls (dug by diggers, hauled by trucks) and
// spills from wrecks (anyone can scoop those by driving over them).
const LOOP_COLORS = [0xff5a5f, 0xffd166, 0x06d6a0, 0x9b5de5, 0xff9f1c];
const piles = [];
const spills = [];
function loopsGroup(x, z, n, radius, height) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * radius;
    const y = 0.3 + (1 - r / radius) * height * Math.random();
    const loop = mesh(shared('loop', () => new THREE.TorusGeometry(0.55, 0.28, 6, 12)), shared(`loopMat:${i % LOOP_COLORS.length}`, () => mat(LOOP_COLORS[i % LOOP_COLORS.length])), Math.cos(a) * r, y, Math.sin(a) * r, g);
    loop.rotation.set(Math.PI / 2 + (Math.random() - 0.5) * 1.2, Math.random() * 3, 0);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}
// Paperclips: bent silver wire (one tube along a gem-clip path, shared by every clip).
let clipGeo = null, clipMat = null;
function clipsGroup(x, z, n, radius, height) {
  if (!clipGeo) {
    const pts = [], arc = (cx, cy, r, a0, a1) => { for (let k = 0; k <= 8; k++) { const a = a0 + (a1 - a0) * k / 8; pts.push(new THREE.Vector3(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0)); } };
    pts.push(new THREE.Vector3(0.2, -0.55, 0), new THREE.Vector3(0.2, 0.2, 0));
    arc(0, 0.45, 0.2, 0, Math.PI);                 // small top bend
    pts.push(new THREE.Vector3(-0.2, -0.5, 0));
    arc(0.2, -0.5, 0.4, Math.PI, Math.PI * 2);     // big bottom bend, going round
    pts.push(new THREE.Vector3(0.6, 0.4, 0));
    arc(0.35, 0.4, 0.25, 0, Math.PI);              // outer top bend
    pts.push(new THREE.Vector3(0.1, 0.1, 0));
    clipGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.filter((p, i) => i === 0 || p.distanceTo(pts[i - 1]) > 0.02)), 40, 0.07, 5);
    clipMat = mat(0xdfe3ea, { metalness: 0.55, roughness: 0.3, emissive: 0x2a3038 });
  }
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * radius;
    const clip = mesh(clipGeo, clipMat, Math.cos(a) * r, 0.25 + (1 - r / radius) * height * Math.random(), Math.sin(a) * r, g);
    clip.scale.setScalar(1.5);
    clip.rotation.set(-Math.PI / 2 + (Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.7, Math.random() * Math.PI * 2);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}
function makePile(x, z, amount, refill = 0, res = 'cereal') {
  const group = res === 'clips' ? clipsGroup(x, z, Math.round(8 + amount / 10), 3.5, 2.5) : loopsGroup(x, z, Math.round(18 + amount / 3), 3.5, 3);
  const p = { x, z, r: 3.5, amount, max: amount, refill, res, group };
  piles.push(p);
  return p;
}
function makeSpill(x, z, amount, life = 45) {
  if (amount < 1) return;
  spills.push({ x, z, r: 2, amount, life, res: 'cereal', group: loopsGroup(x, z, Math.min(14, 3 + Math.round(amount / 2)), 1.6, 0.6) });
}
function takeFrom(src, want) {
  const got = Math.min(want, src.amount);
  src.amount -= got;
  return got;
}

const WORKERS = {
  truck: { cost: 15, max: 6, hp: 70, r: 1.8, speed: 12, accel: 26, turn: 3.2, grip: 10, carry: 12 },
  digger: { cost: 20, max: 4, hp: 90, r: 1.9, speed: 8, accel: 18, turn: 2.6, grip: 12 },
};
function spawnWorker(role, team) {
  const w = WORKERS[role];
  const x = team === BLUE ? -52 : 52, z = (Math.random() - 0.5) * 10;
  // Every third worker a team makes prefers paperclips (only matters on levels that have them).
  const pref = state.spawned[team]++ % 3 === 2 ? 'clips' : 'cereal';
  const e = { kind: 'worker', role, team, pref, x, z, vx: 0, vz: 0, heading: team === BLUE ? 0 : Math.PI, r: w.r, hp: w.hp, maxHp: w.hp, load: 0, mesh: buildModel(role, team), think: 0 };
  entities.push(e);
  return e;
}
const workersOf = (team, role) => entities.filter((e) => e.kind === 'worker' && e.team === team && e.role === role && e.hp > 0);
function buyWorker(role, team) {
  if (state.over) return false;
  const w = WORKERS[role];
  if (workersOf(team, role).length >= w.max) { if (team === BLUE) { toast(`${w.max} ${role}s is the most`); sfx('no'); } return false; }
  if (state.cereal[team] < w.cost) { if (team === BLUE) { toast(`Need ${w.cost} cereal`); sfx('no'); } return false; }
  state.cereal[team] -= w.cost;
  spawnWorker(role, team);
  if (team === BLUE) { sfx('build'); toast(role === 'truck' ? 'Dump truck on the way' : 'Digger on the way'); }
  return true;
}
// Where a team can unload: its toy box, or any bottle cap it holds.
function nearestDrop(e) {
  const drops = [state.bases[e.team], ...outposts.filter((o) => o.owner === e.team)];
  return drops.reduce((b, d) => (dist2(e, d) < dist2(e, b) ? d : b));
}
const diggersAt = (pile, team) => workersOf(team, 'digger').filter((d) => d.pile === pile && dist2(d, pile) < (pile.r + 4) ** 2).length;
function workerThink(w, dt) {
  const spec = WORKERS[w.role];
  if (w.trojan) return trojanThink(w, dt);
  if (w.role === 'digger') {
    // Pick the fullest pile near home that has the fewest of our diggers, and stay with it.
    if (!w.pile || w.pile.amount <= 0) {
      const home = state.bases[w.team];
      const score = (p) => dist2(p, home) + workersOf(w.team, 'digger').filter((d) => d.pile === p).length * 900 - (w.pref === 'clips' && p.res === 'clips' && state.clips[w.team] < 60 ? 4000 : 0);
      w.pile = piles.filter((p) => p.amount > 0 && !p.island).sort((a, b) => score(a) - score(b))[0] || null;
    }
    const goal = w.pile || state.bases[w.team];
    steer(w, goal.x, goal.z, goal.r + 2.5, dt, spec, null);
    w.digging = w.pile && dist2(w, w.pile) < (w.pile.r + 4) ** 2;
    return;
  }
  // Trucks: fill up at a spill or pile, haul to the nearest drop, unload, repeat.
  if (w.load >= spec.carry || (w.load > 0 && w.going === 'drop')) {
    w.going = 'drop';
    const d = nearestDrop(w);
    steer(w, d.x, d.z, (d.r || 4) + 2, dt, spec, d.kind === 'base' ? null : undefined);
    if (dist2(w, d) < ((d.r || 4) + 4) ** 2) {
      state[w.loadRes === 'clips' ? 'clips' : 'cereal'][w.team] += w.load;
      if (w.team === BLUE && dist2(w, state.player) < 1600) sfx('pour');
      w.load = 0;
      w.going = 'fill';
    }
    return;
  }
  w.going = 'fill';
  w.think -= dt;
  if (w.think <= 0 || !w.src || w.src.amount <= 0) {
    w.think = 1;
    // On levels with paperclips a truck sticks to one kind per trip, and some trucks prefer clips.
    const want = w.load > 0 ? w.loadRes : state.level.resources.length > 1 ? (w.pref === 'clips' && state.clips[w.team] < 60 ? 'clips' : 'cereal') : null;
    const ok = (src) => src.amount > 0 && !src.island && (!want || src.res === want);
    const byDist = (a, b) => (dist2(w, a) - diggersAt(a, w.team) * 400) - (dist2(w, b) - diggersAt(b, w.team) * 400);
    const near = spills.filter((sp) => ok(sp) && dist2(w, sp) < 30 * 30).sort((a, b) => dist2(w, a) - dist2(w, b))[0];
    w.src = near || piles.filter(ok).sort(byDist)[0] || (w.load > 0 ? null : piles.filter((p) => p.amount > 0 && !p.island).sort(byDist)[0]) || null;
  }

// A 2-unit grid over the table; cells inside (or hugging) a block are closed.

function toast(text) { $('toast').textContent = text; toastTimer = 2.2; }

function nearestEnemy(from, range, team = from.team) {
  let best = null, bd = range * range;
  for (const e of entities) {
    if (e.team === team || e.hp <= 0 || (e.kind === 'player' && !e.alive) || e.trojan) continue;
    const d = dist2(from, e) - (e.r || 0) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

let lastScrape = 0;
function collideObstacles(e) {
  const half = W / 2 - e.r, halfD = D / 2 - e.r;
  if (e.x < -half) { e.x = -half; e.vx = Math.abs(e.vx) * 0.3; }
  if (e.x > half) { e.x = half; e.vx = -Math.abs(e.vx) * 0.3; }
  if (e.z < -halfD) { e.z = -halfD; e.vz = Math.abs(e.vz) * 0.3; }
  if (e.z > halfD) { e.z = halfD; e.vz = -Math.abs(e.vz) * 0.3; }
  for (const o of obstacles) {
    const cx = Math.max(o.x - o.w / 2, Math.min(e.x, o.x + o.w / 2));
    const cz = Math.max(o.z - o.d / 2, Math.min(e.z, o.z + o.d / 2));
    const dx = e.x - cx, dz = e.z - cz, d = Math.hypot(dx, dz);
    if (o.kind === 'eraser' && e.kind === 'player' && !o.blocked && d < e.r && d > 1e-4) {
      // Shove: the eraser gives way and slides off; you lose some speed doing it.
      const nx = dx / d, nz = dz / d, vn = e.vx * nx + e.vz * nz;
      o.x -= nx * (e.r - d); o.z -= nz * (e.r - d);
      if (vn < 0) {
        o.vx = nx * vn * 0.9; o.vz = nz * vn * 0.9;
        e.vx -= 0.4 * vn * nx; e.vz -= 0.4 * vn * nz;
        if (state.time - lastScrape > 0.3) { sfx('scrape'); lastScrape = state.time; }
      }
    } else if (d < e.r && d > 1e-4) {
      const push = (e.r - d) / d;
      e.x += dx * push; e.z += dz * push;
      const nx = dx / d, nz = dz / d, vn = e.vx * nx + e.vz * nz;
      if (vn < 0) { e.vx -= 1.5 * vn * nx; e.vz -= 1.5 * vn * nz; }
    } else if (d <= 1e-4) {
      e.x += e.r; // inside a block: nudge out
    }
  }
  if (state.water) waterPush(e);
}

function collideMovers() {
  const movers = entities.filter((e) => (e.kind === 'unit' || e.kind === 'worker' || e.kind === 'boss' || (e.kind === 'player' && e.alive)) && e.hp > 0);
  for (let i = 0; i < movers.length; i++) {
    for (let j = i + 1; j < movers.length; j++) {
      const a = movers[i], b = movers[j], dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), min = a.r + b.r;
      if (d < min && d > 1e-4) {
        const push = (min - d) / d / 2;
        a.x -= dx * push; a.z -= dz * push; b.x += dx * push; b.z += dz * push;
        // Monster trucks crush what they ram.
        if (a.kind === 'player' && VEHICLES[a.vehicle].ram && b.team !== a.team) hurt(b, VEHICLES[a.vehicle].ram * state.dt, a.team);
        if (b.kind === 'player' && VEHICLES[b.vehicle].ram && a.team !== b.team) hurt(a, VEHICLES[b.vehicle].ram * state.dt, b.team);
      }
    }
  }
}

// Drive towards a direction (unit vector dx,dz) with a throttle 0..1.
function drive(e, dx, dz, throttle, dt, stats) {
  if (e.pinned > 0) { e.pinned -= dt; e.vx *= 0.8; e.vz *= 0.8; return; } // stapled to the table
  if (throttle > 0.05) {
    const want = Math.atan2(dz, dx), diff = wrap(want - e.heading);
    e.heading += Math.sign(diff) * Math.min(Math.abs(diff), stats.turn * dt);
    const facing = Math.max(0, Math.cos(diff)) * 0.7 + 0.3;
    e.vx += Math.cos(e.heading) * stats.accel * throttle * facing * dt;
    e.vz += Math.sin(e.heading) * stats.accel * throttle * facing * dt;
  }
  const patch = patchAt(e.x, e.z);
  let grip = stats.grip, top = stats.speed;
  if (e.kind === 'player' && state.buff?.[BLUE]?.kind === 'turbo') top *= 1.45; // gumball turbo
  if (e.spin > 0) grip *= 0.15; // spun out on butter or by a marble
  if (patch === 'juice' && !stats.floats) grip *= 0.12;
  if (patch === 'cereal' && !stats.floats && !stats.rough) top *= 0.45;

  const fx = Math.cos(e.heading), fz = Math.sin(e.heading);
  let fwd = e.vx * fx + e.vz * fz, side = -e.vx * fz + e.vz * fx;
  side *= Math.exp(-grip * dt);
  fwd *= Math.exp(-(throttle > 0.05 ? 0.4 : 2.2) * dt);

  if (fwd < -top * 0.4) fwd = -top * 0.4;
  e.vx = fx * fwd - fz * side; e.vz = fz * fwd + fx * side;
  e.x += e.vx * dt; e.z += e.vz * dt;
  collideObstacles(e);
}

function fire(from, target, weapon, angle) {

  const a = (angle ?? angleTo(from, target)) + spread;
  const m = new THREE.Mesh(shared(`shot:${!!weapon.homing}:${weapon.size}`, () => (weapon.homing ? new THREE.ConeGeometry(weapon.size, weapon.size * 3, 6) : new THREE.SphereGeometry(weapon.size, 6, 5))),

  const muzzle = from.kind === 'base' ? 1.5 : (from.r || 1) + 0.5;
  const ox = Math.cos(a) * muzzle, oz = Math.sin(a) * muzzle;
  m.position.set(from.x + ox, y, from.z + oz);
  scene.add(m);
  if (weapon.lob && target) {
    // Lobbed: fly to where the target is now, in a high arc, ignoring walls; land and splash.
    const tx = target.x + (Math.random() - 0.5) * 2, tz = target.z + (Math.random() - 0.5) * 2, T = weapon.lob;
    shots.push({ x: from.x + ox, z: from.z + oz, y, y0: y, vx: (tx - from.x - ox) / T, vz: (tz - from.z - oz) / T, team: from.team, weapon, target: null, life: T, T, lobbed: true, mesh: m });
  } else
  shots.push({ x: from.x + ox, z: from.z + oz, y, vx: Math.cos(a) * weapon.speed, vz: Math.sin(a) * weapon.speed, team: from.team, weapon, target, life: weapon.life || weapon.range / weapon.speed * 1.3, mesh: m });

}

// Shared shapes and colours for shots and sparks, made once: making new ones for every shot ran iPads out of memory.
const sparkGeo = () => shared('spark', () => new THREE.BoxGeometry(0.5, 0.5, 0.5));

function disposeTree(obj) {
  obj?.traverse?.((o) => {
    if (o.geometry && !o.geometry.userData?.shared) o.geometry.dispose();
    const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];

}
function burst(x, z, color, n = 12, power = 10, y = 1.5) {
  if (parts.length > 400) n = Math.min(n, 2); // a big fight already has plenty of sparks
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(sparkGeo(), basicMat(color));
    m.position.set(x, y, z);
    scene.add(m);
    const a = Math.random() * Math.PI * 2, s = Math.random() * power;
    parts.push({ mesh: m, vx: Math.cos(a) * s, vy: Math.random() * power, vz: Math.sin(a) * s, life: 0.6 + Math.random() * 0.5 });

function hurt(e, dmg, byTeam, weapon) {

  if (e.armor) dmg = Math.max(1, dmg - e.armor); // the Stapler's armour soaks small hits: guns barely scratch it

  if (e.kind === 'base' && state.shield?.[e.team] > state.time) dmg *= 0.2;
  if (e.kind === 'base' && e.team === RED && state.boss?.hp > 0) dmg *= 0.5; // the boss's bubble shield
  if (byTeam != null && state.buff?.[byTeam]?.kind === 'double') dmg *= 2;
  if (e.kind === 'player' && state.buff?.[BLUE]?.kind === 'armour') dmg *= 0.5;
  // Paperclip armour on your car: each plate takes 15% off every hit (3 plates at most).
  if (e.kind === 'player' && state.plates) dmg *= 1 - 0.15 * state.plates;
  // Staples pin a car in place for a moment (a boss only flinches).
  if (weapon?.pin && e.kind !== 'base' && e.kind !== 'turret') {
    const pin = e.kind === 'boss' ? weapon.pin * 0.25 : weapon.pin;
    if (!(e.pinned > 0)) burst(e.x, e.z, 0xd9dde3, 4, 4, 1.2);
    e.pinned = Math.max(e.pinned || 0, pin);

  e.hp -= e.kind === 'base' ? dmg * (weapon?.vsBase ?? 0.3) : dmg;
  const near = dist2(e, state.player) < 1600;
  if (e.hp > 0) {
    // Feel: a plink and a spark when a shot lands near you; your own toy box shakes the screen when it's hit.
    if (near && weapon && Math.random() < 0.5) { sfx('hit'); burst(e.x, e.z, 0xfff3b0, 3, 5, 1.6); }
    if (e === state.bases?.[BLUE] && weapon) state.shake = Math.min(1.2, (state.shake || 0) + 0.05);
    return;
  }

  burst(e.x, e.z, big ? 0xffc23d : 0xff7b00, e.kind === 'base' ? 60 : e.kind === 'boss' ? 40 : 16, big ? 22 : 11);
  if (near || big) { sfx(big ? 'bigBoom' : e.kind === 'player' ? 'wreck' : 'boom'); state.shake = Math.min(1.6, (state.shake || 0) + (big ? 1.6 : e.kind === 'unit' || e.kind === 'worker' ? 0.3 : 0.6)); }

    e.alive = false; e.mesh.visible = false; state.respawn = 3; toast('Wrecked! Back in 3…');
    return;
  }

  if (e.kind === 'boss') {
    const spill = state.level.rules.boss.spill;
    if (e.type === 'duck') {
      // It sinks in the water, so the prize goes straight to you.
      state.cereal[BLUE] += spill;
      for (const c of LOOP_COLORS) burst(e.x, e.z, c, 6, 14, 3);
      sfx('quack'); toast(`The Rubber Duck squeaks and sinks! +${spill} cereal`);
    } else {
      makeSpill(e.x, e.z, spill, 90);
      toast(`The Stapler is jammed! ${spill} cereal spilled`);
    }
    $('bossbar').hidden = true;
    bossShield(false); banner(e.type === 'duck' ? 'DUCK SUNK!' : 'STAPLER JAMMED!', 'Their shield is down: go and smash their toy box');
  }
  if (e.kind === 'boat') burst(e.x, e.z, 0x9fe0ff, 14, 9, 1); // sinks in a splash
  if (e.kind === 'unit') makeSpill(e.x, e.z, Math.round(e.reward * 1.5));
  if (e.kind === 'turret') makeSpill(e.x, e.z, 12);
  if (e.kind === 'worker') { makeSpill(e.x, e.z, Math.round(e.load) + 5); if (e.team === BLUE) { toast(`Lost a ${e.role}!`); if (e.role === 'truck') state.trucksLost++; } }

// ---------- Building ----------
const TURRETS = {
  gun: { name: 'Gun', cost: 25, weapon: WEAPONS.mg, hp: 140, range: 17, rate: 0.13, dmg: 6 },
  rocket: { name: 'Rocket', cost: 40, weapon: WEAPONS.missile, hp: 120, range: 26, rate: 0.9, dmg: 22 },
  // Paperclip levels only: bursts of staples that pin cars in place.
  // A fridge magnet on a stalk: pulls loose cereal in (it counts as hauled) and drags enemy cars nearby. No gun.
  magnet: { name: 'Magnet', cost: 30, weapon: { range: 12, rate: 1, dmg: 0, speed: 1, color: 0, size: 0 }, hp: 160, range: 12, rate: 1, dmg: 0 },
  catapult: { name: 'Catapult', cost: 45, weapon: WEAPONS.eraser, hp: 110, range: 44, rate: 3.2, dmg: 30 },
  staple: { name: 'Staple gun', cost: 20, weapon: WEAPONS.staple, hp: 130, range: 18, rate: 0.12, dmg: 5, burst: 4, reload: 1.6 },

const costOf = (type) => Math.round(TURRETS[type].cost * (VEHICLES[state.player.vehicle].builder ? 0.5 : 1));

const priceText = (type) => costOf(type) + (clipsOf(type) ? ` + ${clipsOf(type)} clips` : '');
function makeTurret(type, team, x, z) {
  const t = TURRETS[type];
  const g = new THREE.Group();
  mesh(new THREE.CylinderGeometry(1.6, 2, 1.4, 12), mat(0x55504a), 0, 0.7, 0, g);
  const head = mesh(new THREE.BoxGeometry(1.8, 1.1, 1.6), mat(COLORS[team]), 0, 2, 0, g);
  head.name = 'turret';
  if (type === 'gun') for (const z2 of [-0.4, 0.4]) mesh(new THREE.CylinderGeometry(0.18, 0.18, 2, 6), mat(0x1c1712), 1.6, 0, z2, head).rotation.z = Math.PI / 2;
  else if (type === 'staple') { // a little desk stapler on the turret: grey base, red arm
    mesh(new THREE.BoxGeometry(2.6, 0.35, 0.9), mat(0x9aa0a8, { metalness: 0.4 }), 0.6, 0.55, 0, head);
    mesh(new THREE.BoxGeometry(2.4, 0.45, 0.8), mat(0xc8281f), 0.7, 0.95, 0, head).rotation.z = 0.12;
  } else if (type === 'magnet') { // horseshoe magnet: red with silver tips
    const red = mat(0xd62f2f);
    for (const sz of [-0.55, 0.55]) { mesh(new THREE.BoxGeometry(0.5, 1.8, 0.45), red, 0, 1.1, sz, head); mesh(new THREE.BoxGeometry(0.52, 0.4, 0.47), mat(0xd9dde3, { metalness: 0.6 }), 0, 2.1, sz, head); }
    mesh(new THREE.BoxGeometry(0.5, 0.45, 1.55), red, 0, 0.25, 0, head);
  } else if (type === 'catapult') { // lolly-stick arm, rubber band, a pink eraser ready in the cup
    mesh(new THREE.BoxGeometry(3.2, 0.2, 0.5), mat(0xe8c48a), 0.2, 1.0, 0, head).rotation.z = 0.5;
    mesh(new THREE.TorusGeometry(0.45, 0.08, 4, 10), mat(0xc79a3d), -0.6, 0.7, 0, head);
    mesh(new THREE.BoxGeometry(0.8, 0.5, 0.6), mat(0xf4a6b8), 1.4, 1.8, 0, head);
  } else mesh(new THREE.BoxGeometry(1.4, 0.9, 1.4), mat(0xfff8ec), 0.6, 0.6, 0, head);
  const pips = new THREE.Group();
  g.add(pips);
  g.position.set(x, 0, z);
  scene.add(g);
  const tur = { kind: 'turret', type, team, x, z, r: 1.8, level: 1, hp: t.hp, maxHp: t.hp, weapon: { ...t.weapon, range: t.range, rate: t.rate, dmg: t.dmg }, cool: 0, mesh: g, pips, burst: t.burst || 0, reload: t.reload || 0, shotsLeft: t.burst || 0 };

}
function canPlace(x, z, team) {
  if (Math.abs(x) > W / 2 - 3 || Math.abs(z) > D / 2 - 3) return 'Too close to the edge';
  if (inWaterX(x, z, 3)) return 'No building on the water or the bridge';
  if (obstacles.some((o) => Math.abs(x - o.x) < o.w / 2 + 2 && Math.abs(z - o.z) < o.d / 2 + 2)) return 'Something is in the way: build where the circle is green';
  const enemyBase = state.bases[1 - team];
  // Further than any turret can reach (rockets at level 3 reach ~33), so toy boxes fall to cars, not sniping.
  if (dist2({ x, z }, enemyBase) < 36 * 36) return 'Too close to their toy box';
  if (entities.filter((e) => e.kind === 'turret' && e.team === team && e.hp > 0).length >= 10) return 'Turret limit reached (10)';

function build(type) {
  const p = state.player;
  if (!p.alive || state.over) return;
  const cost = costOf(type);
  const x = p.x - Math.cos(p.heading) * 4, z = p.z - Math.sin(p.heading) * 4; // drop it behind you
  const why = canPlace(x, z, BLUE);
  if (why) { toast(why); sfx('no'); return; }
  const clips = clipsOf(type);
  if (state.cereal[BLUE] < cost || state.clips[BLUE] < clips) { toast(`Need ${priceText(type)}`); sfx('no'); return; }
  state.cereal[BLUE] -= cost; state.clips[BLUE] -= clips;
  makeTurret(type, BLUE, x, z);

// ---------- Domino run: line them up, knock the first, the last one falls on their toy box ----------
const dominoes = [];

function placeDomino() {
  const p = state.player;

  if (dominoes.filter((d) => d.team === BLUE).length >= 40) { toast('40 dominoes is the most'); sfx('no'); return; }
  if (state.cereal[BLUE] < 4) { toast('Need 4 cereal'); sfx('no'); return; }
  const x = p.x - Math.cos(p.heading) * 4, z = p.z - Math.sin(p.heading) * 4;
  if (Math.abs(x) > W / 2 - 2 || Math.abs(z) > D / 2 - 2 || inWaterX(x, z, 1) || obstacles.some((o) => Math.abs(x - o.x) < o.w / 2 + 0.8 && Math.abs(z - o.z) < o.d / 2 + 0.8)) { toast('No room for a domino here'); sfx('no'); return; }
  state.cereal[BLUE] -= 4;
  addDomino(x, z, Math.cos(p.heading), Math.sin(p.heading), BLUE);

// A domino stands across its line, so a run falls along the way it was laid. Theirs are red with white spots.
function addDomino(x, z, dx, dz, team, fixed = false) {

  const face = fixed ? 0xfff3d6 : team === BLUE ? 0xfaf6ee : 0xb3261e, spot = fixed ? COLORS[team] : team === BLUE ? 0x1c1712 : 0xfaf6ee;

  for (const [py, pz] of [[1.2, -0.6], [1.2, 0.6], [4.3, 0], [3.7, -0.6], [4.9, 0.6]]) mesh(new THREE.BoxGeometry(0.84, 0.3, 0.3), mat(spot), 0, py, pz, body);

  jam: { name: 'Jam blob', icon: '🍓', how: 'drop' },       // dropped behind: sticky, slows cars right down
  marble: { name: 'Marble', icon: '🔮', how: 'fire' },      // fired ahead: bounces off walls, smashes the first car it meets

// Spin out: a car on butter loses grip and spins; on jam it's stuck nearly still.
function itemsUpdate(dt) {
  for (let i = traps.length - 1; i >= 0; i--) {

}

// Find a clear spot near the middle for the machine (levels with gumball: true).
function placeGumball() {

// ---------- Paperclip armour: plates bolted onto your car (paperclip levels) ----------

// ---------- Enemy commander ----------
// Earns like you. Builds before it attacks: a turret on every cap it holds,

// The first minute is gentle (scouts only, slower income) so you can learn.
const RED_HOME = [[48, -12], [48, 12], [44, 0]];
function spotNear(x, z, team) {
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2, r = 6 + (i % 3);
    const sx = x + Math.cos(a) * r, sz = z + Math.sin(a) * r;
    if (!canPlace(sx, sz, team)) return [sx, sz];
  }

}
function redTurrets() { return entities.filter((e) => e.kind === 'turret' && e.team === RED && e.hp > 0); }
function commanderBuild(ramp) {
  if (state.time < 60) return false; // a quiet first minute
  const cereal = state.cereal, mine = redTurrets();
  const bare = outposts.filter((o) => o.owner === RED && !mine.some((t) => dist2(t, o) < 100));
  const homeCount = mine.filter((t) => t.x > 38).length;
  const homeWanted = state.time > 45 ? Math.min(3, 1 + Math.floor(state.time / 90)) : 0;
  let spot = null;
  if (bare.length) spot = spotNear(bare[0].x, bare[0].z, RED);

    let type = Math.random() < 0.6 ? 'gun' : 'rocket';
    const need = state.level.turretClips?.[type] || 0;
    if (need > state.clips[RED]) type = 'gun'; // no paperclips for a rocket yet
    else state.clips[RED] -= need;
    cereal[RED] -= 25;
    const t = makeTurret(type, RED, spot[0], spot[1]);

    if (dist2(t, state.player) < 40 * 40) toast('They built a turret!');
    return false;
  }
  const weak = mine.filter((t) => t.level < 3).sort((x, y) => x.level - y.level)[0];
  if (weak && state.time > 90 && cereal[RED] >= 60 && Math.random() < 0.25 + ramp * 0.3) {
    cereal[RED] -= 20 + weak.level * 15;

  }

}
function commander(dt) {
  state.aiClock -= dt;

  state.aiClock = 1;
  const ramp = Math.min(1, state.time / 300);
  // Economy first: enough trucks and diggers for the stage of the game.
  const trucksWanted = Math.min(4, 1 + Math.floor(state.time / 50)), diggersWanted = Math.min(3, 1 + Math.floor(state.time / 80));
  if (workersOf(RED, 'truck').length < trucksWanted) { buyWorker('truck', RED); return; }
  if (workersOf(RED, 'digger').length < diggersWanted) { buyWorker('digger', RED); return; }
  if (commanderBuild(ramp)) return;
  const roll = Math.random();
  let want = state.time < 60 ? 'scout' : roll < 0.5 - ramp * 0.25 ? 'scout' : roll < 0.85 - ramp * 0.15 ? 'buggy' : 'heavy';
  const heavyClips = state.level.heavyClips || 0; // the enemy's tanks cost paperclips too

  // A small army early on (3, then 5), growing to 14 late: it should build up, not rush.
  const armyCap = state.time < 60 ? 3 : state.time < 120 ? 5 : 8 + Math.floor(ramp * 6);
  if (army < armyCap && state.cereal[RED] >= price + 10) {
    state.cereal[RED] -= price;

    spawnUnit(want, RED, 54, (Math.random() - 0.5) * 12);
  }

// ---------- The enemy's tricks: a domino run at your toy box, and hijacking your trucks ----------
// From 3:00 the enemy sends a domino layer about every 2.5 minutes, and a hijacker about every 2 minutes from 2:30.
function enemyTricks() {
  // The Gumball Machine: now and then a car goes and rams their side of it; items get used when one of their cars is near you.
  if (gumball) {
    const spot = gumball.spot ||= { x: gumball.x + 6, z: gumball.z, ready: true };
    if (state.cereal[RED] >= 40 && gumball.cool[RED] <= 0 && state.time > 45 && !entities.some((e) => e.presser === spot && e.hp > 0)) {
      const car = entities.filter((e) => e.kind === 'unit' && e.team === RED && e.hp > 0 && !e.plan && !e.presser).sort((a, b) => dist2(a, spot) - dist2(b, spot))[0];
      if (car && Math.random() < 0.02) car.presser = spot;
    }
    for (const e of entities) if (e.presser === spot && e.hp > 0 && dist2(e, spot) < 49) { e.presser = null; if (gumball.cool[RED] <= 0) spinGumball(RED); }
  }
  if (state.redItems.length && state.player.alive) {
    const near = entities.find((e) => e.kind === 'unit' && e.team === RED && e.hp > 0 && dist2(e, state.player) < 22 * 22);
    if (near) useItem(RED, near);
  }
  // Their level domino run: from 1:40, send the nearest car to press the button whenever it's set up.
  const run = state.runs.find((r) => r.team === RED);
  if (run && run.ready && state.time > 100 && !entities.some((e) => e.presser === run && e.hp > 0)) {
    // Send a Monster buggy if they have one; otherwise the nearest cars until they weigh enough together.
    const cars = entities.filter((e) => e.kind === 'unit' && e.team === RED && e.hp > 0 && !e.plan && e.type !== 'hijacker').sort((a, b) => dist2(a, run) - dist2(b, run));
    const big = cars.find((e) => weightOf(e) >= BUTTON_WEIGHT);
    let crew = big ? [big] : [], w = big ? weightOf(big) : 0;
    for (const c of cars) { if (w >= BUTTON_WEIGHT) break; if (!crew.includes(c)) { crew.push(c); w += weightOf(c); } }
    if (w >= BUTTON_WEIGHT) for (const c of crew) c.presser = run;
  }
  if (state.time >= state.nextLayer && state.cereal[RED] >= 40) {
    const plan = planDominoRun();
    if (plan) {
      state.cereal[RED] -= 40; state.nextLayer = state.time + 150;
      const u = spawnUnit('layer', RED, 54, 0); u.plan = plan; u.step = 0; u.stage = 'go';
      toast('Their builder is lining up dominoes at your toy box!'); sfx('raid');
    } else state.nextLayer = state.time + 20;
  }
  if (state.time >= state.nextHijack && state.cereal[RED] >= 25 && workersOf(BLUE, 'truck').some((t) => !t.trojan)) {
    state.cereal[RED] -= 25; state.nextHijack = state.time + 120;

    toast('A hijacker is after your trucks!');
  }
}
// A straight run of 5–6 dominoes ending just short of your toy box, from a side with room for it.
function planDominoRun() {
  const home = state.bases[BLUE], foe = state.bases[RED];
  const toward = Math.atan2(foe.z - home.z, foe.x - home.x);
  for (let tries = 0; tries < 10; tries++) {
    const a = toward + (Math.random() - 0.5) * 1.6;
    const ox = Math.cos(a), oz = Math.sin(a), n = 5 + Math.floor(Math.random() * 2);
    const spots = [];
    for (let i = 0; i < n; i++) {
      const r = 9.5 + (n - 1 - i) * 4.2; // the last one stands 9.5 out, so its top lands on the box
      spots.push({ x: home.x + ox * r, z: home.z + oz * r });
    }
    const clear = spots.every((q) => Math.abs(q.x) < W / 2 - 2 && !inWaterX(q.x, q.z, 1.5) && Math.abs(q.z) < D / 2 - 2 && !obstacles.some((o) => o.kind !== 'base' && Math.abs(q.x - o.x) < o.w / 2 + 1 && Math.abs(q.z - o.z) < o.d / 2 + 1));
    if (clear) return { spots, dx: -ox, dz: -oz }; // falls towards your box
  }
  return null;
}
function layerThink(u, dt) {
  const P = u.plan;
  if (u.stage === 'go' || u.stage === 'lay') {
    const q = P.spots[u.step];
    const d = steer(u, q.x, q.z, 0.8, dt, { speed: u.speed, accel: u.speed * 2.2, turn: u.turn, grip: u.grip });
    if (d < 1.6) {
      u.stage = 'lay';
      const dom = addDomino(q.x, q.z, P.dx, P.dz, RED); u.doms = u.doms || []; u.doms.push(dom);
      if (dist2(u, state.player) < 2500) sfx('clack');
      u.step++;
      if (u.step >= P.spots.length) { u.stage = 'back'; u.vx = u.vz = 0; }
    }
    return;
  }
  if (u.stage === 'back') {
    // Back off behind the first domino, then drive into it.
    const first = P.spots[0], bx = first.x - P.dx * 5, bz = first.z - P.dz * 5;
    const d = steer(u, bx, bz, 0.8, dt, { speed: u.speed, accel: u.speed * 2.2, turn: u.turn, grip: u.grip });
    if (d < 1.8) u.stage = 'push';
    return;
  }
  if (u.stage === 'push') {
    const first = u.doms?.[0];
    if (!first || first.falling) { u.stage = 'home'; return; }
    steer(u, first.x + P.dx * 2, first.z + P.dz * 2, 0, dt, { speed: u.speed, accel: u.speed * 2.2, turn: u.turn, grip: u.grip });

  if (!truck) { u.type = 'scout'; return; }
  steer(u, truck.x, truck.z, 0, dt, { speed: u.speed, accel: u.speed * 2.2, turn: u.turn, grip: u.grip });
  if (dist2(u, truck) < 4 * 4) {

  }
}

// ---------- Unit brains ----------
function unitThink(u, dt) {
  if (u.type === 'hijacker') return hijackerThink(u, dt);
  if (u.type === 'layer') return layerThink(u, dt);
  if (u.presser) {
    // Sent to press their domino button.
    const b = u.presser;
    if (!b.ready) u.presser = null;
    else { steer(u, b.x, b.z, 0, dt, { speed: u.speed, accel: u.speed * 2.2, turn: u.turn, grip: u.grip }); return; }
  }
  u.think -= dt;
  if (u.think <= 0) {
    u.think = 0.4 + Math.random() * 0.3;
    // Raiders go straight for the nearest truck of yours, wherever it is.
    const truck = u.raid ? workersOf(1 - u.team, 'truck').sort((a, b) => dist2(u, a) - dist2(u, b))[0] : null;
    u.target = truck || nearestEnemy(u, 15);
    if (!u.target || u.target.kind === 'boat') {
      const mine = (o) => o.owner === u.team && o.progress * (u.team === BLUE ? 1 : -1) >= 1;
      const open = outposts.filter((o) => !mine(o)).sort((a, b) => dist2(u, a) - dist2(u, b));
      u.goal = open[0] || state.bases[1 - u.team];
    }
  }
  const t = u.target && u.target.hp > 0 && !(u.target.kind === 'player' && !u.target.alive) ? u.target : null;
  const chase = t && t.kind !== 'boat' ? t : null; // boats are shot at from the bank, never chased
  const goal = chase || u.goal || state.bases[1 - u.team];
  const stop = chase ? Math.min(u.weapon.range * 0.7, 10) : goal.r ? goal.r * 0.5 : 1;
  steer(u, goal.x, goal.z, stop, dt, { speed: u.speed, accel: u.speed * 2.2, turn: u.turn, grip: u.grip }, goal);
  u.cool -= dt;
  if (t && u.cool <= 0 && dist2(u, t) < u.weapon.range ** 2) { u.cool = u.weapon.rate * 1.6; fire(u, t, u.weapon); }
}

// ---------- Boats (level 4) ----------
const boatsOf = (team) => entities.filter((e) => e.kind === 'boat' && e.team === team && e.hp > 0);
function launchBoat(team, type) {
  const B = BOATS[type], w = state.water, n = boatsOf(team).length;
  const e = {
    kind: 'boat', type, team, x: team === BLUE ? w.x0 + 4 : w.x1 - 4, z: (n % 2 ? 1 : -1) * 11 + (Math.random() - 0.5) * 4, vx: 0, vz: 0,
    heading: Math.PI / 2 * (n % 2 ? 1 : -1), r: B.r, hp: B.hp, maxHp: B.hp, speed: B.speed, turn: B.turn, weapon: WEAPONS[B.weapon],
    cool: 0.5, mesh: buildModel(type, team), think: 0, dir: n % 2 ? 1 : -1, lane: (Math.random() - 0.5) * 12, target: null,
  };
  entities.push(e);
  return e;
}
function buyBoat() {
  const p = state.player;
  if (!state.level.boats || !p.alive || state.over) return;
  if (boatsOf(BLUE).length >= BOAT_CAP) { toast(`${BOAT_CAP} boats is the most`); sfx('no'); return; }
  if (state.cereal[BLUE] < BOATS.gunboat.cost) { toast(`Need ${BOATS.gunboat.cost} cereal`); sfx('no'); return; }
  state.cereal[BLUE] -= BOATS.gunboat.cost;
  launchBoat(BLUE, 'gunboat');
  sfx('build'); toast('Gunboat launched');
}
// Patrols up and down the channel in a lane, shoots what comes in range (boats, cars on the bank, the bridge), and slows to fight.
function boatThink(b, dt) {
  const w = state.water;
  b.think -= dt; b.cool -= dt;
  if (b.think <= 0) { b.think = 0.35; b.target = nearestEnemy(b, b.weapon.range); }
  if ((b.dir > 0 && b.z > D / 2 - 9) || (b.dir < 0 && b.z < -D / 2 + 9)) { b.dir = -b.dir; b.lane = (Math.random() - 0.5) * (w.x1 - w.x0 - 8); }
  const gx = Math.max(w.x0 + 3, Math.min(w.x1 - 3, b.lane)), want = Math.atan2(b.dir * 20, gx - b.x), diff = wrap(want - b.heading);
  b.heading += Math.sign(diff) * Math.min(Math.abs(diff), b.turn * dt);
  const t = b.target && b.target.hp > 0 && !(b.target.kind === 'player' && !b.target.alive) ? b.target : null;
  const sp = b.speed * (t ? 0.55 : 1), k = 1 - Math.exp(-2 * dt);
  b.vx += (Math.cos(b.heading) * sp - b.vx) * k; b.vz += (Math.sin(b.heading) * sp - b.vz) * k;
  b.x += b.vx * dt; b.z += b.vz * dt;
  // Stay on water cells: inside the channel, off the island, round the ferries, apart from each other.
  const lo = w.x0 + b.r + 0.3, hi = w.x1 - b.r - 0.3;
  if (b.x < lo) { b.x = lo; b.vx = Math.abs(b.vx) * 0.3; } else if (b.x > hi) { b.x = hi; b.vx = -Math.abs(b.vx) * 0.3; }
  b.z = Math.max(-D / 2 + 3, Math.min(D / 2 - 3, b.z));
  const keepOut = (cx, cz, R) => { const dx = b.x - cx, dz = b.z - cz, d = Math.hypot(dx, dz); if (d < R && d > 1e-3) { b.x = cx + dx / d * R; b.z = cz + dz / d * R; } };
  keepOut(w.island.x, w.island.z, w.island.r + b.r);
  for (const f of ferries) keepOut(f.x, f.z, f.R + b.r - 0.5);
  for (const o of entities) if (o !== b && o.kind === 'boat' && o.hp > 0) { const dx = b.x - o.x, dz = b.z - o.z, d = Math.hypot(dx, dz), m = b.r + o.r; if (d < m && d > 1e-3) { b.x += dx / d * (m - d) / 2; b.z += dz / d * (m - d) / 2; } }
  const head = b.mesh.getObjectByName('turret');
  if (t) {
    if (head) head.rotation.y = -angleTo(b, t) + b.heading;
    if (b.cool <= 0 && dist2(b, t) < (b.weapon.range + t.r) ** 2) { b.cool = b.weapon.rate * 1.5; fire(b, t, b.weapon); }

}
// The enemy commander launches a gunboat or a sponge raft every half minute or so, up to three at a time.
function enemyBoats() {

  state.nextBoat = state.time + 26 + Math.random() * 10;
  const type = Math.random() < 0.4 ? 'raft' : 'gunboat';
  if (boatsOf(RED).length >= BOAT_CAP || state.cereal[RED] < BOATS[type].cost + 15) return;
  state.cereal[RED] -= BOATS[type].cost;

      const before = o.owner;
      o.progress = Math.max(-1, Math.min(1, o.progress + push * dt / 2.5));
      if (o.progress >= 1) o.owner = BLUE; else if (o.progress <= -1) o.owner = RED; else if (Math.sign(o.progress) !== (o.owner === BLUE ? 1 : o.owner === RED ? -1 : 0)) o.owner = -1;
      if (o.owner !== before && o.owner !== -1) {
        state.cereal[o.owner] += 5;
        if (o.owner === BLUE) { toast('Bottle cap captured: trucks can unload here'); sfx('cap'); } else if (dist2(o, p) < 900) toast('They took a cap!');
      }
    }
  }

  // Scoop spills by driving over them; shrink piles; old spills blow away.
  for (let i = spills.length - 1; i >= 0; i--) {
    const sp = spills[i];
    sp.life -= dt;
    if (p.alive && sp.amount > 0 && dist2(p, sp) < (sp.r + p.r) ** 2) {
      const got = Math.round(takeFrom(sp, sp.amount));
      state.cereal[BLUE] += got;
      toast(`Scooped ${got} cereal`); sfx('crunch');
    }
    if (sp.amount <= 0 || sp.life <= 0) { scene.remove(sp.group); disposeTree(sp.group); spills.splice(i, 1); }
  }
  for (const pl of piles) {
    if (pl.refill) pl.amount = Math.min(pl.max, pl.amount + pl.refill * dt);
    const k = 0.25 + 0.75 * (pl.amount / pl.max);
    pl.group.scale.set(k, k, k);
    pl.group.visible = pl.amount > 0;
  }

  commander(dt);
  enemyBoats();
  enemyTricks();
  runsUpdate(dt);
  gumballUpdate(dt);
  itemsUpdate(dt);

  // HUD
  $('cereal').textContent = `${Math.floor(state.cereal[BLUE])} cereal`;
  $('clipsHud').hidden = state.level.resources.length < 2;
  $('clipsHud').textContent = `${Math.floor(state.clips[BLUE])} clips`;
  $('hpBlue').style.width = `${Math.max(0, state.bases[BLUE].hp / state.bases[BLUE].maxHp) * 100}%`;
  const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const eco = (t) => `${count(workersOf(t, 'truck').length, 'truck')} · ${count(workersOf(t, 'digger').length, 'digger')}`;
  $('ecoBlue').textContent = eco(BLUE);
  $('ecoRed').textContent = eco(RED);
  for (const [t, id] of [[BLUE, 'pctBlue'], [RED, 'pctRed']]) $(id).textContent = `${Math.max(0, Math.ceil(state.bases[t].hp / state.bases[t].maxHp * 100))}%`;
  $('hpRed').style.width = `${Math.max(0, state.bases[RED].hp / state.bases[RED].maxHp) * 100}%`;
  [...$('pips').children].forEach((el, i) => { el.style.background = ['#9a8f80', '#2f7df6', '#ef4136'][outposts[i].owner + 1]; });
  const atHome = p.alive && dist2(p, state.bases[BLUE]) < 16 * 16;
  if ($('garage').hidden === atHome) { $('garage').hidden = !atHome; if (atHome) renderGarage(); }
  const t = nearOwnTurret();
  $('bUpgrade').disabled = !t;
  $('upCost').textContent = t ? upgradeCost(t) : '—';
  toastTimer -= dt;
  if (toastTimer <= 0) $('toast').textContent = '';
}

const camTarget = new THREE.Vector3();
let ghost = null;
function render(dt) {
  const time = performance.now() / 1000;
  for (const e of entities) {
    if (!e.mesh || (e.kind !== 'unit' && e.kind !== 'player' && e.kind !== 'worker' && e.kind !== 'boss' && e.kind !== 'boat')) continue;
    const floats = e.kind === 'player' && VEHICLES[e.vehicle].floats;
    e.mesh.position.set(e.x, (floats ? 0.4 + Math.sin(time * 6) * 0.15 : 0) + (state.water ? bridgeLift(e) + (onFerry(e) ? 0.9 : 0) : 0), e.z);
    e.mesh.rotation.y = -e.heading;
    if (e.type === 'duck') { e.mesh.position.y = 0.7 + Math.sin(time * 2) * 0.3; e.mesh.rotation.z = Math.sin(time * 1.5) * 0.06; }
    if (e.kind === 'boat') {
      e.mesh.position.y = 0.2 + Math.sin(time * 3 + e.x) * 0.1; e.mesh.rotation.z = Math.sin(time * 2.3 + e.z) * 0.05;
      const wake = e.mesh.getObjectByName('wake');
      if (wake) wake.scale.set(0.2 + Math.hypot(e.vx, e.vz) / 8, 1, 1);
    }
    if (e.kind === 'boss' && e.lid) e.lid.rotation.z = e.snap > 0 ? 0.9 * Math.max(0, 1 - e.snap * 3.5) : 0.65 + Math.sin(time * 3) * 0.15; // snaps shut, then creaks open
    if (e.role === 'digger') { const arm = e.mesh.getObjectByName('arm'); if (arm) arm.rotation.z = e.digging ? Math.sin(time * 4) * 0.45 : 0.2; }
    if (e.role === 'truck') {
      const bed = e.mesh.getObjectByName('bed');
      const load = bed.getObjectByName('load');
      load.scale.y = Math.max(0.01, e.load / WORKERS.truck.carry) * 0.9;
      if (e.load > 0) load.material.color.setHex(e.loadRes === 'clips' ? 0xdfe3ea : 0xf2c97d);
      bed.rotation.z = e.going === 'drop' && e.load === 0 ? 0.5 : 0;
    }
    if (e.vehicle === 'mech') e.mesh.children.filter((c) => c.name === 'leg').forEach((leg, i) => { leg.rotation.z = Math.sin(time * 10 + i * Math.PI) * Math.min(1, Math.hypot(e.vx, e.vz) / 5) * 0.5; });
  }
  for (const b of state.bases || []) {
    const health = b.hp / b.maxHp;
    b.mesh.rotation.z = (1 - Math.min(1, health * 2)) * 0.12 * (b.team === BLUE ? 1 : -1);
    if (health < 0.5 && b.hp > 0 && Math.random() < dt * (health < 0.25 ? 10 : 4)) burst(b.x + (Math.random() - 0.5) * 8, b.z + (Math.random() - 0.5) * 8, health < 0.25 ? 0x3a332c : 0x8a8178, 2, 3, 7.5);
  }
  if (sink) { waterTex.offset.x += dt * 0.012; waterTex.offset.y -= dt * 0.03; } // the ripples slide along
  for (const f of ferries) { f.g.position.set(f.x, 0.2 + Math.sin(time * 2 + f.z) * 0.05, f.z); f.g.rotation.y += dt * 0.05; }
  for (const o of outposts) {
    o.cloth.material.color.setHex(o.owner === BLUE ? COLORS[BLUE] : o.owner === RED ? COLORS[RED] : 0xc9c2b6);
    o.ring.material.opacity = 0.25 + Math.abs(o.progress) * 0.4;
    o.cloth.position.y = 2.2 + (Math.abs(o.progress)) * 1.7;
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt; q.vy -= 30 * dt;
    q.mesh.position.x += q.vx * dt; q.mesh.position.y = Math.max(0.2, q.mesh.position.y + q.vy * dt); q.mesh.position.z += q.vz * dt;
    q.mesh.rotation.x += dt * 8;
    if (q.life <= 0) { scene.remove(q.mesh); parts.splice(i, 1); }
  }
  // Camera: high and angled, leading the way you're going. Pulls back on tall screens.
  const p = state.player;
  if (p) {
    const zoom = camera.aspect < 1 ? 1.5 : 1;
    // Keep the view on the table: near an edge the car moves off-centre instead of the camera showing the dark beyond.
    const lead = new THREE.Vector3(p.x + p.vx * 0.35, 0, p.z + p.vz * 0.35);
    lead.x = Math.max(-W / 2 + 30, Math.min(W / 2 - 30, lead.x));
    lead.z = Math.max(-D / 2 + 22, Math.min(D / 2 - 14, lead.z));
    camTarget.lerp(lead, 1 - Math.exp(-4 * dt));
    // Build ghost: where a turret would go (behind you). Green = you can build here, red = you can't.
    if (!ghost) {
      ghost = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.15, 24), new THREE.MeshBasicMaterial({ color: 0x3ddc84, transparent: true, opacity: 0.45, depthWrite: false }));
      scene.add(ghost);
    }
    const gx = p.x - Math.cos(p.heading) * 4, gz = p.z - Math.sin(p.heading) * 4;
    const ok = p.alive && !canPlace(gx, gz, BLUE) && state.cereal[BLUE] >= costOf('gun');
    ghost.visible = p.alive && !state.over;
    ghost.position.set(gx, 0.1, gz);
    ghost.material.color.setHex(ok ? 0x3ddc84 : 0xff5a5f);
    ghost.material.opacity = 0.3 + Math.sin(time * 5) * 0.12;
    state.shake = Math.max(0, (state.shake || 0) - dt * 2.5);
    const sh = state.shake * 0.8;
    camera.position.set(camTarget.x + (Math.random() - 0.5) * sh, 50 * zoom, camTarget.z + 34 * zoom + (Math.random() - 0.5) * sh);
    camera.lookAt(camTarget.x, 0, camTarget.z + 2);
  }
  if (bannerTimer > 0 && (bannerTimer -= dt) <= 0) $('banner').hidden = true;
  const box = state.bases?.[RED];
  if (box?.bubble) { box.bubble.material.opacity = 0.18 + Math.sin(performance.now() / 300) * 0.06; box.bubble.rotation.y += dt * 0.3; }
  // Arrow at the screen edge pointing to the boss when it's off-camera.
  const B = state.boss, arrow = $('bossArrow');
  if (B && B.hp > 0 && !state.over) {
    const v = new THREE.Vector3(B.x, 2, B.z).project(camera);
    const off = v.x < -0.95 || v.x > 0.95 || v.y < -0.9 || v.y > 0.9;
    arrow.hidden = !off;
    if (off) {
      const k = 0.88 / Math.max(Math.abs(v.x), Math.abs(v.y)), ax = v.x * k, ay = v.y * k;
      arrow.style.left = `${(ax + 1) / 2 * innerWidth - 14}px`; arrow.style.top = `${(1 - ay) / 2 * innerHeight - 13}px`;
      arrow.style.transform = `rotate(${Math.atan2(v.x, v.y)}rad)`;
    }
  } else arrow.hidden = true;
  renderer.render(scene, camera);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- Progress and level select ----------
// Stars per level (by level number) live in localStorage; every read and write is wrapped so the game works without storage.
const SAVE_KEY = 'bb-progress-v1';
const progress = { stars: {} };
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (saved && typeof saved.stars === 'object') for (const k in saved.stars) progress.stars[k] = Math.max(0, Math.min(3, saved.stars[k] | 0));
} catch (e) { /* no storage: progress lasts until the page closes */ }
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ } }
const starsOf = (i) => progress.stars[i + 1] | 0;
const isUnlocked = () => true; // Harry: pick any level from the start (no locks); stars still save
const isPlayable = (i) => isUnlocked(i) && !LEVELS[i].soon;
const starRow = (n) => [0, 1, 2].map((k) => `<span class="${k < n ? '' : 'off'}">\u2605</span>`).join('');
const FAST_WIN = 480; // seconds: the "under 8 minutes" star
function renderLevels() {
  $('levels').innerHTML = LEVELS.map((L, i) => {
    const cls = [i === curLevel ? 'cur' : '', !isUnlocked(i) ? 'locked' : '', L.soon ? 'soon' : ''].join(' ');
    const note = L.soon ? 'coming soon' : !isUnlocked(i) ? 'locked' : '';
    return `<button data-i="${i}" class="${cls}" ${isPlayable(i) ? '' : 'aria-disabled="true"'}><b>${i + 1}</b>${L.name}${note ? `<small>${note}</small>` : `<span class="stars">${starRow(starsOf(i))}</span>`}</button>`;
  }).join('');
  for (const b of $('levels').querySelectorAll('button')) b.addEventListener('click', () => { if (isPlayable(+b.dataset.i)) selectLevel(+b.dataset.i); });
  const L = LEVELS[curLevel];
  $('lvlSub').textContent = `Mealtime Mayhem \u00b7 Level ${curLevel + 1} \u00b7 ${L.name}`;
  $('lvlBlurb').textContent = L.blurb;
  $('lvlTips').innerHTML = L.tips.map((t) => `<li>${t}</li>`).join('');
}
function selectLevel(i) {
  curLevel = i;
  reset(); // the new level shows behind the card
  renderLevels();
}
// Open on the first level you haven't won yet (or the last one you can play).
curLevel = LEVELS.findIndex((L, i) => isPlayable(i) && !starsOf(i));
if (curLevel < 0) curLevel = LEVELS.reduce((best, L, i) => (isPlayable(i) ? i : best), 0);

function endGame(won) {
  state.over = true;
  const earned = won ? 1 + (state.time < FAST_WIN ? 1 : 0) + (state.trucksLost === 0 ? 1 : 0) : 0;
  if (won && earned > starsOf(curLevel)) { progress.stars[curLevel + 1] = earned; saveProgress(); }
  else if (won) saveProgress();
  $('endTitle').textContent = won ? 'YOU WIN' : 'TOY BOX LOST';
  const mins = Math.floor(state.time / 60), secs = String(Math.floor(state.time % 60)).padStart(2, '0');
  $('endText').textContent = won
    ? `Their toy box is crumbs. Time ${mins}:${secs}. ${state.time < FAST_WIN ? 'Fast win star!' : 'Win in under 8 minutes for a star.'} ${state.trucksLost === 0 ? 'No trucks lost star!' : `You lost ${state.trucksLost} truck${state.trucksLost === 1 ? '' : 's'}: win without losing one for a star.`}`
    : `They flattened your toy box after ${mins}:${secs}. Build turrets on the caps you hold and try again.`;
  $('endStars').innerHTML = won ? starRow(earned) : '';
  const nextOk = won && LEVELS[curLevel + 1] && isPlayable(curLevel + 1);
  $('next').hidden = !nextOk;
  setTimeout(() => { sfx(won ? 'win' : 'lose'); $('end').hidden = false; }, 1200);
}
function start() {
  audioInit();
  $('start').hidden = true; $('end').hidden = true;
  reset();
}
$('play').addEventListener('click', start);
$('again').addEventListener('click', start);
$('next').addEventListener('click', () => { curLevel += 1; start(); });
$('menu').addEventListener('click', () => { $('end').hidden = true; $('start').hidden = false; selectLevel(curLevel); });
renderLevels();
reset();
requestAnimationFrame(step);
</script>
